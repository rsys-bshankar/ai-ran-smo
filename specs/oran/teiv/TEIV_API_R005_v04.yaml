components:
  schemas:
    Classifier:
      type: object
      title: Classifier
      properties:
        operation:
          type: string
          enum:
            - merge
            - delete
        classifiers:
          type: array
          items:
            type: string
        entityIds:
          type: array
          items:
            type: string
        relationshipIds:
          type: array
          items:
            type: string
    Decorator:
      type: object
      title: Decorator
      properties:
        operation:
          type: string
          enum:
            - merge
            - delete
        decorators:
          type: object
          additionalProperties: true
          description: Decorators must be defined in schema before use. Data type of a decorator is restricted as defined by its schema.
        entityIds:
          type: array
          items:
            type: string
        relationshipIds:
          type: array
          items:
            type: string
    Domains:
      type: object
      title: Domains
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              domainName:
                type: string
              entityTypes:
                $ref: '#/components/schemas/Href'
              relationshipTypes:
                $ref: '#/components/schemas/Href'
            required: ['domainName', 'entityTypes', 'relationshipTypes']
      required: ['items']
    EntityTypes:
      type: object
      title: EntityTypes
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              entityTypeName:
                type: string
              entities:
                $ref: '#/components/schemas/Href'
            required: ['entityTypeName', 'entities']
      required: ['items']
    Entities:
      type: object
      title: Entities
      properties:
        items:
          type: array
          items:
            type: object
            description: Encapsulated object reference to the data model for schema definition of Topology Entity
      required: ['items']
    RelationshipTypes:
      type: object
      title: RelationshipTypes
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              relationshipTypeName:
                type: string
              relationships:
                $ref: '#/components/schemas/Href'
            required: ['relationshipTypeName', 'relationships']
      required: ['items']
    Relationships:
      type: object
      title: Relationships
      properties:
        items:
          type: array
          items:
            type: object
            description: Encapsulated object reference to the data model for schema definition of Topology Relationships
