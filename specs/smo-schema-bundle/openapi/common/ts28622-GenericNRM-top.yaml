openapi: 3.0.3
info:
  title: 3GPP TS 28.622 Generic Network Resource Model (NRM) Base Classes
  version: 18.4.0
paths: {}
components:
  schemas:
    Top_Grp:
      type: object
      properties:
        userLabel: { type: string }
        vnfParametersList: { type: array, items: { type: object } }
    SubNetworkSingle:
      allOf:
        - $ref: './ts28532-ProvMnS-base.yaml#/components/schemas/ResourceSingle'
        - type: object
          properties:
            attributes:
              allOf:
                - $ref: '#/components/schemas/Top_Grp'
                - type: object
                  properties:
                    dnPrefix: { type: string }
                    priorityLabel: { type: integer }
    ManagedElementSingle:
      allOf:
        - $ref: './ts28532-ProvMnS-base.yaml#/components/schemas/ResourceSingle'
        - type: object
          properties:
            attributes:
              allOf:
                - $ref: '#/components/schemas/Top_Grp'
                - type: object
                  properties:
                    vendorName: { type: string }
                    swVersion: { type: string }
                    managedElementTypeList: { type: array, items: { type: string } }
