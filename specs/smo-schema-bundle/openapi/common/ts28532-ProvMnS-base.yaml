openapi: 3.0.3
info:
  title: 3GPP TS 28.532 Generic Provisioning MnS (Component A Base Contract)
  version: 18.4.0
  description: >
    Reusable Component-A CRUD interface (createMOI, getMOIAttributes,
    modifyMOIAttributes, deleteMOI) shared across all SMO modules (SO SMOS,
    SA SMOS, RAN NF OAM, DME, MDAF, AI/ML Workflow, rAppMgmt, TE&IV).
paths:
  /{className}={id}:
    put:
      operationId: createMOI
      summary: Create or replace a Managed Object Instance (3GPP TS 28.532 Sec 11.1.1)
      parameters:
        - $ref: '#/components/parameters/ClassNameParam'
        - $ref: '#/components/parameters/MoiIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSingle'
      responses:
        '201':
          description: MOI Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSingle'
        '200':
          description: MOI Replaced
    get:
      operationId: getMOIAttributes
      summary: Read MOI attributes with scope and filter (3GPP TS 28.532 Sec 11.1.2)
      parameters:
        - $ref: '#/components/parameters/ClassNameParam'
        - $ref: '#/components/parameters/MoiIdParam'
        - $ref: '#/components/parameters/ScopeParam'
        - $ref: '#/components/parameters/FilterParam'
        - $ref: '#/components/parameters/FieldsParam'
      responses:
        '200':
          description: Matching MOI subtree returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSingle'
    patch:
      operationId: modifyMOIAttributes
      summary: Modify MOI attributes via JSON Merge Patch or JSON Patch (3GPP TS 28.532 Sec 11.1.3)
      parameters:
        - $ref: '#/components/parameters/ClassNameParam'
        - $ref: '#/components/parameters/MoiIdParam'
        - $ref: '#/components/parameters/ScopeParam'
        - $ref: '#/components/parameters/FilterParam'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ResourceSingle'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatchDocument'
      responses:
        '200':
          description: MOI Attributes Modified
    delete:
      operationId: deleteMOI
      summary: Delete MOI or subtree (3GPP TS 28.532 Sec 11.1.4)
      parameters:
        - $ref: '#/components/parameters/ClassNameParam'
        - $ref: '#/components/parameters/MoiIdParam'
        - $ref: '#/components/parameters/ScopeParam'
        - $ref: '#/components/parameters/FilterParam'
      responses:
        '200':
          description: Deleted MOI URI list returned
components:
  parameters:
    ClassNameParam:
      name: className
      in: path
      required: true
      schema:
        type: string
      description: 3GPP Component-B Information Object Class name (e.g., Intent, AssuranceClosedControlLoop, NRCellDU, AIMLModel)
    MoiIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Relative Distinguished Name (RDN) identifier of the target MOI
    ScopeParam:
      name: scope
      in: query
      required: false
      schema:
        type: object
        properties:
          scopeType:
            type: string
            enum: [BASE_ONLY, BASE_ALL, BASE_NTH_LEVEL, BASE_SUBTREE]
            default: BASE_ONLY
          scopeLevel:
            type: integer
            minimum: 0
    FilterParam:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: XPath 1.0 or JSONPath filter expression applied to target MOI attributes
    FieldsParam:
      name: fields
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
  schemas:
    ResourceSingle:
      type: object
      required: [id, objectClass, attributes]
      properties:
        id:
          type: string
        objectClass:
          type: string
        objectInstance:
          type: string
          description: Full Distinguished Name (DN) per 3GPP TS 32.300
        moiVersion:
          type: integer
        attributes:
          type: object
          additionalProperties: true
    JsonPatchDocument:
      type: array
      items:
        type: object
        required: [op, path]
        properties:
          op:
            type: string
            enum: [add, remove, replace, move, copy, test]
          path:
            type: string
          value: {}
