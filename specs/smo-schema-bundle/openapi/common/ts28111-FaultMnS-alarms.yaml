openapi: 3.0.3
info:
  title: 3GPP TS 28.111 & TS 28.532 Fault Supervision MnS
  version: 18.4.0
paths:
  /AlarmList={id}:
    get:
      operationId: getAlarmList
      summary: Query active alarms using ProvMnS getMOIAttributes semantics
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Active AlarmList returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmListSingle'
  /notifications/alarms:
    post:
      operationId: notifyAlarmEvent
      summary: Emit notifyNewAlarm, notifyChangedAlarm, or notifyClearedAlarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmRecord'
      responses:
        '204':
          description: Alarm notification processed
components:
  schemas:
    AlarmListSingle:
      type: object
      properties:
        id: { type: string }
        attributes:
          type: object
          properties:
            administrativeState: { type: string, enum: [LOCKED, UNLOCKED] }
            operationalState: { type: string, enum: [ENABLED, DISABLED] }
            numOfAlarmRecords: { type: integer }
            alarmRecords:
              type: array
              items:
                $ref: '#/components/schemas/AlarmRecord'
    AlarmRecord:
      type: object
      required: [alarmId, objectInstance, alarmType, probableCause, perceivedSeverity, alarmRaisedTime]
      properties:
        alarmId: { type: string }
        objectInstance: { type: string }
        notificationId: { type: integer }
        alarmType:
          type: string
          enum: [COMMUNICATIONS_ALARM, QUALITY_OF_SERVICE_ALARM, PROCESSING_ERROR_ALARM, EQUIPMENT_ALARM, ENVIRONMENTAL_ALARM]
        probableCause: { type: string }
        specificProblem: { type: string }
        perceivedSeverity:
          type: string
          enum: [CRITICAL, MAJOR, MINOR, WARNING, INDETERMINATE, CLEARED]
        alarmRaisedTime: { type: string, format: date-time }
        alarmChangedTime: { type: string, format: date-time }
        alarmClearedTime: { type: string, format: date-time }
        ackState: { type: string, enum: [ACKNOWLEDGED, UNACKNOWLEDGED] }
        additionalText: { type: string }
