# Contract of the aimgf module (plan tasks S0.5, S0.6). Paths are relative to the module's R1 root; ProvMnS classes are listed in
# x-smo-classes and reached at the one form of ../common/provmns-root.yaml. [N] classes are $refs into specs/5G_APIs; [D] items carry
# x-smo-design with their ADR 0011 section 6 id. scripts/check_contract_drift.py compares this file with docs/openapi of x-smo-code-modules.
openapi: 3.0.1
info:
  title: 'AIMgF: TS 28.105 AI/ML management and the R1 AI/ML workflow services (absorbs MLMR and MLLF)'
  version: 0.1.0
  description: All twenty TS 28.105 v19.5.0 classes over ProvMnS (ADR 0010 section 3.2), the R1GAP v14 section 5.6 services realised on them (x-smo-r1gap-services),
    TS 29.482 storage profiles, and the 14-state governance (D-07) with its servingState mapping (R3).
x-smo-module: aimgf
x-smo-code-modules:
- aimgf
x-smo-mns-root: ../common/provmns-root.yaml
x-smo-standards:
- '[N] TS 28.105 v19.5.0'
- '[N] O-RAN R1GAP v14 section 5.6 (realised on TS 28.105; R1AP API pending)'
- '[N] TS 29.482 v19.1.0'
- '[D] D-07, D-08'
paths:
  /health:
    $ref: ../common/probes.yaml#/paths/~1health
  /live:
    $ref: ../common/probes.yaml#/paths/~1live
  /ready:
    $ref: ../common/probes.yaml#/paths/~1ready
  /version:
    $ref: ../common/probes.yaml#/paths/~1version
  /{className}={id}:
    $ref: ../common/provmns-root.yaml#/paths/~1{className}={id}
  /{URI-LDN-first-part}:
    $ref: ../common/provmns-root.yaml#/paths/~1{URI-LDN-first-part}
  /mlr-mlmm/v1/storages:
    $ref: ../../../5G_APIs/TS29482_MLR_MLModelManagement.yaml#/paths/~1storages
  /mlr-mlmm/v1/storages/{storageId}:
    $ref: ../../../5G_APIs/TS29482_MLR_MLModelManagement.yaml#/paths/~1storages~1{storageId}
  /model-lifecycles:
    get:
      operationId: get_model_lifecycles
      summary: D-07 model governance on the 14-state lifecycle (operator gates, certification)
      x-smo-design: D-07
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
  /model-lifecycles/counts:
    get:
      operationId: get_model_lifecycles_counts
      summary: D-07 model governance on the 14-state lifecycle (operator gates, certification)
      x-smo-design: D-07
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
  /models/{model_id}/advance:
    post:
      operationId: post_models_model_id_advance
      summary: D-07 model governance on the 14-state lifecycle (operator gates, certification)
      x-smo-design: D-07
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
  /models/{model_id}/governance-history:
    get:
      operationId: get_models_model_id_governance_history
      summary: D-07 model governance on the 14-state lifecycle (operator gates, certification)
      x-smo-design: D-07
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
  /models/{model_id}/lifecycle:
    get:
      operationId: get_models_model_id_lifecycle
      summary: D-07 model governance on the 14-state lifecycle (operator gates, certification)
      x-smo-design: D-07
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
  /models/{model_id}/lifecycle-history:
    get:
      operationId: get_models_model_id_lifecycle_history
      summary: D-07 model governance on the 14-state lifecycle (operator gates, certification)
      x-smo-design: D-07
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
  /models/{model_id}/owner:
    put:
      operationId: put_models_model_id_owner
      summary: D-08 model owner (SEC-15.3
      x-smo-design: D-08
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    MLModel-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLModel-Single
    MLModelRepository-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLModelRepository-Single
    MLModelCoordinationGroup-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLModelCoordinationGroup-Single
