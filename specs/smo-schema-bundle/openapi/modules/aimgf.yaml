    MLTestingFunction-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLTestingFunction-Single
    MLTestingRequest-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLTestingRequest-Single
    MLTestingReport-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLTestingReport-Single
    MLModelLoadingPolicy-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLModelLoadingPolicy-Single
    MLModelLoadingRequest-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLModelLoadingRequest-Single
    MLModelLoadingProcess-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLModelLoadingProcess-Single
    MLUpdateFunction-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLUpdateFunction-Single
    MLUpdateRequest-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLUpdateRequest-Single
    MLUpdateProcess-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLUpdateProcess-Single
    MLUpdateReport-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/MLUpdateReport-Single
    AIMLInferenceFunction-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/AIMLInferenceFunction-Single
    AIMLInferenceReport-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/AIMLInferenceReport-Single
    AIMLInferenceEmulationFunction-Single:
      $ref: ../../../5G_APIs/TS28105_AiMlNrm.yaml#/components/schemas/AIMLInferenceEmulationFunction-Single
    NtfSubscriptionControl-Single:
      $ref: ../../../5G_APIs/TS28623_SubscriptionControlNrm.yaml#/components/schemas/NtfSubscriptionControl-Single
    MLModelGovernance-Single:
      x-smo-design: D-07
      type: object
      required:
      - id
      properties:
        id:
          type: string
        objectClass:
          type: string
          enum:
          - MLModelGovernance
        objectInstance:
          type: string
        attributes:
          type: object
          properties:
            mLModelRef: &id001
              type: string
            lifecycleState:
              type: string
              enum:
              - REGISTERED
              - TRAINING
              - TRAINED
              - VALIDATING
              - VALIDATED
              - EMULATING
              - EMULATED
              - PENDING_APPROVAL
              - APPROVED
              - CERTIFIED
              - PROMOTED
              - DEPRECATED
              - RETIRED
              - FAILED
            runtimeState:
              type: string
              enum:
              - NOT_DEPLOYED
              - DEPLOYMENT_REQUESTED
              - DEPLOYED
              - ACTIVATING
              - ACTIVE
              - SCALING
              - TERMINATING
              - TERMINATED
            servingState:
              type: string
              enum:
              - REGISTERED
              - VALIDATED
              - SERVING_ACTIVE
              - DEPRECATED
              readOnly: true
              description: 'The bundle''s servingState, derived (R3, ADR 0010 section 3.4): x-smo-serving-state-map from lifecycleState, and SERVING_ACTIVE when lifecycleState
                is CERTIFIED or PROMOTED and runtimeState is ACTIVE'
            owner:
              type: string
              description: D-08 model owner (SEC-15.3; package-level from S4.7)
              x-smo-design: D-08
            decisions:
              type: array
              items:
                type: object
                properties:
                  event: *id001
                  decidedBy: *id001
                  decidedAt:
                    type: string
                    format: date-time
                  reason: *id001
          x-smo-serving-state-map:
            REGISTERED: REGISTERED
            TRAINING: REGISTERED
            TRAINED: REGISTERED
            VALIDATING: REGISTERED
            FAILED: REGISTERED
            VALIDATED: VALIDATED
            EMULATING: VALIDATED
            EMULATED: VALIDATED
            PENDING_APPROVAL: VALIDATED
            APPROVED: VALIDATED
            CERTIFIED: VALIDATED
            PROMOTED: VALIDATED
            DEPRECATED: DEPRECATED
            RETIRED: DEPRECATED
