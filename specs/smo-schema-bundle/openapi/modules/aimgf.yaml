x-smo-pending:
- The O-RAN R1AP API of the section 5.6 services is not in specs/; until it is, they are realised on the TS 28.105 classes as listed
x-smo-r1gap-services:
- service: 5.6.2 AI/ML model registration
  producer: AIMgF
  realisation: MLModel createMOI / modifyMOIAttributes / deleteMOI
- service: 5.6.3 AI/ML model storage
  producer: AIMgF
  realisation: artifact in the object store (D10); location in MLModel; TS 29.482 storages
- service: 5.6.4 AI/ML model discovery
  producer: AIMgF
  realisation: MLModel getMOIAttributes with scope and filter
- service: 5.6.5 AI/ML model change subscription
  producer: AIMgF
  realisation: NtfSubscriptionControl on MLModel
- service: 5.6.6 AI/ML model training capability registration
  producer: AIMgF
  realisation: MLTrainingFunction createMOI by a trainer rApp
- service: 5.6.7 AI/ML model deployment request
  producer: AIMgF
  realisation: MLModelLoadingRequest createMOI (the deploy gate in process)
- service: 5.6.8 AI/ML model training
  producer: AIMgF or a trainer
  realisation: MLTrainingRequest / MLTrainingProcess
- service: 5.6.9 AI/ML model performance monitoring
  producer: the consumer rApp
  realisation: AIMgF subscribes; feeds the PSI breaker (S7.6)
- service: 5.6.10 AI/ML model inference
  producer: model producer or AIMgF
  realisation: AIMLInferenceFunction, AIMLInferenceReport
- service: 5.6.11 AI/ML model training capability query
  producer: AIMgF
  realisation: MLTrainingFunction getMOIAttributes
