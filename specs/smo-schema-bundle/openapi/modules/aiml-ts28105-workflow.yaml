openapi: 3.0.3
info:
  title: AI/ML Workflow Management Service (O-RAN WG2 R1 + 3GPP TS 28.105)
  version: 18.4.0
paths:
  /AIMLModel={id}:
    $ref: '../common/ts28532-ProvMnS-base.yaml#/paths/~1{className}={id}'
  /MLTrainingRequest={id}:
    $ref: '../common/ts28532-ProvMnS-base.yaml#/paths/~1{className}={id}'
components:
  schemas:
    AIMLModelSingle:
      allOf:
        - $ref: '../common/ts28532-ProvMnS-base.yaml#/components/schemas/ResourceSingle'
        - type: object
          properties:
            attributes:
              type: object
              properties:
                modelId: { type: string }
                modelVersion: { type: string }
                optimizationDomain: { type: string }
                artifactUri: { type: string }
                validationAccuracy: { type: number }
                servingState: { type: string, enum: [REGISTERED, VALIDATED, SERVING_ACTIVE, DEPRECATED] }
