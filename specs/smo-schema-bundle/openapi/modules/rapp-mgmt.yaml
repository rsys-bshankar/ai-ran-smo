# Contract of the rapp-mgmt module (plan tasks S0.5, S0.6). Paths are relative to the module's R1 root; ProvMnS classes are listed in
# x-smo-classes and reached at the one form of ../common/provmns-root.yaml. [N] classes are $refs into specs/5G_APIs; [D] items carry
# x-smo-design with their ADR 0011 section 6 id. scripts/check_contract_drift.py compares this file with docs/openapi of x-smo-code-modules.
openapi: 3.0.1
info:
  title: 'rApp Management: R1GAP v14 section 5.7 registration; RappPackage and RappInstance over ProvMnS (D-19)'
  version: 0.1.0
  description: No 3GPP IOC exists for an rApp, so RappPackage, RappInstance and RappRegistration are [D] classes (ADR 0011 D-19) served with the standard ProvMnS
    operations. Instance states are the HLD's six; faults are TS 28.111 alarms and performance is TS 28.622 PerfMetricJob on the instance.
x-smo-module: rapp-mgmt
x-smo-code-modules:
- rapp-mgmt
x-smo-mns-root: ../common/provmns-root.yaml
x-smo-standards:
- '[N] O-RAN R1GAP v14 section 5.7 (R1AP API pending)'
- '[N] TS 28.532 ProvMnS v19.2.0'
- '[N] TS 28.111 v19.3.0'
- '[D] D-09, D-19'
paths:
  /health:
    $ref: ../common/probes.yaml#/paths/~1health
  /live:
    $ref: ../common/probes.yaml#/paths/~1live
  /ready:
    $ref: ../common/probes.yaml#/paths/~1ready
  /version:
    $ref: ../common/probes.yaml#/paths/~1version
  /{className}={id}:
    $ref: ../common/provmns-root.yaml#/paths/~1{className}={id}
  /{URI-LDN-first-part}:
    $ref: ../common/provmns-root.yaml#/paths/~1{URI-LDN-first-part}
  /instances/{instance_id}/operator-api:
    delete:
      operationId: delete_instances_instance_id_operator_api
      summary: D-09 rApp operator page declaration (ADR 0004)
      x-smo-design: D-09
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: get_instances_instance_id_operator_api
      summary: D-09 rApp operator page declaration (ADR 0004)
      x-smo-design: D-09
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: put_instances_instance_id_operator_api
      summary: D-09 rApp operator page declaration (ADR 0004)
      x-smo-design: D-09
      responses:
        '200':
          description: As the module answers today; the shape is fixed by its PR-CONV stage
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    AlarmList-Single:
      $ref: ../../../5G_APIs/TS28111_FaultNrm.yaml#/components/schemas/AlarmList-Single
    PerfMetricJob-Single:
      $ref: ../../../5G_APIs/TS28623_PmControlNrm.yaml#/components/schemas/PerfMetricJob-Single
    NtfSubscriptionControl-Single:
      $ref: ../../../5G_APIs/TS28623_SubscriptionControlNrm.yaml#/components/schemas/NtfSubscriptionControl-Single
    RappPackage-Single:
      x-smo-design: D-19
      type: object
      required:
      - id
      properties:
        id:
          type: string
        objectClass:
          type: string
          enum:
          - RappPackage
        objectInstance:
          type: string
        attributes:
          type: object
          properties:
            packageName: &id001
              type: string
            packageVersion: *id001
            provider: *id001
            csarDigest: *id001
            packageState:
              type: string
              enum:
              - ONBOARDED
              - PRIMED
              - DEPRECATED
            administrativeState:
              type: string
              enum:
              - LOCKED
              - UNLOCKED
            intentCapabilityProfile:
              type: object
              properties:
                optimizationDomains:
                  type: array
                  items: *id001
                supportedExpectationTypes:
                  type: array
                  items:
                    type: string
                    enum:
                    - RadioNetworkExpectation
                    - RadioServiceExpectation
                supportedObjectTypes:
                  type: array
                  items:
                    type: string
                    enum:
                    - RAN_SUBNETWORK
                    - RADIO_SERVICE
                multiClusterSupport:
                  type: boolean
                maxConcurrentIntents:
                  type: integer
                  minimum: 1
            aimlModelDependencies:
              type: array
              items:
                type: object
                properties:
                  modelName: *id001
                  modelVersion: *id001
                  modelRole:
                    type: string
                    enum:
                    - WARM_START_BASELINE
                    - INFERENCE
                  minValidationAccuracy:
                    type: number
                    minimum: 0
                    maximum: 1
            requiredR1Services:
              type: array
              items:
                type: object
                properties:
                  serviceApiCategory: *id001
    RappInstance-Single:
      x-smo-design: D-19
      type: object
      required:
      - id
      properties:
        id:
          type: string
        objectClass:
          type: string
          enum:
          - RappInstance
        objectInstance:
          type: string
        attributes:
          type: object
          properties:
            rappPackageRef: *id001
            rAppId: *id001
            instanceState:
              type: string
              enum:
              - CREATE_INSTANCE
              - DEPLOYING
              - RUNNING
              - UPGRADING
              - TERMINATING
              - FAULTED
            oCloudDeploymentRef: *id001
            capifInvokerId: *id001
            configuration:
              type: object
            operatorApiBase:
              type: string
              description: D-09 the rApp's declared operator page (ADR 0004)
              x-smo-design: D-09
    RappRegistration-Single:
      x-smo-design: D-19
      type: object
      required:
      - id
      properties:
        id:
          type: string
        objectClass:
          type: string
          enum:
          - RappRegistration
        objectInstance:
          type: string
        attributes:
          type: object
          properties:
            rAppId:
              type: string
              readOnly: true
              description: Random, assigned by rApp Management (R1GAP v14 section 5.7.2, S4.8)
            rappInstanceRef: *id001
            registrationState:
              type: string
              enum:
              - REGISTERED
              - DEREGISTERED
x-smo-classes:
- class: AlarmList
  standard: '[N] TS 28.111 v19.3.0'
  operations:
  - getMOIAttributes
  schema: '#/components/schemas/AlarmList-Single'
  note: Faults of rApp instances
- class: PerfMetricJob
  standard: '[N] TS 28.622 (OpenAPI TS 28.623 PmControlNrm v19.2.0)'
  operations: &id002
  - createMOI
  - getMOIAttributes
  - modifyMOIAttributes
  - deleteMOI
  schema: '#/components/schemas/PerfMetricJob-Single'
- class: NtfSubscriptionControl
  standard: '[N] TS 28.622 subscription control (OpenAPI TS 28.623 SubscriptionControlNrm v19.4.0)'
  operations: *id002
  schema: '#/components/schemas/NtfSubscriptionControl-Single'
- class: RappPackage
  standard: '[D] ADR 0011 D-19'
  operations: *id002
  schema: '#/components/schemas/RappPackage-Single'
  x-smo-design: D-19
- class: RappInstance
  standard: '[D] ADR 0011 D-19'
  operations: *id002
  schema: '#/components/schemas/RappInstance-Single'
  x-smo-design: D-19
- class: RappRegistration
  standard: '[D] ADR 0011 D-19'
  operations:
  - createMOI
  - getMOIAttributes
  - deleteMOI
  schema: '#/components/schemas/RappRegistration-Single'
  x-smo-design: D-19
  note: R1GAP v14 section 5.7.2 registration of rApps
x-smo-pending:
- The O-RAN R1AP API of R1GAP v14 section 5.7 is not in specs/; registration is the RappRegistration class until it is
