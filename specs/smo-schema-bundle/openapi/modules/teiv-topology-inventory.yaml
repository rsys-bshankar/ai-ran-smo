openapi: 3.0.3
info:
  title: TE&IV Topology Exposure & Inventory Service (O-RAN WG10 TE&IV + 3GPP TS 28.622 / 28.541)
  version: 18.4.0
paths:
  /SubNetwork={id}:
    $ref: '../common/ts28532-ProvMnS-base.yaml#/paths/~1{className}={id}'
  /domains/{domainName}/relationship-types/{relationshipType}/relationships:
    get:
      operationId: getTopologyRelationships
      summary: Query graph edges (CO_COVERAGE_OVERLAY, NEIGHBOR_CELL, HOSTED_ON_OCLOUD)
      parameters:
        - name: domainName
          in: path
          required: true
          schema: { type: string, example: "RAN_O_CLOUD" }
        - name: relationshipType
          in: path
          required: true
          schema: { type: string, example: "CO_COVERAGE_OVERLAY" }
        - name: targetFilter
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Topology graph relationships returned }
