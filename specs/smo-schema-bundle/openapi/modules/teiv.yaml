# Each WG10 TE&IV R1 operation (O-RAN.WG10.TS.TE&IV-API.0-R005-v04.00, OpenAPI 1.2.1) against smo-teiv 0.3.0's own API ("Topology Exposure and Inventory API"
# 1.2.0, docs/offeredapis of the 0.3.0 tag), which TE&IV passes each one to (ADR 0013 section 7; the spike's R1_OPERATIONS). Compared by method, path,
# operationId, parameters, request body and response codes (S3.24): every operation exists in smo-teiv under the same method, path and operationId, with
# the same parameters and request body. `same`: no difference. `differs`: what differs, and what TE&IV does about it.
x-smo-teiv-api:
  standard: O-RAN.WG10.TS.TE&IV-API.0-R005-v04.00 (info.version 1.2.1)
  implementation: O-RAN-SC smo-teiv 0.3.0 (info.version 1.2.0)
  common-differences:
  - 'Collection answers (Domains, EntityTypes, Entities, RelationshipTypes, Relationships, Schemas): smo-teiv adds HAL-style paging links (self, first, prev,
    next, last: Href) the standard does not define, and does not declare the standard''s `required` members (domainName, entityTypes, relationshipTypes;
    entityTypeName, entities; relationshipTypeName, relationships). A consumer of the standard ignores the extra links; S3.19 checks the required members are
    present in what smo-teiv returns.'
  operations:
  - { operationId: getAllDomains, method: GET, path: /domains, mapping: same }
  - { operationId: getTopologyEntityTypes, method: GET, path: '/domains/{domainName}/entity-types', mapping: same }
  - { operationId: getTopologyByEntityTypeName, method: GET, path: '/domains/{domainName}/entity-types/{entityTypeName}/entities', mapping: same }
  - { operationId: getTopologyById, method: GET, path: '/domains/{domainName}/entity-types/{entityTypeName}/entities/{entityId}', mapping: same }
  - { operationId: getAllRelationshipsForEntityId, method: GET, path: '/domains/{domainName}/entity-types/{entityTypeName}/entities/{entityId}/relationships',
      mapping: same }
  - { operationId: getTopologyRelationshipTypes, method: GET, path: '/domains/{domainName}/relationship-types', mapping: same }
  - { operationId: getRelationshipsByType, method: GET, path: '/domains/{domainName}/relationship-types/{relationshipTypeName}/relationships', mapping: same }
  - { operationId: getRelationshipById, method: GET, path: '/domains/{domainName}/relationship-types/{relationshipTypeName}/relationships/{relationshipId}',
      mapping: same }
  - { operationId: getSchemas, method: GET, path: /schemas, mapping: same }
  - { operationId: getSchemaByName, method: GET, path: '/schemas/{schemaName}/content', mapping: same }
  - { operationId: createUserDefinedSchema, method: POST, path: /user-defined-schemas, mapping: same,
      note: 'classifiers and decorators only (TE&IV-CIMI R005 v07 section 4.5): it cannot add entity or relationship types, in the standard or in smo-teiv' }
  - { operationId: getUserDefinedSchemas, method: GET, path: /user-defined-schemas, mapping: same }
  - { operationId: getUserDefinedSchemaByName, method: GET, path: '/user-defined-schemas/{schemaName}/content', mapping: same }
  - { operationId: deleteUserDefinedSchema, method: DELETE, path: '/user-defined-schemas/{schemaName}', mapping: same }
  - { operationId: updateClassifier, method: POST, path: /manage-classifiers, mapping: differs,
      note: 'smo-teiv may answer 409 Conflict, a code the standard does not list for this operation; TE&IV passes it on (a 4xx the consumer must handle anyway)' }
  - { operationId: updateDecorator, method: POST, path: /manage-decorators, mapping: differs,
      note: 'smo-teiv may answer 409 Conflict, a code the standard does not list for this operation; TE&IV passes it on' }
  internal-only:
  - 'smo-teiv''s operations the standard does not have stay internal, none of them in this contract: groups (/groups...), createSchema and deleteSchema
    (POST /schemas, DELETE /schemas/{schemaName}), getEntitiesByDomain (GET /domains/{domainName}/entities) and the deprecated /classifiers and /decorators.'
# The TE&IV data model (O-RAN.WG10.TS.TE&IV-DM.0-R005-v06.00) has no NRCellRelation and no neighbour relationship, no SubNetwork, CommonBeamformingFunction,
# NRFreqRelation or SON class; TE&IV carries them as its own domain modules (teiv/model/smo-teiv-ext-ran.yang, smo-teiv-ext-oam.yang), extended only by new
# modules, as the data model allows (teiv/model/check_extension.py). In the WG10 API they are the domains below.
x-smo-teiv-domains:
- { domain: EXT_RAN, module: smo-teiv-ext-ran, x-smo-design: D-24 }
- { domain: EXT_OAM, module: smo-teiv-ext-oam, x-smo-design: D-24 }
x-smo-pending:
- 'CO_COVERAGE_OVERLAY has no standard carrier: it is a relationship of TE&IV''s extension domain EXT_RAN (D-24). HOSTED_ON_OCLOUD is carried by the data
  model''s o-ran-smo-teiv-rel-cloud-ran (TE&IV-DM v06 Annex G) once FOCOM writes the hosting edges (S4.5).'
