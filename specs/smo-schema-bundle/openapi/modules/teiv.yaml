  /topology-inventory/v1/domains/{domainName}/entity-types/{entityTypeName}/entities/{entityId}:
    $ref: ../../../oran/teiv/TEIV_API_R005_v04.yaml#/paths/~1domains~1{domainName}~1entity-types~1{entityTypeName}~1entities~1{entityId}
  /topology-inventory/v1/domains/{domainName}/entity-types/{entityTypeName}/entities/{entityId}/relationships:
    $ref: ../../../oran/teiv/TEIV_API_R005_v04.yaml#/paths/~1domains~1{domainName}~1entity-types~1{entityTypeName}~1entities~1{entityId}~1relationships
  /topology-inventory/v1/domains/{domainName}/relationship-types:
    $ref: ../../../oran/teiv/TEIV_API_R005_v04.yaml#/paths/~1domains~1{domainName}~1relationship-types
  /topology-inventory/v1/domains/{domainName}/relationship-types/{relationshipTypeName}/relationships:
    $ref: ../../../oran/teiv/TEIV_API_R005_v04.yaml#/paths/~1domains~1{domainName}~1relationship-types~1{relationshipTypeName}~1relationships
  /topology-inventory/v1/domains/{domainName}/relationship-types/{relationshipTypeName}/relationships/{relationshipId}:
    $ref: ../../../oran/teiv/TEIV_API_R005_v04.yaml#/paths/~1domains~1{domainName}~1relationship-types~1{relationshipTypeName}~1relationships~1{relationshipId}
