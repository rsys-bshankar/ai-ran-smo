openapi: 3.0.3
info:
  title: SME Service Management & Exposure (O-RAN WG2 R1 + 3GPP TS 23.222 CAPIF + TS 28.533 MnS Registry)
  version: 18.4.0
paths:
  /published-apis/v1/{apfId}/service-apis:
    post:
      operationId: publishServiceApi
      summary: Publish an R1 or SBMA Management Service API (TS 23.222 CAPIF-2e)
      parameters:
        - name: apfId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Service API Published }
  /allServiceAPIs:
    get:
      operationId: discoverServiceApis
      summary: Discover active rApp or SMO MnS endpoints by apiCategory or intentCapabilityProfile (TS 23.222 CAPIF-1e)
      parameters:
        - name: api-Invoker-Id
          in: query
          required: true
          schema: { type: string }
        - name: api-cat
          in: query
          required: false
          schema: { type: string }
        - name: optimization-domain
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Matching ServiceAPIDescriptions returned }
