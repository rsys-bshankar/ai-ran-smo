openapi: 3.0.3
info:
  title: SO SMOS Centralized Playbook & 3GPP TS 28.312 Intent MnS
  version: 18.4.0
  description: >
    Inherits Component-A CRUD operations from common/ts28532-ProvMnS-base.yaml
    and specializes Component-B for Level-1 Service Goal Intents (GUI -> SO SMOS -> rApp)
    and Level-2 Resource Actuation Intents (rApp -> R1 -> SO SMOS).
paths:
  /Intent={id}:
    $ref: '../common/ts28532-ProvMnS-base.yaml#/paths/~1{className}={id}'
components:
  schemas:
    IntentSingle:
      allOf:
        - $ref: '../common/ts28532-ProvMnS-base.yaml#/components/schemas/ResourceSingle'
        - type: object
          properties:
            attributes:
              type: object
              required: [intentLevel, intentExpectations]
              properties:
                userLabel: { type: string }
                intentLevel:
                  type: string
                  enum: [LEVEL_1_SERVICE_GOAL, LEVEL_2_RESOURCE_ACTUATION]
                parentIntentId: { type: string }
                intentPriority: { type: integer, minimum: 1, maximum: 100 }
                intentExpectations:
                  type: array
                  items:
                    $ref: '#/components/schemas/IntentExpectation'
                intentFulfilmentInfo:
                  $ref: '#/components/schemas/IntentFulfilmentInfo'
    IntentExpectation:
      type: object
      required: [expectationId, expectationVerb, expectationObject, expectationTargets]
      properties:
        expectationId: { type: string }
        expectationVerb:
          type: string
          enum: [OPTIMIZE, MAINTAIN, ENSURE, CONFIGURE_NRM]
        expectationObject:
          type: object
          properties:
            objectType: { type: string, enum: [SubNetwork, NRCellDU, NRCellRelation] }
            objectInstanceList: { type: array, items: { type: string } }
        nrmActuationDeltas:
          type: array
          items:
            type: object
            properties:
              moiDn: { type: string }
              attributeList: { type: object }
        expectationTargets:
          type: array
          items:
            type: object
            properties:
              targetName: { type: string }
              targetCondition: { type: string, enum: [IS_GREATER_THAN, IS_LESS_THAN, IS_EQUAL_TO] }
              targetValueRange: { type: string }
    IntentFulfilmentInfo:
      type: object
      properties:
        fulfilmentStatus: { type: string, enum: [FULFILLED, NOT_FULFILLED, IN_PROGRESS, DEGRADED] }
        notFulfilledState: { type: string, nullable: true }
        notFulfilledReasons: { type: string, nullable: true }
