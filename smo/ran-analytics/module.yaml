# ran-analytics: what this module is to the rest of the SMO (scripts/modules.py; the schema is scripts/module.schema.json). Edit this file, then run
# `python scripts/modules.py --write` from smo/: it regenerates the shared files that list modules, and CI runs `--check`.
name: ran-analytics
lane: ran-analytics
r1:
  - {prefix: /ran-analytics, env: RAN_ANALYTICS_URL, url: "http://ran-analytics:8000"}
database:
  role: {schema: ran_analytics, shared: [module_identity]}
  tables: [mdaf_producer]
openapi: true
tests: {source: app, pythonpath: ".:../shared", floor: 100}
mutation: null
code_docs: true
config_reference: false
compose:
  services: |
    ran-analytics:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: ran-analytics, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      stop_grace_period: 30s
      secrets: [db_password_ran-analytics, enrollment_secret]
      <<: *hardening
      healthcheck: *ready_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
        SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_ran_analytics@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_ran-analytics
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway
  secrets: |
    db_password_ran-analytics:
      file: ./secrets/db_password_ran-analytics
helm: |
  ran-analytics: { image: ran-analytics, databaseRole: ran-analytics, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
