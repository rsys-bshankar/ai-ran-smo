# TLS edge for the compose `tls` profile (PR-SEC-1): terminates HTTPS in front of the operator GUI and R1
# Termination, which keep speaking plain HTTP on the compose network (the services never see the certificate).
#
#   https://localhost:3443  ->  gui:8080            the operator GUI (SPA and /api)
#   https://localhost:8443  ->  r1-termination:8000 the R1 gateway for rApps and other consumers
#
# The certificate and key are Compose secrets (scripts/make_dev_certs.sh makes development ones). The plain
# ports 3000 and 8080 stay as they are: the profile adds an HTTPS door, it does not close the HTTP one; remove the
# `ports:` of `gui` and `r1-termination` in a deployment that should only be reachable over TLS.

ssl_certificate     /run/secrets/tls_cert;
ssl_certificate_key /run/secrets/tls_key;
ssl_protocols       TLSv1.2 TLSv1.3;
# TLS 1.2 suites: ECDHE with an AEAD cipher only (no CBC: LUCKY13, no static RSA key exchange), the server's order. TLS 1.3 suites are all AEAD and need no list. (testssl.sh, PR-V-7)
ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;
ssl_session_cache   shared:SSL:2m;
ssl_session_timeout 1h;
ssl_session_tickets off;
server_tokens       off;

server {
    listen 3443 ssl;
    http2 on;

    # HSTS (PR-SEC-1.4). A day here, not the year a production edge uses, so a development certificate does not pin a
    # browser to HTTPS for localhost for months; set it to at least 31536000 on the real edge.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    location / {
        proxy_pass http://gui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;     # as the GUI's own nginx: longer than the BFF's 65 s rApp operator call (DOC-CF-2.6)
        client_max_body_size 50m;   # AI/ML model artifact uploads, as the GUI's own nginx
    }
}

server {
    listen 8443 ssl;
    http2 on;

    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # R1's own /metrics is for the scraper on the container network (PR-OBS-2.3)
    location = /metrics { return 404; }

    # The OAuth2 token endpoint, the one path a consumer reaches without a token (PR-SEC-1.6): /bootstrap advertises it as
    # <R1_PUBLIC_BASE_URL>/sme/oauth2/token when that is set. Every other /sme/... path goes through R1, which checks the token.
    location = /sme/oauth2/token {
        proxy_pass http://sme:8000/oauth2/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # PR-SEC-9.2: /bootstrap is unauthenticated (an rApp calls it before it has a token; SECURITY.md says what it reveals). To let only the
    # rApps' network reach it through this door, uncomment and put your ranges in (the `location =` outranks `location /`, so every other path is
    # unchanged; the gateway's own R1_BOOTSTRAP_KEY is the other control). The development edge leaves it open.
    #
    # location = /bootstrap {
    #     allow 10.0.0.0/8;          # the rApps' network
    #     deny  all;
    #     proxy_pass http://r1-termination:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    # }

    location / {
        proxy_pass http://r1-termination:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;     # R1 answers 504 itself after 60 s (R1_UPSTREAM_TIMEOUT_SECONDS)
        client_max_body_size 50m;   # R1 enforces its own, smaller caps (R1_MAX_BODY_BYTES)
    }
}
