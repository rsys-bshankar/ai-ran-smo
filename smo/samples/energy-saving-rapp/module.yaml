# energy-saving-rapp: what this module is to the rest of the SMO (scripts/modules.py; the schema is scripts/module.schema.json). Edit this file, then run
# `python scripts/modules.py --write` from smo/: it regenerates the shared files that list modules, and CI runs `--check`.
name: energy-saving-rapp
lane: samples
r1: []
database:
  role: {schema: energy_saving_rapp, shared: [module_identity, idempotency_key, notification_outbox, periodic_run, smo_event, smo_event_relay]}
  tables: [energy_saving_cell, energy_saving_decision, energy_saving_instance]
openapi: true
tests: {source: app, pythonpath: ".:../../shared:../../sdk", floor: 98}
mutation: null
code_docs: true
config_reference: true
compose:
  services: |
    # Wave 10.1: the EnergySaving reference rApp (samples/energy-saving-rapp)
    # — an R1 consumer of the platform, deployed beside it for the demo
    # (DEMO_RUNBOOK.md §24, Demo 00–11). It reaches every SMO service only
    # through R1 Termination, and is reached by the GUI the same way.
    energy-saving-rapp:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: samples/energy-saving-rapp, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      stop_grace_period: 30s
      secrets: [db_password_energy-saving-rapp]
      <<: *hardening
      healthcheck: *ready_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
        SMO_IDENTITY_KIND: rapp        # PR-SEC-14: an rApp: no enrollment secret, so SME records it as one and R1 applies the rApp role
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_energy_saving_rapp@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_energy-saving-rapp
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway

    # Call flow 22e: the same image, run as a worker. Every 15 s it runs a pass of each instance whose `evaluateEverySeconds` has passed
    # (samples/energy-saving-rapp/app/tasks.py), so the loop closes without anyone pressing "Evaluate now". Run as many as you like: one pass at a time per instance.
    energy-saving-rapp-worker:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: samples/energy-saving-rapp, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      command: ["python", "-m", "smo_shared.worker"]
      stop_grace_period: 30s
      secrets: [db_password_energy-saving-rapp]
      <<: *hardening
      healthcheck: *worker_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}
        SMO_IDENTITY_KIND: rapp        # the same rApp as energy-saving-rapp: each pass acts as its instance, with the credentials rApp Management pushed
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_energy_saving_rapp@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_energy-saving-rapp
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}
        ENERGY_SAVING_SCHEDULE_TICK_SECONDS: ${ENERGY_SAVING_SCHEDULE_TICK_SECONDS:-15}
  secrets: |
    db_password_energy-saving-rapp:
      file: ./secrets/db_password_energy-saving-rapp
helm: |
  # the reference rApps: SME records them as rApps (no enrollment secret), and R1 applies the rApp role to them
  energy-saving-rapp: { image: energy-saving-rapp, databaseRole: energy-saving-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the same image as a worker: a pass of each instance whose evaluateEverySeconds has passed, so the loop closes by itself (call flow 22e)
  energy-saving-rapp-worker: { image: energy-saving-rapp, databaseRole: energy-saving-rapp, enrollment: false, kind: worker, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000", ENERGY_SAVING_SCHEDULE_TICK_SECONDS: "15" }, resources: { requests: { cpu: 10m, memory: 128Mi }, limits: { memory: 512Mi } } }
