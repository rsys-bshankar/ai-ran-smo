# EnergySaving_rApp package manifest (Wave 10.1, W10-01) — the fields of the
# Wave 10 package description, read by Onboarding's _parse_ai_capabilities.
rappManifest:
  manifestVersion: "1.0"
  aiRuntimeSdkVersion: "1.0"

name: EnergySaving_rApp
version: 1.0.0
vendor: Radisys
ownerTeam: AI-RAN-SMO
description: >
  AI-driven Energy Saving rApp using PRB Utilization
  to control cell administrativeState through O1.
useCase: Energy Saving
domain: RAN
deploymentModel: NonRT-RIC

executionModes:
  - TRAINING
  - VALIDATION
  - EMULATION
  - INFERENCE

autonomyModes:
  - SHADOW
  - ASSIST
  - AUTONOMOUS

requiredServices:
  - DME
  - AIMgF
  - MLMR
  - MLLF
  - RAN-NF-OAM

runtimeProfiles:
  TRAINING:
    cpu: 8
    memory: 16Gi
    gpu: 0
  VALIDATION:
    cpu: 4
    memory: 8Gi
    gpu: 0
  EMULATION:
    cpu: 4
    memory: 8Gi
    gpu: 0
  INFERENCE:
    cpu: 2
    memory: 4Gi
    gpu: 0

# The page the operator console draws for this rApp (PR-GUI-8, docs/adr/0004-operator-ui-declaration.md): the routes below are this rApp's own API,
# read and changed only through the GUI backend, which allows exactly these routes. The page needs no code in the console.
# Call flow 01b: where this rApp's operator API is reached (its service in docker-compose.yml and the chart). rApp Management pushes an instance's
# credentials there, and R1 Termination forwards the instance's operator page to it; an operator may give another address at Deploy.
operatorApi:
  baseUrl: http://energy-saving-rapp:8000

operatorUi:
  version: 1
  panels:
    - id: instance
      title: Instance
      kind: keyValues
      source:
        path: "/instances/{instanceId}"
        refreshSeconds: 30
      items:
        - {label: Managed element, path: managedElementRef}
        - {label: Autonomy mode, path: autonomyMode, format: badge}
        - {label: Actuator, path: actuator}
        - {label: Model, path: modelId, format: id}
        - {label: Model version, path: modelVersion, format: number}
    - id: controls
      title: Closed loop
      kind: actions
      actions:
        - id: evaluate
          label: Evaluate now
          tone: primary
          method: POST
          path: "/instances/{instanceId}/evaluate"
          success: Closed-loop pass complete
        - id: reconcile
          label: Reconcile approvals
          method: POST
          path: "/instances/{instanceId}/reconcile"
          success: ASSIST dispatches reconciled
    - id: cells
      title: Cells
      kind: table
      source:
        path: "/instances/{instanceId}/dashboard"
        query: {points: 48}
        refreshSeconds: 15
      rows: cells
      rowKey: cellId
      empty: No managed cells.
      columns:
        - {path: cellId, label: Cell}
        - {path: state, label: State, format: badge}
        - {path: overrideBy, label: Override}
        - {path: o1Value, label: O1}
        - {path: prbTrend, label: PRB trend, format: sparkline, y: v}
        - {path: latestDecision.prediction.model.futurePrb, label: Predicted PRB, format: percent}
        - {path: latestDecision.decision, label: Decision, format: badge}
        - {path: latestDecision.reason, label: Reason}
        - {path: latestDecision.outcome, label: Outcome, format: badge}
      rowActions:
        - id: unlock-cell
          label: "Override: unlock"
          tone: danger
          method: POST
          path: "/instances/{instanceId}/cells/{row.cellId}/override"
          confirm: Unlock this cell now and suppress AI recommendations for it?
          success: Cell unlocked by operator
          when: {path: overrideBy, exists: false}
          body: {operator: "{user}", reason: manual override}
        - id: clear-override
          label: Clear override
          method: DELETE
          path: "/instances/{instanceId}/cells/{row.cellId}/override"
          success: Override cleared
          when: {path: overrideBy, exists: true}
      rowDetail:
        title: "Cell {row.cellId}"
        blocks:
          - kind: chart
            title: PRB utilisation (%)
            type: line
            points: prbTrend
            x: t
            y: v
          - kind: json
            title: Latest execution (audit trail)
            path: latestDecision
            empty: No decision yet.
          - kind: table
            title: History
            source:
              path: "/instances/{instanceId}/decisions"
              query: {cell_id: "{row.cellId}", limit: 20}
            rows: items
            empty: No decisions.
            columns:
              - {path: observedAt, label: Observed, format: datetime}
              - {path: prb, label: PRB, format: percent}
              - {path: decision, label: Decision, format: badge}
              - {path: reason, label: Reason}
              - {path: outcome, label: Outcome, format: badge}
              - {path: executionId, label: Execution, format: id}
    # GUI-9.8b: each cell's state over the last day, from the rApp's own decision trail (GET /instances/{id}/cell-states). The chart draws one
    # series per cell (2 serving, 1 pre-sleep, 0 sleep, stepping at each change); the table lists the changes, newest first.
    - id: cell-state-history
      title: Cell state, last 24 h (2 serving, 1 pre-sleep, 0 sleep)
      kind: chart
      source:
        path: "/instances/{instanceId}/cell-states"
        query: {hours: 24}
        refreshSeconds: 60
      type: line
      points: points
      x: t
      y: level
      seriesBy: cellId
    - id: cell-state-transitions
      title: Cell state changes, last 24 h
      kind: table
      source:
        path: "/instances/{instanceId}/cell-states"
        query: {hours: 24}
        refreshSeconds: 60
      rows: transitions
      rowKey: transitionId
      empty: No cell changed state in the last 24 hours.
      columns:
        - {path: at, label: Changed, format: datetime}
        - {path: cellId, label: Cell}
        - {path: fromState, label: From, format: badge}
        - {path: toState, label: To, format: badge}
        - {path: o1Value, label: O1}
        - {path: decision, label: Decision, format: badge}
        - {path: reason, label: Reason}
        - {path: outcome, label: Outcome, format: badge}
        - {path: executionId, label: Execution, format: id}
    # The demo's steps (demo.py, docs/GUI_DEMO_GUIDE.md) as buttons only an admin sees: the rApp plays the network and the Digital Twin. The
    # governance decisions between them (approve training and validation, certify, promote) stay on the AI/ML page, where a person makes them.
    - id: demo
      title: Demo / simulation (admin)
      kind: actions
      actions:
        - {id: demo-prepare, label: "1 · Prepare and start", role: admin, method: POST, path: "/instances/{instanceId}/demo/prepare",
           success: "Digital Twin producer registered; instance started"}
        - {id: demo-history, label: "2 · Load history PM", role: admin, method: POST, path: "/instances/{instanceId}/demo/history",
           success: "Three days of PRB history delivered to DME"}
        - {id: demo-train, label: "3 · Train", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/train",
           success: "Model trained; approve the training on the AI/ML page"}
        - {id: demo-validate, label: "4 · Validate", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/validate",
           success: "Model validated; approve the validation on the AI/ML page"}
        - {id: demo-emulate, label: "5 · Emulate on the Digital Twin", role: admin, method: POST, path: "/instances/{instanceId}/demo/emulate",
           success: "Emulated; now submit, approve, certify and promote the model on the AI/ML page"}
        - {id: demo-deploy, label: "7 · Deploy the runtime", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/deploy",
           success: "Inference runtime deployed"}
        - {id: demo-live, label: "8 · Send live PM", role: admin, method: POST, path: "/instances/{instanceId}/demo/live",
           success: "Live PM delivered; press Evaluate now"}
