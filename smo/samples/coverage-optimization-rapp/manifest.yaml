# CoverageOptimization_rApp package manifest (Wave 10.3, W10.3-01)
rappManifest:
  manifestVersion: "1.0"
  aiRuntimeSdkVersion: "1.0"

name: CoverageOptimization_rApp
version: 1.0.0
vendor: Radisys
ownerTeam: AI-RAN-SMO
description: >
  AI-driven Coverage and Capacity Optimization. It learns how weak coverage,
  overshoot and pilot pollution respond to each cell's tilt and transmit
  power, and its neighbours', then tunes a cluster of cells jointly through
  O1.
useCase: Coverage Optimization
domain: RAN
deploymentModel: NonRT-RIC

executionModes:
  - TRAINING
  - VALIDATION
  - EMULATION
  - INFERENCE

autonomyModes:
  - SHADOW
  - ASSIST
  - AUTONOMOUS

requiredServices:
  - DME
  - AIMgF
  - MLMR
  - MLLF
  - RAN-NF-OAM

runtimeProfiles:
  TRAINING:
    cpu: 4
    memory: 8Gi
    gpu: 0
  VALIDATION:
    cpu: 2
    memory: 4Gi
    gpu: 0
  EMULATION:
    cpu: 2
    memory: 4Gi
    gpu: 0
  INFERENCE:
    cpu: 1
    memory: 2Gi
    gpu: 0

# The page the operator console draws for this rApp (PR-GUI-8, docs/adr/0004-operator-ui-declaration.md): the routes below are this rApp's own API,
# read and changed only through the GUI backend, which allows exactly these routes. The page needs no code in the console.
# Call flow 01b: where this rApp's operator API is reached (its service in docker-compose.yml and the chart). rApp Management pushes an instance's
# credentials there, and R1 Termination forwards the instance's operator page to it; an operator may give another address at Deploy.
operatorApi:
  baseUrl: http://coverage-optimization-rapp:8000

operatorUi:
  version: 1
  panels:
  - id: instance
    title: Instance
    kind: keyValues
    items:
    - label: Managed element
      path: managedElementRef
    - label: Autonomy mode
      path: autonomyMode
      format: badge
    - label: Baseline tilt
      path: baselineTilt
      format: number
      unit: 1/10°
    - label: Baseline power
      path: baselinePower
      format: number
      unit: dBm
    - label: Model
      path: modelId
      format: id
    - label: Model version
      path: modelVersion
      format: number
    - label: Artifact version
      path: artifactVersion
      format: number
    - label: EnergySaving instance
      path: energySavingInstanceId
      format: id
    - label: Mobility instance
      path: mobilityInstanceId
      format: id
    source:
      path: /instances/{instanceId}
      refreshSeconds: 30
  - id: controls
    title: Closed loop
    kind: actions
    actions:
    - id: evaluate
      label: Evaluate now
      method: POST
      path: /instances/{instanceId}/evaluate
      success: Closed-loop pass complete
      tone: primary
    - id: reconcile
      label: Reconcile approvals
      method: POST
      path: /instances/{instanceId}/reconcile
      success: ASSIST dispatches reconciled
  - id: cells
    title: Cells
    kind: table
    rows: cells
    rowKey: cellId
    columns:
    - path: cellId
      label: Cell
    - path: state
      label: State
      format: badge
    - path: digitalTilt
      label: Tilt
      format: number
      unit: 1/10°
    - path: configuredMaxTxPower
      label: Power
      format: number
      unit: dBm
    - path: excessTrend
      label: Excess
      format: sparkline
      y: v
    - path: latestDecision.shares.WEAK_COVERAGE
      label: Weak coverage
      format: percent
    - path: latestDecision.shares.OVERSHOOT
      label: Overshoot
      format: percent
    - path: latestDecision.shares.PILOT_POLLUTION
      label: Pilot pollution
      format: percent
    - path: latestDecision.decision
      label: Decision
      format: badge
    - path: latestDecision.reason
      label: Reason
    - path: latestDecision.outcome
      label: Outcome
      format: badge
    empty: No managed cells.
    rowDetail:
      title: Cell {row.cellId}
      blocks:
      - kind: chart
        title: Weak coverage (%)
        type: line
        points: shareTrend
        x: t
        y: WEAK_COVERAGE
      - kind: chart
        title: Overshoot (%)
        type: line
        points: shareTrend
        x: t
        y: OVERSHOOT
      - kind: chart
        title: Pilot pollution (%)
        type: line
        points: shareTrend
        x: t
        y: PILOT_POLLUTION
      - kind: json
        title: Latest execution (audit trail)
        path: latestDecision
        empty: No decision yet.
      - kind: table
        title: History
        columns:
        - path: observedAt
          label: Observed
          format: datetime
        - path: fromSetting
          label: From setting
        - path: toSetting
          label: To setting
        - path: decision
          label: Decision
          format: badge
        - path: reason
          label: Reason
        - path: outcome
          label: Outcome
          format: badge
        - path: executionId
          label: Execution
          format: id
        rows: items
        empty: No decisions.
        source:
          path: /instances/{instanceId}/decisions
          query:
            cell_id: '{row.cellId}'
            limit: 20
    source:
      path: /instances/{instanceId}/dashboard
      query:
        points: 48
      refreshSeconds: 15
  # The demo's steps (demo.py, docs/GUI_DEMO_GUIDE.md) as buttons only an admin sees: the rApp plays the network and the Digital Twin. The
  # governance decisions between them (approve training and validation, certify, promote) stay on the AI/ML page, where a person makes them, and
  # the evaluations (steps 8 and 10) are the Closed loop panel's Evaluate now.
  - id: demo
    title: Demo / simulation (admin)
    kind: actions
    actions:
    - {id: demo-prepare, label: "1 · Prepare and start", role: admin, method: POST, path: "/instances/{instanceId}/demo/prepare",
       success: "Digital Twin producer registered; instance started"}
    - {id: demo-history, label: "2 · Load history PM", role: admin, method: POST, path: "/instances/{instanceId}/demo/history",
       success: "Three days of coverage history delivered to DME"}
    - {id: demo-train, label: "3 · Train", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/train",
       success: "Model trained; approve the training on the AI/ML page"}
    - {id: demo-validate, label: "4 · Validate", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/validate",
       success: "Model validated; approve the validation on the AI/ML page"}
    - {id: demo-emulate, label: "5 · Emulate on the Digital Twin", role: admin, method: POST, path: "/instances/{instanceId}/demo/emulate",
       success: "Emulated; now submit, approve, certify and promote the model on the AI/ML page"}
    - {id: demo-deploy, label: "7 · Deploy the runtime", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/deploy",
       success: "Inference runtime deployed"}
    - {id: demo-live, label: "8 · Send live PM", role: admin, method: POST, path: "/instances/{instanceId}/demo/live",
       success: "Live PM delivered (301 overshoots); press Evaluate now"}
    - {id: demo-kpi-hour, label: "10 · Send the next hour's PM", role: admin, method: POST, path: "/instances/{instanceId}/demo/kpi-hour",
       success: "Next hour's PM delivered; press Evaluate now to check the KPI"}
