# TrafficSteering_rApp package manifest (Wave 10.4, W10.4-01)
rappManifest:
  manifestVersion: "1.0"
  aiRuntimeSdkVersion: "1.0"

name: TrafficSteering_rApp
version: 1.0.0
vendor: Radisys
ownerTeam: AI-RAN-SMO
description: >
  AI-driven traffic steering / mobility load balancing. It forecasts each
  cell's congestion score and moves load off congested cells: idle UEs via
  reselection priority towards another frequency layer, connected UEs via
  the neighbour relation's cell individual offset, through O1.
useCase: Traffic Steering
domain: RAN
deploymentModel: NonRT-RIC

executionModes:
  - TRAINING
  - VALIDATION
  - EMULATION
  - INFERENCE

autonomyModes:
  - SHADOW
  - ASSIST
  - AUTONOMOUS

requiredServices:
  - DME
  - AIMgF
  - MLMR
  - MLLF
  - RAN-NF-OAM

runtimeProfiles:
  TRAINING:
    cpu: 4
    memory: 8Gi
    gpu: 0
  VALIDATION:
    cpu: 2
    memory: 4Gi
    gpu: 0
  EMULATION:
    cpu: 2
    memory: 4Gi
    gpu: 0
  INFERENCE:
    cpu: 1
    memory: 2Gi
    gpu: 0

# AI-10.1/10.3: the most one instance of this rApp may do on the network; rApp Management puts it in force at RAN NF OAM when the instance
# bootstraps. The arithmetic is in README.md ("Limits the package declares").
# configJobsPerHour: at most 3 config jobs a source cell in a pass (a steering or release step plus up to two rollback sends); the demo topology
# has 4 cells, so 12 a pass, and at most 60 passes an hour (`evaluateEverySeconds` is at least 60): 720, doubled for headroom. Over 4 cells: 360 a
# cell. maxElementsPerJob: an instance names one managed element and every write is to it. No maxChangePercent: the default baseline CIO is
# 0 dB, which could never move.
limits:
  configJobsPerHour: 1440
  maxElementsPerJob: 1

# The page the operator console draws for this rApp (PR-GUI-8, docs/adr/0004-operator-ui-declaration.md): the routes below are this rApp's own API,
# read and changed only through the GUI backend, which allows exactly these routes. The page needs no code in the console.
# Call flow 01b: where this rApp's operator API is reached (its service in docker-compose.yml and the chart). rApp Management pushes an instance's
# credentials there, and R1 Termination forwards the instance's operator page to it; an operator may give another address at Deploy.
operatorApi:
  baseUrl: http://traffic-steering-rapp:8000

operatorUi:
  version: 1
  panels:
  - id: instance
    title: Instance
    kind: keyValues
    items:
    - label: Managed element
      path: managedElementRef
    - label: Autonomy mode
      path: autonomyMode
      format: badge
    - label: Baseline priority
      path: baselinePriority
      format: number
    - label: Baseline CIO
      path: baselineCio
      format: number
      unit: dB
    - label: Model
      path: modelId
      format: id
    - label: Model version
      path: modelVersion
      format: number
    - label: Artifact version
      path: artifactVersion
      format: number
    - label: EnergySaving instance
      path: energySavingInstanceId
      format: id
    - label: Mobility instance
      path: mobilityInstanceId
      format: id
    - label: Coverage instance
      path: coverageInstanceId
      format: id
    source:
      path: /instances/{instanceId}
      refreshSeconds: 30
  - id: controls
    title: Closed loop
    kind: actions
    actions:
    - id: evaluate
      label: Evaluate now
      method: POST
      path: /instances/{instanceId}/evaluate
      success: Closed-loop pass complete
      tone: primary
    - id: reconcile
      label: Reconcile approvals
      method: POST
      path: /instances/{instanceId}/reconcile
      success: ASSIST dispatches and held reverts or rollbacks reconciled
  - id: cells
    title: Cells
    kind: table
    rows: cells
    rowKey: cellId
    columns:
    - path: cellId
      label: Cell
    - path: layer
      label: Layer
    - path: state
      label: State
      format: badge
    - path: scoreTrend
      label: Congestion
      format: sparkline
      y: v
    - path: latestDecision.prediction.model.score
      label: Score
      format: number
    - path: latestDecision.prediction.model.forecast
      label: Forecast
      format: number
    - path: latestDecision.prediction.model.band
      label: Band
      format: badge
    - path: steering
      label: Steering in force
    - path: latestDecision.decision
      label: Decision
      format: badge
    - path: latestDecision.reason
      label: Reason
    - path: latestDecision.outcome
      label: Outcome
      format: badge
    empty: No managed cells.
    rowDetail:
      title: Cell {row.cellId} ({row.layer})
      blocks:
      - kind: chart
        title: Congestion score
        type: line
        points: scoreTrend
        x: t
        y: v
      - kind: json
        title: Latest execution (audit trail)
        path: latestDecision
        empty: No decision yet.
      - kind: table
        title: History
        columns:
        - path: observedAt
          label: Observed
          format: datetime
        - path: score
          label: Score
          format: number
        - path: managedRef
          label: Changed
        - path: fromValue
          label: From
        - path: toValue
          label: To
        - path: decision
          label: Decision
          format: badge
        - path: reason
          label: Reason
        - path: outcome
          label: Outcome
          format: badge
        - path: executionId
          label: Execution
          format: id
        rows: items
        empty: No decisions.
        source:
          path: /instances/{instanceId}/decisions
          query:
            cell_id: '{row.cellId}'
            limit: 20
    source:
      path: /instances/{instanceId}/dashboard
      query:
        points: 48
      refreshSeconds: 15
  # Call flow 25f: the instance's scheduled passes (`evaluateEverySeconds` in its configuration; absent: only Evaluate now).
  - id: schedule
    title: Scheduled passes
    kind: keyValues
    items:
    - {label: Evaluated every (s), path: evaluateEverySeconds, format: number}
    - {label: Last pass, path: lastEvaluation.at}
    - {label: Last pass trigger, path: lastEvaluation.trigger, format: badge}
    - {label: Last pass result, path: lastEvaluation.result, format: badge}
    source:
      path: /instances/{instanceId}
      refreshSeconds: 30
  # The demo's steps (demo.py, docs/GUI_DEMO_GUIDE.md) as buttons only an admin sees: the rApp plays the network and the Digital Twin. The
  # governance decisions between them (approve training and validation, certify, promote) stay on the AI/ML page, where a person makes them, and
  # the closed-loop passes (Demo 08 and 10) are the Evaluate now button above.
  - id: demo
    title: Demo / simulation (admin)
    kind: actions
    actions:
    - {id: demo-prepare, label: "1 · Prepare and start", role: admin, method: POST, path: "/instances/{instanceId}/demo/prepare",
       success: "Digital Twin producer registered; instance started"}
    - {id: demo-history, label: "2 · Load history PM", role: admin, method: POST, path: "/instances/{instanceId}/demo/history",
       success: "Three days of load history delivered to DME"}
    - {id: demo-train, label: "3 · Train", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/train",
       success: "Model trained; approve the training on the AI/ML page"}
    - {id: demo-validate, label: "4 · Validate", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/validate",
       success: "Model validated; approve the validation on the AI/ML page"}
    - {id: demo-emulate, label: "5 · Emulate on the Digital Twin", role: admin, method: POST, path: "/instances/{instanceId}/demo/emulate",
       success: "Emulated against the twin's hotspots; now submit, approve, certify and promote the model on the AI/ML page"}
    - {id: demo-deploy, label: "7 · Deploy the runtime", role: admin, method: POST, path: "/instances/{instanceId}/lifecycle/deploy",
       success: "Inference runtime deployed"}
    - {id: demo-live, label: "8 · Send live PM", role: admin, method: POST, path: "/instances/{instanceId}/demo/live",
       success: "Live PM with the stadium hotspot delivered; press Evaluate now"}
    - {id: demo-kpi-hour, label: "10 · Send the next hour's PM", role: admin, method: POST, path: "/instances/{instanceId}/demo/kpi-hour",
       success: "Next hour's PM delivered; press Evaluate now for the KPI check"}
