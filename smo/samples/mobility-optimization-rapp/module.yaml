# mobility-optimization-rapp: what this module is to the rest of the SMO (scripts/modules.py; the schema is scripts/module.schema.json). Edit this file, then run
# `python scripts/modules.py --write` from smo/: it regenerates the shared files that list modules, and CI runs `--check`.
name: mobility-optimization-rapp
lane: samples
r1: []
database:
  role: {schema: mobility_optimization_rapp, shared: [module_identity, notification_outbox, periodic_run, smo_event, smo_event_relay]}
  tables: [mobility_decision, mobility_instance, mobility_relation]
openapi: true
tests: {source: app, pythonpath: ".:../../shared:../../sdk", floor: 98}
mutation: null
code_docs: true
config_reference: true
compose:
  services: |
    # Wave 10.2: the Mobility Optimization reference rApp
    # (samples/mobility-optimization-rapp) — R1-only, like energy-saving-rapp.
    mobility-optimization-rapp:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: samples/mobility-optimization-rapp, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      stop_grace_period: 30s
      secrets: [db_password_mobility-optimization-rapp]
      <<: *hardening
      healthcheck: *ready_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
        SMO_IDENTITY_KIND: rapp        # PR-SEC-14: an rApp: no enrollment secret, so SME records it as one and R1 applies the rApp role
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_mobility_optimization_rapp@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_mobility-optimization-rapp
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway

    # Call flow 23f: the same image, run as a worker. Every 15 s it runs a pass of each instance whose `evaluateEverySeconds` has passed
    # (samples/mobility-optimization-rapp/app/tasks.py), so a CIO change is confirmed or reverted an hour later without anyone pressing "Evaluate now".
    mobility-optimization-rapp-worker:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: samples/mobility-optimization-rapp, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      command: ["python", "-m", "smo_shared.worker"]
      stop_grace_period: 30s
      secrets: [db_password_mobility-optimization-rapp]
      <<: *hardening
      healthcheck: *worker_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}
        SMO_IDENTITY_KIND: rapp        # the same rApp as mobility-optimization-rapp: each pass acts as its instance
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_mobility_optimization_rapp@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_mobility-optimization-rapp
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}
        MOBILITY_SCHEDULE_TICK_SECONDS: ${MOBILITY_SCHEDULE_TICK_SECONDS:-15}
  secrets: |
    db_password_mobility-optimization-rapp:
      file: ./secrets/db_password_mobility-optimization-rapp
helm: |
  mobility-optimization-rapp: { image: mobility-optimization-rapp, databaseRole: mobility-optimization-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the same image as a worker: a pass of each instance whose evaluateEverySeconds has passed, so a CIO change is confirmed or reverted on time (call flow 23f).
  # An rApp's worker asks for 10m of CPU, not the default 50m: it sleeps between ticks, and the defaults must fit a two-core lab node (test_helm_sizing).
  mobility-optimization-rapp-worker: { image: mobility-optimization-rapp, databaseRole: mobility-optimization-rapp, enrollment: false, kind: worker, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000", MOBILITY_SCHEDULE_TICK_SECONDS: "15" }, resources: { requests: { cpu: 10m, memory: 128Mi }, limits: { memory: 512Mi } } }
