# aimgf: what this module is to the rest of the SMO (scripts/modules.py; the schema is scripts/module.schema.json). Edit this file, then run
# `python scripts/modules.py --write` from smo/: it regenerates the shared files that list modules, and CI runs `--check`.
name: aimgf
lane: aimgf
r1:
  - {prefix: /aimgf, env: AIMGF_URL, url: "http://aimgf:8000"}
database:
  role: {schema: aimgf, shared: [module_identity, notification_outbox, idempotency_key, periodic_run, smo_event, smo_event_relay, audit_log, audit_head]}
  tables: [aimgf_moi_store, aiml_inference_emulation_function, aiml_inference_function, aiml_inference_report, aiml_model, certification_record, emulation_job, feature_group, inference_job, lifecycle_transition, ml_model_coordination_group, ml_model_loading_policy, ml_model_loading_process, ml_model_loading_request, ml_model_profile, ml_model_repository, ml_models_storage, ml_testing_function, ml_testing_report, ml_training_function, ml_training_process, ml_training_report, ml_update_function, ml_update_process, ml_update_report, ml_update_request, mlmf_subscription, model_artifact, model_change_subscription, model_lifecycle, performance_report, training_job, validation_job]
openapi: true
tests: {source: app, pythonpath: ".:../shared", floor: 95}
mutation: null
code_docs: true
config_reference: true
compose:
  services: |
    aimgf:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: aimgf, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      stop_grace_period: 30s
      secrets: [db_password_aimgf, enrollment_secret]
      <<: *hardening
      healthcheck: *ready_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
        SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_aimgf@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_aimgf
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway

    # Call flow 27e: the same image, run as a worker. It fails every training, validation, emulation and inference run past its deadline (aimgf/app/tasks.py),
    # so a run nobody reads still times out and its NFO workload is removed. Run as many as you like: the task runs once per interval across all of them.
    aimgf-worker:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: aimgf, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      command: ["python", "-m", "smo_shared.worker"]
      stop_grace_period: 30s
      secrets: [db_password_aimgf, enrollment_secret]
      <<: *hardening
      healthcheck: *worker_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}
        SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # the worker is the same SMO module as aimgf (one identity, ST-4): it calls NFO to remove an expired run's runtime
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_aimgf@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_aimgf
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}
        AIMGF_TIMEOUT_SWEEP_SECONDS: ${AIMGF_TIMEOUT_SWEEP_SECONDS:-60}
  secrets: |
    db_password_aimgf:
      file: ./secrets/db_password_aimgf
helm: |
  aimgf: { image: aimgf, databaseRole: aimgf, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the same image as a worker: fails the training, validation, emulation and inference runs past their deadline, so a run nobody reads still times out (call flow 27e)
  aimgf-worker: { image: aimgf, databaseRole: aimgf, kind: worker, env: { R1_GATEWAY_URL: "http://r1-termination:8000", AIMGF_TIMEOUT_SWEEP_SECONDS: "60" } }
