# AI-RAN SMO — Phase 1, Docker deployment topology (SMO Design v1.3 section 4).
# One shared Postgres instance, moduleScope-partitioned (Requirements v0.1 section 3).
# Every service built from the same Dockerfile, parameterized by MODULE.
# The database password is a Compose secret, a file mounted at /run/secrets/db_password (PR-SEC-4.3): run
# scripts/init_secrets.sh once to create it. There is no default and no password in this file or in any container's
# environment; the stack does not start without the secret file (PR-DB-1).
# stop_grace_period (30 s) is longer than the Dockerfile's UVICORN_GRACEFUL_SHUTDOWN_SECONDS (20 s), so a
# stopping container finishes its in-flight requests before docker would kill it (PR-ST-6).

# Every service built from the shared Dockerfile answers GET /ready (smo_shared/health.py, PR-ST-7): 200 when its
# database and SME answer, 503 otherwise, so `docker compose ps` shows what can take traffic. The gui-bff is not
# one of them. The probe is Python because the image has no curl.
# A worker (`python -m smo_shared.worker`) has no HTTP port: it touches a file on every tick, and is unhealthy when that file is a minute old.
x-worker-probe: &worker_probe
  test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"]
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

x-ready-probe: &ready_probe
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

# Build identity baked into every image, answered by GET /version (PR-OBS-8.1): export SMO_BUILD_SHA=$(git rev-parse HEAD)
# (and SMO_VERSION, SMO_BUILT_AT) before `docker compose build`; unset, the image says "unknown".
x-build-info: &build_info
  SMO_VERSION: ${SMO_VERSION:-unknown}
  SMO_BUILD_SHA: ${SMO_BUILD_SHA:-unknown}
  SMO_BUILT_AT: ${SMO_BUILT_AT:-unknown}

# Container hardening for every service we build (PR-SEC-13): no Linux capability (a service binds port 8000 and
# needs none), and no way to gain one through a setuid binary. Postgres keeps its defaults: its entrypoint
# drops privileges itself and needs a few. The root filesystem is read-only (PR-SEC-13.2): a service writes only to /tmp
# (memory, gone on restart) and to the named volumes it mounts (/data, /srv/packages, /srv/scratch). To put files into a
# running container (the runbook's CSARs), copy them into the r1-termination volume at /srv/scratch, never into /tmp.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

# Every service that uses the database waits for it to be healthy AND for the one-shot `migrate` service to have
# finished (PR-OPS-1.5): the schema is created and upgraded by the Alembic history, never by the services.
x-wait-for-schema: &wait_for_schema
  postgres: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }

# The environment every database-using service shares: where the database is, and the file its password is in.
x-db-env: &db_env
  SMO_DATABASE_URL: postgresql+psycopg://smo@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo   # no password here: smo_shared/db.py adds it from the file below
  SMO_DB_POOLER: ${SMO_DB_POOLER:-}
  SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password
  # SEC-15.18: the key that encrypts the module identities (invoker secrets) in the shared module_identity table. Empty: stored as before. Every service must get the same
  # key; prefer a file (mount it with an override and set SMO_IDENTITY_KEY_FILE there, like GUI_TOTP_KEY_FILE). docs/SECRETS.md.
  SMO_IDENTITY_KEY: ${SMO_IDENTITY_KEY:-}
  SMO_IDENTITY_PREVIOUS_KEY: ${SMO_IDENTITY_PREVIOUS_KEY:-}

services:
  # Postgres 18 with the TimescaleDB extension (D8, plan task S1.10): the official Postgres 18 alpine image with TimescaleDB built in, the same image the
  # Contracts job applies the bundle's DDL to, so the stack and the contract gate run one database. Same data layout, user (uid 70) and PGDATA as the
  # postgres:18-alpine image it replaces, so an existing volume starts unchanged. The library is preloaded here (not only by the image's first-start
  # script) so that a volume made by the stock image gets it too; the `migrate` service creates the extension (SMO_TIMESCALEDB=require). The image's
  # start-up tuning (timescaledb-tune) and its telemetry are off: the settings stay the ones below, and nothing is reported to Timescale.
  # The common_dme_telemetry hypertables are S1.9's revisions, not this file's.
  postgres:
    image: timescale/timescaledb:2.31.0-pg18@sha256:0fcff5761363809d1242f2261a3482197b5a5337407f8b97a976fb174206d579
    environment:
      POSTGRES_USER: smo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # the official image reads the password from this file
      POSTGRES_DB: smo
      NO_TS_TUNE: "true"
      TIMESCALEDB_TELEMETRY: "off"
    secrets: [db_password]
    # Slow-statement log (PR-DB-4.1): any statement running longer than POSTGRES_SLOW_QUERY_MS (default 500 ms)
    # is logged with its duration and text: `docker compose logs postgres | grep duration`. -1 turns it off, 0 logs all.
    command: ["postgres", "-c", "log_min_duration_statement=${POSTGRES_SLOW_QUERY_MS:-500}", "-c", "shared_preload_libraries=timescaledb",
              "-c", "timescaledb.telemetry_level=off"]
    volumes:
      # PostgreSQL 18+ images keep data in a version-named subdirectory of
      # /var/lib/postgresql, so the volume mounts there (not at .../data).
      # A volume left by a 16 stack is not readable by 18: `docker compose down -v`
      # (demo data) or pg_dump/pg_restore across the upgrade.
      - smo_pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Connection pooler (PR-DB-5.1), a profile: `SMO_DB_HOST=pgbouncer SMO_DB_POOLER=transaction docker compose --profile pooler up -d`.
  # Every service then connects to pgbouncer:6432 instead of postgres:5432 (SMO_DB_PORT=6432). The one-shot `migrate` service always goes direct: DDL and advisory
  # locks want a session. SMO_DB_POOLER makes the services leave off what transaction pooling cannot carry (README, "Connection pooling and pool sizing").
  pgbouncer:
    profiles: ["pooler"]
    build: { context: ./pgbouncer }
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    secrets:
      - db_password
      # >>> modules: generated by scripts/modules.py from each <module>/module.yaml (database.role); edit those, then run it with --write
      - db_password_aimgf
      - db_password_dme
      - db_password_echo
      - db_password_focom
      - db_password_intent-service
      - db_password_mdaf
      - db_password_nfo
      - db_password_onboarding
      - db_password_r1-termination
      - db_password_ran-analytics
      - db_password_ran-nf-oam
      - db_password_rapp-mgmt
      - db_password_sa-smos
      - db_password_coverage-optimization-rapp
      - db_password_energy-saving-rapp
      - db_password_mobility-optimization-rapp
      - db_password_traffic-steering-rapp
      - db_password_sme
      - db_password_so-smos
      # <<< modules
    environment:
      PGBOUNCER_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ["127.0.0.1:6432:6432"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Off-site backup (PR-HA-6.2), a profile: set SMO_BACKUP_S3_BUCKET (and, for MinIO or another store that is not AWS, SMO_BACKUP_S3_ENDPOINT plus
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .env), then `docker compose --profile backup up -d db-backup`. Every SMO_BACKUP_INTERVAL_SECONDS (default
  # 600) it dumps Postgres and the GUI backend's SQLite file, writes a manifest, uploads the set and applies the retention (docs/DISASTER_RECOVERY.md).
  # Direct to Postgres, never through the pooler: pg_dump needs a session. The SQLite volume is mounted read-only.
  db-backup:
    profiles: ["backup"]
    build: { context: ./backup }
    <<: *hardening
    user: "10001:10001"
    restart: unless-stopped
    secrets: [db_password]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      SMO_DATABASE_URL: postgresql+psycopg://smo@postgres:5432/smo   # direct to Postgres, not the pooler; no password here: scripts/pg_env.sh adds it from the file below
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password
      SMO_BACKUP_S3_BUCKET: ${SMO_BACKUP_S3_BUCKET:-}
      SMO_BACKUP_S3_PREFIX: ${SMO_BACKUP_S3_PREFIX:-smo}
      SMO_BACKUP_S3_ENDPOINT: ${SMO_BACKUP_S3_ENDPOINT:-}
      SMO_BACKUP_S3_SSE: ${SMO_BACKUP_S3_SSE:-}
      SMO_BACKUP_RETENTION_DAYS: ${SMO_BACKUP_RETENTION_DAYS:-14}
      SMO_BACKUP_KEEP_MIN: ${SMO_BACKUP_KEEP_MIN:-5}
      SMO_BACKUP_INTERVAL_SECONDS: ${SMO_BACKUP_INTERVAL_SECONDS:-600}
      SMO_BACKUP_GUI_DB: /gui-data/gui-bff.db
      SMO_BACKUP_STAGING: /staging
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    command: ["sh", "-c", "exec /scripts/dr_backup.sh --loop \"$$SMO_BACKUP_INTERVAL_SECONDS\""]
    volumes:
      - ./scripts:/scripts:ro
      - gui_bff_data:/gui-data:ro
      - smo_backup_staging:/staging

  # Brings the database to the schema of this release, then exits (PR-OPS-1.5, docs/adr/0001-schema-migrations.md): an
  # empty database gets the baseline and every revision after it, a database made from 001_init.sql by an earlier
  # stack is stamped and upgraded, an up-to-date one is left alone. The services wait for it to finish; if it fails
  # they do not start, and `docker compose logs migrate` says why. The image is any of the service images (all carry
  # the migrations); this one is the R1 Termination build, so no extra image layer is built.
  migrate:
    build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: r1-termination } }
    # the schema, then the per-module roles (PR-DB-2.6): one role for every module whose password file is mounted here, and none for one without
    command: ["sh", "-c", "python /srv/scripts/migrate.py && python /srv/scripts/db_roles.py"]
    restart: "no"
    stop_grace_period: 30s
    secrets:
      - db_password
      # >>> modules: generated by scripts/modules.py from each <module>/module.yaml (database.role); edit those, then run it with --write
      - db_password_aimgf
      - db_password_dme
      - db_password_echo
      - db_password_focom
      - db_password_intent-service
      - db_password_mdaf
      - db_password_nfo
      - db_password_onboarding
      - db_password_r1-termination
      - db_password_ran-analytics
      - db_password_ran-nf-oam
      - db_password_rapp-mgmt
      - db_password_sa-smos
      - db_password_coverage-optimization-rapp
      - db_password_energy-saving-rapp
      - db_password_mobility-optimization-rapp
      - db_password_traffic-steering-rapp
      - db_password_sme
      - db_password_so-smos
      # <<< modules
    <<: *hardening
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      SMO_DATABASE_URL: postgresql+psycopg://smo@postgres:5432/smo
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password
      SMO_TIMESCALEDB: require    # D8: this Postgres has TimescaleDB; migrate creates the extension before the revisions run (scripts/migrate.py)

  # >>> modules: generated by scripts/modules.py from each <module>/module.yaml (compose.services); edit those, then run it with --write
  # --- aimgf/module.yaml
  aimgf:
    build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: aimgf, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
    stop_grace_period: 30s
    secrets: [db_password_aimgf, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_aimgf@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_aimgf
      R1_GATEWAY_URL: http://r1-termination:8000
      SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway

  # Call flow 27e: the same image, run as a worker. It fails every training, validation, emulation and inference run past its deadline (aimgf/app/tasks.py),
  # so a run nobody reads still times out and its NFO workload is removed. Run as many as you like: the task runs once per interval across all of them.
  aimgf-worker:
    build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: aimgf, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
    command: ["python", "-m", "smo_shared.worker"]
    stop_grace_period: 30s
    secrets: [db_password_aimgf, enrollment_secret]
    <<: *hardening
    healthcheck: *worker_probe
    depends_on: *wait_for_schema
    environment:
      SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # the worker is the same SMO module as aimgf (one identity, ST-4): it calls NFO to remove an expired run's runtime
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_aimgf@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_aimgf
      R1_GATEWAY_URL: http://r1-termination:8000
      SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}
      AIMGF_TIMEOUT_SWEEP_SECONDS: ${AIMGF_TIMEOUT_SWEEP_SECONDS:-60}

  # --- dme/module.yaml
  dme:
    build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: dme, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
    stop_grace_period: 30s
    secrets: [db_password_dme, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_dme@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_dme
      SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway (DOC-CF-3.1)

  # Call flow 12d: the same image, run as a worker. It purges DME data records older than SMO_RETENTION_DME_RECORDS_DAYS (dme/app/tasks.py).
  # D9 (ADR 0006, profile `kafka`): this worker is also the Kafka relay when SMO_KAFKA_RELAY=true (smo_shared/kafka_relay.py): every event committed to smo_event
  # goes, in order per entity, to the topic SMO_KAFKA_EVENTS_TOPIC. Off by default; the image needs the client (SMO_WITH_KAFKA=1):
  #   SMO_WITH_KAFKA=1 SMO_KAFKA_RELAY=true docker compose --profile kafka up -d --build
  # PLAINTEXT is the lab broker's protocol on the compose network (the relay warns at start); a real cluster: SSL or SASL_SSL (docs/EVENTS.md, "Kafka").
  dme-worker:
    build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: dme, WITH_TRACING: "${SMO_WITH_TRACING:-0}", WITH_KAFKA: "${SMO_WITH_KAFKA:-0}" } }
    command: ["python", "-m", "smo_shared.worker"]
    stop_grace_period: 30s
    secrets: [db_password_dme, enrollment_secret]
    <<: *hardening
    healthcheck: *worker_probe
    depends_on: *wait_for_schema
    environment:
      SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_dme@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_dme
      SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway (DOC-CF-3.1)
      SMO_RETENTION_DME_RECORDS_DAYS: ${SMO_RETENTION_DME_RECORDS_DAYS:-0}
      SMO_RETENTION_WARN_ROWS: ${SMO_RETENTION_WARN_ROWS:-1000000}
      SMO_KAFKA_RELAY: ${SMO_KAFKA_RELAY:-false}
      SMO_KAFKA_BOOTSTRAP_SERVERS: ${SMO_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SMO_KAFKA_SECURITY_PROTOCOL: ${SMO_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      SMO_KAFKA_EVENTS_TOPIC: ${SMO_KAFKA_EVENTS_TOPIC:-smo.events.v1}
      SMO_KAFKA_RELAY_SETTLE_SECONDS: ${SMO_KAFKA_RELAY_SETTLE_SECONDS:-3}

  # --- echo/module.yaml
  # PR-CONV-S1.6: Echo, the reference ProvMnS module (echo/README.md): the shared router on SubNetwork and ManagedElement, nothing else. Off by default
  # (`docker compose --profile echo up`): a reference and test module with no operator function, whose write API nothing in the platform needs.
  echo:
    profiles: ["echo"]
    build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: echo, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
    stop_grace_period: 30s
    secrets: [db_password_echo, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway (DOC-CF-3.1)
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_echo@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_echo
      ECHO_PLACEMENT: ${ECHO_PLACEMENT:-}         # where an instance is for the scope claim: {"SubNetwork=A": {"region": ..., "tenant": ..., "siteCluster": ...}}
      ECHO_MSAC_RULES: ${ECHO_MSAC_RULES:-}       # TS 28.319 rules per caller: {"<invoker or user>": [{"dataNodeSelector", "operations", "action"}]}

  # --- focom/module.yaml
  focom:
    build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: focom, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
    stop_grace_period: 30s
    secrets: [db_password_focom, enrollment_secret]
    <<: *hardening
    healthcheck: *ready_probe
    depends_on: *wait_for_schema
    environment:
      SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      <<: *db_env
      SMO_DATABASE_URL: postgresql+psycopg://smo_focom@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
      SMO_DB_POOLER: ${SMO_DB_POOLER:-}
      SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_focom

  # --- gui/module.yaml
  gui:
    build: { context: ./gui }
    <<: *hardening
    depends_on: [gui-bff]
    ports: ["3000:8080"]

  # --- gui-bff/module.yaml
  # ---------------------------------------------------------------- operator GUI
  # Browser -> gui (nginx, the only published GUI port) -> gui-bff -> R1
  # Termination -> modules. gui-bff publishes nothing and authenticates to R1
  # with its own SME-issued OAuth2 token.
  gui-bff:
    build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: gui-bff, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
    stop_grace_period: 30s
    <<: *hardening
    secrets: [enrollment_secret]
    depends_on: [r1-termination, sme]
    environment:
      SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      R1_URL: http://r1-termination:8000
      SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway (DOC-CF-3.1)
      GUI_DATABASE_URL: sqlite:////data/gui-bff.db
      GUI_INITIAL_PASSWORD_FILE: /data/initial-admin-password
      # Secrets come from the shell / an .env file, never from git. Unset
      # GUI_JWT_SECRET: generated once, kept in the BFF database, and used by
      # every instance of it. Unset GUI_ADMIN_PASSWORD: a random
      # admin password is generated into GUI_INITIAL_PASSWORD_FILE (0600, never
      # logged): docker compose exec gui-bff cat /data/initial-admin-password
      GUI_JWT_SECRET: ${GUI_JWT_SECRET:-}
      # PR-SEC-5: HS256 (default) signs the session token with GUI_JWT_SECRET. RS256 or ES256 signs with the PEM private key in GUI_JWT_PRIVATE_KEY_FILE (a file mounted by an
      # override, like GUI_TOTP_KEY_FILE) and publishes the public keys at /.well-known/jwks.json; GUI_JWT_PREVIOUS_KEY_FILES (comma separated) are the keys of earlier rotations.
      # Changing the algorithm ends every session. gui-bff/README.md "Signing keys".
      GUI_JWT_ALGORITHM: ${GUI_JWT_ALGORITHM:-HS256}
      GUI_JWT_PRIVATE_KEY_FILE: ${GUI_JWT_PRIVATE_KEY_FILE:-}
      GUI_JWT_PREVIOUS_KEY_FILES: ${GUI_JWT_PREVIOUS_KEY_FILES:-}
      GUI_ADMIN_PASSWORD: ${GUI_ADMIN_PASSWORD:-}
      GUI_OPERATOR_PASSWORD: ${GUI_OPERATOR_PASSWORD:-}
      GUI_VIEWER_PASSWORD: ${GUI_VIEWER_PASSWORD:-}
      GUI_COOKIE_SECURE: ${GUI_COOKIE_SECURE:-true}
      GUI_SESSION_TTL_SECONDS: ${GUI_SESSION_TTL_SECONDS:-28800}    # how long a sign-in lasts (8 h)
      # OIDC login (PR-SEC-6), off unless GUI_OIDC_ENABLED=true: docs/CONFIGURATION.md, gui-bff/README.md "OIDC login". The client's credential
      # is better mounted as a file (GUI_OIDC_CLIENT_SECRET_FILE) than set here.
      GUI_OIDC_ENABLED: ${GUI_OIDC_ENABLED:-false}
      GUI_OIDC_ISSUER: ${GUI_OIDC_ISSUER:-}
      GUI_OIDC_CLIENT_ID: ${GUI_OIDC_CLIENT_ID:-}
      GUI_OIDC_CLIENT_SECRET: ${GUI_OIDC_CLIENT_SECRET:-}
      GUI_OIDC_REDIRECT_URI: ${GUI_OIDC_REDIRECT_URI:-}
      GUI_OIDC_SCOPES: ${GUI_OIDC_SCOPES:-openid profile email}
      GUI_OIDC_GROUPS_CLAIM: ${GUI_OIDC_GROUPS_CLAIM:-groups}
      GUI_OIDC_GROUP_ROLE_MAP: ${GUI_OIDC_GROUP_ROLE_MAP:-}
      GUI_OIDC_DEFAULT_ROLE: ${GUI_OIDC_DEFAULT_ROLE:-}
      GUI_OIDC_SCOPE_CLAIM: ${GUI_OIDC_SCOPE_CLAIM:-}
      GUI_OIDC_PROVIDER_NAME: ${GUI_OIDC_PROVIDER_NAME:-SSO}
      GUI_OIDC_POST_LOGOUT_REDIRECT_URI: ${GUI_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      GUI_OIDC_ALLOW_HTTP: ${GUI_OIDC_ALLOW_HTTP:-false}
      GUI_LOCAL_LOGIN_ENABLED: ${GUI_LOCAL_LOGIN_ENABLED:-true}
      # Audit-log retention (PR-DB-3.6): the BFF has no worker; run `docker compose exec gui-bff python -m app.retention` (cron on the host). 0 keeps all.
      GUI_AUDIT_RETENTION_DAYS: ${GUI_AUDIT_RETENTION_DAYS:-0}
      GUI_AUDIT_EXPORT_DIR: ${GUI_AUDIT_EXPORT_DIR:-}
      SMO_RETENTION_WARN_ROWS: ${SMO_RETENTION_WARN_ROWS:-1000000}
      # Multi-factor sign-in (PR-SEC-7), all off or unchanged by default: GUI_LOGIN_MODE=oidc makes the identity provider the only way in (a break-glass
      # account keeps password + one-time code), GUI_TOTP_KEY switches on one-time codes for local accounts (prefer a file: GUI_TOTP_KEY_FILE, mounted
      # by an override), GUI_ADMIN_MFA_REQUIRED=true makes every local admin enrol one. gui-bff/README.md "One-time codes", docs/CONFIGURATION.md.
      GUI_LOGIN_MODE: ${GUI_LOGIN_MODE:-both}
      GUI_TOTP_KEY: ${GUI_TOTP_KEY:-}
      GUI_TOTP_ISSUER: ${GUI_TOTP_ISSUER:-SMO Operator Console}
      GUI_ADMIN_MFA_REQUIRED: ${GUI_ADMIN_MFA_REQUIRED:-false}
    volumes:
      - gui_bff_data:/data   # GUI users, audit log, the BFF's SME invoker credential

