  # --- sa-smos/module.yaml
  db_password_sa-smos:
    file: ./secrets/db_password_sa-smos

  # --- samples/coverage-optimization-rapp/module.yaml
  db_password_coverage-optimization-rapp:
    file: ./secrets/db_password_coverage-optimization-rapp

  # --- samples/energy-saving-rapp/module.yaml
  db_password_energy-saving-rapp:
    file: ./secrets/db_password_energy-saving-rapp

  # --- samples/mobility-optimization-rapp/module.yaml
