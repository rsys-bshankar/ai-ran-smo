  # ---------------------------------------------------------------- operator GUI
  # Browser -> gui (nginx, the only published GUI port) -> gui-bff -> R1
  # Termination -> modules. gui-bff publishes nothing and authenticates to R1
  # with its own SME-issued OAuth2 token.
  gui-bff:
    build: { context: ., args: { <<: *build_info, MODULE: gui-bff, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
    stop_grace_period: 30s
    <<: *hardening
    secrets: [enrollment_secret]
    depends_on: [r1-termination, sme]
    environment:
      SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
      SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
      R1_URL: http://r1-termination:8000
      GUI_DATABASE_URL: sqlite:////data/gui-bff.db
      GUI_INITIAL_PASSWORD_FILE: /data/initial-admin-password
      # Secrets come from the shell / an .env file, never from git. Unset
      # GUI_JWT_SECRET: random per boot. Unset GUI_ADMIN_PASSWORD: a random
      # admin password is generated into GUI_INITIAL_PASSWORD_FILE (0600, never
      # logged): docker compose exec gui-bff cat /data/initial-admin-password
      GUI_JWT_SECRET: ${GUI_JWT_SECRET:-}
      # PR-SEC-5: HS256 (default) signs the session token with GUI_JWT_SECRET. RS256 or ES256 signs with the PEM private key in GUI_JWT_PRIVATE_KEY_FILE (a file mounted by an
      # override, like GUI_TOTP_KEY_FILE) and publishes the public keys at /.well-known/jwks.json; GUI_JWT_PREVIOUS_KEY_FILES (comma separated) are the keys of earlier rotations.
      # Changing the algorithm ends every session. gui-bff/README.md "Signing keys".
      GUI_JWT_ALGORITHM: ${GUI_JWT_ALGORITHM:-HS256}
      GUI_JWT_PRIVATE_KEY_FILE: ${GUI_JWT_PRIVATE_KEY_FILE:-}
      GUI_JWT_PREVIOUS_KEY_FILES: ${GUI_JWT_PREVIOUS_KEY_FILES:-}
      GUI_ADMIN_PASSWORD: ${GUI_ADMIN_PASSWORD:-}
      GUI_OPERATOR_PASSWORD: ${GUI_OPERATOR_PASSWORD:-}
      GUI_VIEWER_PASSWORD: ${GUI_VIEWER_PASSWORD:-}
      GUI_COOKIE_SECURE: ${GUI_COOKIE_SECURE:-true}
      GUI_SESSION_TTL_SECONDS: ${GUI_SESSION_TTL_SECONDS:-28800}    # how long a sign-in lasts (8 h)
      # OIDC login (PR-SEC-6), off unless GUI_OIDC_ENABLED=true: docs/CONFIGURATION.md, gui-bff/README.md "OIDC login". The client's credential
      # is better mounted as a file (GUI_OIDC_CLIENT_SECRET_FILE) than set here.
      GUI_OIDC_ENABLED: ${GUI_OIDC_ENABLED:-false}
      GUI_OIDC_ISSUER: ${GUI_OIDC_ISSUER:-}
      GUI_OIDC_CLIENT_ID: ${GUI_OIDC_CLIENT_ID:-}
      GUI_OIDC_CLIENT_SECRET: ${GUI_OIDC_CLIENT_SECRET:-}
      GUI_OIDC_REDIRECT_URI: ${GUI_OIDC_REDIRECT_URI:-}
      GUI_OIDC_SCOPES: ${GUI_OIDC_SCOPES:-openid profile email}
      GUI_OIDC_GROUPS_CLAIM: ${GUI_OIDC_GROUPS_CLAIM:-groups}
      GUI_OIDC_GROUP_ROLE_MAP: ${GUI_OIDC_GROUP_ROLE_MAP:-}
      GUI_OIDC_DEFAULT_ROLE: ${GUI_OIDC_DEFAULT_ROLE:-}
      GUI_OIDC_SCOPE_CLAIM: ${GUI_OIDC_SCOPE_CLAIM:-}
      GUI_OIDC_PROVIDER_NAME: ${GUI_OIDC_PROVIDER_NAME:-SSO}
      GUI_OIDC_POST_LOGOUT_REDIRECT_URI: ${GUI_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      GUI_OIDC_ALLOW_HTTP: ${GUI_OIDC_ALLOW_HTTP:-false}
      GUI_LOCAL_LOGIN_ENABLED: ${GUI_LOCAL_LOGIN_ENABLED:-true}
      # Audit-log retention (PR-DB-3.6): the BFF has no worker; run `docker compose exec gui-bff python -m app.retention` (cron on the host). 0 keeps all.
      GUI_AUDIT_RETENTION_DAYS: ${GUI_AUDIT_RETENTION_DAYS:-0}
      GUI_AUDIT_EXPORT_DIR: ${GUI_AUDIT_EXPORT_DIR:-}
      SMO_RETENTION_WARN_ROWS: ${SMO_RETENTION_WARN_ROWS:-1000000}
      # Multi-factor sign-in (PR-SEC-7), all off or unchanged by default: GUI_LOGIN_MODE=oidc makes the identity provider the only way in (a break-glass
      # account keeps password + one-time code), GUI_TOTP_KEY switches on one-time codes for local accounts (prefer a file: GUI_TOTP_KEY_FILE, mounted
      # by an override), GUI_ADMIN_MFA_REQUIRED=true makes every local admin enrol one. gui-bff/README.md "One-time codes", docs/CONFIGURATION.md.
      GUI_LOGIN_MODE: ${GUI_LOGIN_MODE:-both}
      GUI_TOTP_KEY: ${GUI_TOTP_KEY:-}
      GUI_TOTP_ISSUER: ${GUI_TOTP_ISSUER:-SMO Operator Console}
      GUI_ADMIN_MFA_REQUIRED: ${GUI_ADMIN_MFA_REQUIRED:-false}
    volumes:
      - gui_bff_data:/data   # GUI users, audit log, the BFF's SME invoker credential

  # ---------------------------------------------------------------- TLS edge (profile `tls`, PR-SEC-1)
  # PR-SB-1.4: a real NETCONF-over-SSH server (Netopeer2) with one small model, for the SSH transport of ran-nf-oam.
  # Not part of the stack: `docker compose --profile netconf-lab up -d netconf-lab`. See netconf-lab/README.md. It is a third-party
  # development image and runs as root (its supervisor needs to), so it does not take the *hardening anchor; port on loopback only.
  netconf-lab:
    profiles: ["netconf-lab"]
    image: sysrepo/sysrepo-netopeer2@sha256:36cc1d841c97f118d62f775024d60fb1ce210c3bca6b32135c1a9e5a358a1cc9
    command: ["/bin/sh", "/lab/start.sh"]
    ports: ["127.0.0.1:8830:830", "127.0.0.1:6513:6513"]       # SSH, and NETCONF over TLS (PR-SB-2.5)
    volumes:
      - ./netconf-lab:/lab:ro
      - ./netconf-lab/pki:/pki                                  # the lab's throwaway CA and client certificate, written at start (git-ignored)

  # `docker compose --profile tls up -d` adds an HTTPS door in front of the GUI (:3443) and R1 Termination (:8443).
  # Run scripts/make_dev_certs.sh first. The default stack does not start it and needs no certificate.
  edge-tls:
    profiles: ["tls"]
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
    <<: *hardening
    depends_on: [r1-termination, gui, sme]
    ports: ["3443:3443", "8443:8443"]
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [tls_cert, tls_key]

  # Traces and logs (PR-OBS-3, PR-OBS-6; docs/OBSERVABILITY.md). Two profiles, both off by default, sharing one Grafana. The configuration files are the
  # chart's (deploy/helm/smo/files/observability/), so compose and Kubernetes run the same ones. Lab stores: Tempo and Loki keep their data in a volume
  # on local disk and run as the image's own user (10001), which owns the volume (as root with no capability they cannot write it: PR-OBS-3.6).
  #   SMO_WITH_TRACING=1 SMO_OTEL_ENDPOINT=http://tempo:4318 docker compose --profile tracing up -d --build
  #   docker compose --profile logging up -d
  tempo:
    profiles: ["tracing"]
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/helm/smo/files/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    profiles: ["logging"]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/helm/smo/files/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  # Reads every container's json-file log (the Docker default), so it needs the host's container log directory, read-only, and root to read it.
  fluent-bit:
    profiles: ["logging"]
    image: fluent/fluent-bit:5.1.3
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    user: "0"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [loki]
    volumes:
      - ./deploy/helm/smo/files/observability/fluent-bit-compose.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/helm/smo/files/observability/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  grafana:
    profiles: ["tracing", "logging"]
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # a lab Grafana, bound to this machine's port only: anonymous viewers, no sign-in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/helm/smo/files/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/smo.yaml:ro

  gui:
    build: { context: ./gui }
    <<: *hardening
    depends_on: [gui-bff]
    ports: ["3000:8080"]

