  # --- teiv/module.yaml
  # ---------------------------------------------------------------- TE&IV on O-RAN-SC smo-teiv (profile `teiv`, plan task S3.23, ADR 0013 section 8, D19)
  # smo-teiv 0.3.0 with TE&IV's model extension (teiv/model/), built from the pinned tag (teiv/Dockerfile, teiv/Dockerfile.db; O-RAN-SC publishes no 0.3.0
  # image; .github/workflows/teiv-image.yml builds and publishes the same two images for the chart). Not part of the default stack:
  #   ./scripts/init_secrets.sh && docker compose --profile teiv up -d --build
  # Two processes of one image: `teiv-ingestion` consumes TE&IV's CloudEvents from the topic smo.teiv.ingestion.v1 on the shared broker (`kafka`, which
  # the profile starts too) and is the only writer of smo-teiv's database (D6); `teiv-exposure` serves smo-teiv's own REST API. D19 / ADR 0011: no module but
  # TE&IV reaches the topic, the database or that API. The database and the API are on the network `teiv` only (internal: no egress), which only these
  # services and the broker join, and they publish no port; the topic is reserved by name (smo_shared/kafka_settings.py refuses smo.teiv.* for any other
  # producer, and the Kafka relay of the DME worker cannot be pointed at it); per-principal ACLs on the broker are PR-CONV-S1.15.
  # TE&IV's own process (the facade, the only producer of the topic, S3.19) joins `teiv` when it exists. Memory: 3 GiB at 1,000 cells for these three and
  # the broker (teiv/loadtest/budget.py, the CI workflow "TE&IV load"); the heap sizes and limits below hold it.
  teiv-db:
    profiles: ["teiv"]
    build:
      context: ./teiv
      dockerfile: Dockerfile.db
      additional_contexts:
        teiv: ${TEIV_SOURCE:-https://github.com/o-ran-sc/smo-teiv.git#ee898469d2b9a3de5047ac6675f097ca72e97884}
    image: local/smo-teiv-db:0.3.0-ext
    restart: unless-stopped
    user: "70:70"                 # `postgres` of the alpine image from the start, so its entrypoint needs no capability to chown and change user; the volume takes the image's ownership
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]          # and its socket directory: the entrypoint's own initialisation connects there, wherever the server is told to put it
    networks: [teiv]
    secrets: [teiv_db_password]
    environment:
      POSTGRES_DB: topology_exposure_db
      POSTGRES_USER: topology_exposure_user
      POSTGRES_PASSWORD_FILE: /run/secrets/teiv_db_password
    volumes:
      - smo_teiv_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { memory: 768m }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topology_exposure_user -d topology_exposure_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates TE&IV's ingestion topic on the shared broker before smo-teiv's ingestion starts (the broker creates no topic on its own). smo-teiv's own
  # admin client would make it with three replicas (upstream's default) and retry for ever on one broker; here it exists, with one.
  teiv-kafka-init:
    profiles: ["teiv"]
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [teiv]
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic smo.teiv.ingestion.v1
        --partitions 4 --replication-factor 1

  teiv-ingestion:
    profiles: ["teiv"]
    build: &teiv_build
      context: ./teiv
      additional_contexts:
        teiv: ${TEIV_SOURCE:-https://github.com/o-ran-sc/smo-teiv.git#ee898469d2b9a3de5047ac6675f097ca72e97884}
    image: local/smo-teiv:0.3.0-ext
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    networks: [teiv]
    secrets:
      - { source: teiv_db_password, target: SERVICE_DB_PASSWORD }     # read by Spring's configtree below, so the password is never an environment variable
    environment: &teiv_env
      SPRING_PROFILES_ACTIVE: ingestion
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SERVICE_DB_URL: jdbc:postgresql://teiv-db:5432/topology_exposure_db
      SERVICE_DB_REPLICA_URL: jdbc:postgresql://teiv-db:5432/topology_exposure_db
      SERVICE_DB_USER: topology_exposure_user
      # the shared broker, TE&IV's topic (one replica, as made by teiv-kafka-init) and a consumer group named for it
      SPRING_APPLICATION_JSON: >-
        {"kafka":{"server":{"bootstrap-server-host":"kafka","bootstrap-server-port":9092},
        "topology-ingestion":{"topic":{"name":"smo.teiv.ingestion.v1","partitions":4,"replicas":1},"consumer":{"group-id":"smo.teiv.ingestion"}}}}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
    deploy:
      resources:
        limits: { memory: 1152m }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/liveness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      teiv-db: { condition: service_healthy }
      teiv-kafka-init: { condition: service_completed_successfully }

  teiv-exposure:
    profiles: ["teiv"]
    build: *teiv_build
    image: local/smo-teiv:0.3.0-ext
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    networks: [teiv]
    secrets:
      - { source: teiv_db_password, target: SERVICE_DB_PASSWORD }
    environment:
      <<: *teiv_env
      SPRING_PROFILES_ACTIVE: exposure,groups
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
    deploy:
      resources:
        limits: { memory: 640m }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      teiv-db: { condition: service_healthy }

  # <<< modules

  # ---------------------------------------------------------------- TLS edge (profile `tls`, PR-SEC-1)
  # PR-SB-1.4: a real NETCONF-over-SSH server (Netopeer2) with one small model, for the SSH transport of ran-nf-oam.
  # Not part of the stack: `docker compose --profile netconf-lab up -d netconf-lab`. See netconf-lab/README.md. It is a third-party
  # development image and runs as root (its supervisor needs to), so it does not take the *hardening anchor; port on loopback only.
  netconf-lab:
    profiles: ["netconf-lab"]
    image: sysrepo/sysrepo-netopeer2@sha256:36cc1d841c97f118d62f775024d60fb1ce210c3bca6b32135c1a9e5a358a1cc9
    command: ["/bin/sh", "/lab/start.sh"]
    ports: ["127.0.0.1:8830:830", "127.0.0.1:6513:6513"]       # SSH, and NETCONF over TLS (PR-SB-2.5)
    volumes:
      - ./netconf-lab:/lab:ro
      - ./netconf-lab/pki:/pki                                  # the lab's throwaway CA and client certificate, written at start (git-ignored)

  # ---------------------------------------------------------------- O-RAN-SC O1 simulator (profile `oran-sim`, plan task S0.15, ADR 0012)
  # Simulated O-DUs (O-RAN-SC sim-o1-ofhmp-interfaces, "PyNTS", m-release): NETCONF on 830 with the 3GPP NRM, VES to RAN NF OAM's listener
  # (pnfRegistration at start, a stndDefined notifyFileReady per PM file) and the PM files over SFTP (22; its FTP listens on IPv6 only, which this
  # network does not have). Not part of the stack:
  #   RAN_NF_OAM_VES_PASSWORD=<pw> ORAN_SIM_NETCONF_PASSWORD='netconf!' docker compose --profile oran-sim up -d --build
  # RAN_NF_OAM_VES_PASSWORD switches RAN NF OAM's VES listener on, and the simulators post with it; ORAN_SIM_NETCONF_PASSWORD gives RAN NF OAM the simulators'
  # NETCONF password as the credential `oransim` (it must be the image's built-in `netconf!`).
  # ORAN_SIM_COUNT simulated O-DUs (default 2), each with its own address and hostname (the VES sourceName). Upstream publishes no image, so it
  # is built here from the pinned m-release commit (oran-sim/Dockerfile; ORAN_SIM_SOURCE points elsewhere, a local clone for example). The
  # netconf-lab profile and the mock O1 adaptor stay for the fast tests. Hardening: no-new-privileges and cap_drop ALL like every other
  # service, then only the capabilities its root daemons need (ADR 0012 section 5): sshd and vsftpd change user and chroot (SETUID, SETGID,
  # SYS_CHROOT, AUDIT_WRITE), bind ports below 1024 (NET_BIND_SERVICE: 22, 830, and 21 for FTP) and own the files they write (CHOWN, DAC_OVERRIDE, FOWNER);
  # the simulator sends a DHCPDISCOVER on start-up and stops if it cannot (NET_RAW). Not privileged, no NET_ADMIN (upstream asks for both).
  # The root filesystem is not read-only: sysrepo keeps its datastores under /etc/sysrepo and /dev/shm, and the PM files go to /ftp. No port on the host.
  oran-sim-du:
    profiles: ["oran-sim"]
    build:
      context: ./oran-sim
      additional_contexts:
        pynts: ${ORAN_SIM_SOURCE:-https://github.com/o-ran-sc/sim-o1-ofhmp-interfaces.git#12124176a491a873eb41423200c7f7add9ea99d4}
    image: local/smo-oran-sim-du:m-release-1212417
    deploy:
      replicas: ${ORAN_SIM_COUNT:-2}
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SYS_CHROOT, AUDIT_WRITE, NET_BIND_SERVICE, NET_RAW]
    security_opt: ["no-new-privileges:true"]
    environment:
      VES_URL: http://ran-nf-oam:8000/ves/eventListener/v7      # plain HTTP on the compose network; the simulator does not check a certificate either way
      VES_USERNAME: ${RAN_NF_OAM_VES_USERNAME:-ves}
      VES_PASSWORD: ${RAN_NF_OAM_VES_PASSWORD:-}
      NETCONF_USERNAME: netconf
      NETCONF_PASSWORD: "netconf!"          # the image's built-in, public password (upstream's): its NETCONF user and its SFTP user both have it (oran-sim/Dockerfile)
      SDNR_RESTCONF_URL: ""                                       # no OpenDaylight here: nothing is sent to an SDN controller
      ENDPOINT_COUNT: "1"
    depends_on:
      ran-nf-oam: { condition: service_started }

  # `docker compose --profile tls up -d` adds an HTTPS door in front of the GUI (:3443) and R1 Termination (:8443).
  # Run scripts/make_dev_certs.sh first. The default stack does not start it and needs no certificate.
  edge-tls:
    profiles: ["tls"]
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    <<: *hardening
    depends_on: [r1-termination, gui, sme]
    ports: ["3443:3443", "8443:8443"]
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [tls_cert, tls_key]

  # Traces and logs (PR-OBS-3, PR-OBS-6; docs/OBSERVABILITY.md). Two profiles, both off by default, sharing one Grafana. The configuration files are the
  # chart's (deploy/helm/smo/files/observability/), so compose and Kubernetes run the same ones. Lab stores: Tempo and Loki keep their data in a volume
  # on local disk and run as the image's own user (10001), which owns the volume (as root with no capability they cannot write it: PR-OBS-3.6).
  #   SMO_WITH_TRACING=1 SMO_OTEL_ENDPOINT=http://tempo:4318 docker compose --profile tracing up -d --build
  #   docker compose --profile logging up -d
  tempo:
    profiles: ["tracing"]
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/helm/smo/files/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    profiles: ["logging"]
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/loki.yaml"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./deploy/helm/smo/files/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  # Reads every container's json-file log (the Docker default), so it needs the host's container log directory, read-only, and root to read it.
  fluent-bit:
    profiles: ["logging"]
    image: fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    user: "0"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [loki]
    volumes:
      - ./deploy/helm/smo/files/observability/fluent-bit-compose.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/helm/smo/files/observability/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  grafana:
    profiles: ["tracing", "logging"]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # a lab Grafana, bound to this machine's port only: anonymous viewers, no sign-in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/helm/smo/files/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/smo.yaml:ro

  # The object store (D10, plan task S1.10), profile `objectstore`: SeaweedFS (Apache-2.0) with its S3 API on objectstore:8333, one data volume, the access and
  # secret key from secret files (scripts/init_secrets.sh), written into the S3 identity file in /tmp at start (never into the image or the environment).
  # `objectstore-init` creates the three buckets (models, csars, cold-parquet) with smo_shared.objectstore, which is what the modules will use (S2.5 moves the
  # model artifacts there; nothing does yet). The S3 port is published on this machine's loopback only.
  #   docker compose --profile objectstore up -d objectstore objectstore-init
  objectstore:
    profiles: ["objectstore"]
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "1000:1000"                  # the image's seaweed user, which owns /data in the image and so in a new volume
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    secrets: [objectstore_access_key, objectstore_secret_key]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        printf '{"identities":[{"name":"smo","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$(cat /run/secrets/objectstore_access_key)" "$$(cat /run/secrets/objectstore_secret_key)" > /tmp/s3.json &&
        exec /usr/bin/weed -logtostderr=true server -dir=/data -ip=objectstore -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - smo_objectstore:/data
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  objectstore-init:
    profiles: ["objectstore"]
    build: { context: ., args: { <<: *build_info, MODULE: r1-termination } }    # any service image carries smo_shared; the migrate service's build
    stop_grace_period: 30s
    command: ["python", "-m", "smo_shared.objectstore", "ensure-buckets"]
    restart: "no"
    <<: *hardening
    secrets: [objectstore_access_key, objectstore_secret_key]
    depends_on: { objectstore: { condition: service_healthy } }
    environment: &objectstore_env
      SMO_OBJECTSTORE_URL: http://objectstore:8333
      SMO_OBJECTSTORE_ACCESS_KEY_FILE: /run/secrets/objectstore_access_key
      SMO_OBJECTSTORE_SECRET_KEY_FILE: /run/secrets/objectstore_secret_key

  # MinIO, profile `minio`: the same S3 API on minio:9000 instead of SeaweedFS, for an operator who runs MinIO already. MinIO is AGPL-3.0 (D10 keeps it optional,
  # README "Object store"), and MinIO publishes no community image any more: this is Bitnami's last build of 2025.7.23, frozen (bitnamilegacy, no further
  # updates). A lab convenience, not a store to run in production; production points SMO_OBJECTSTORE_URL at a MinIO or S3 the operator runs.
  #   docker compose --profile minio up -d minio minio-init
  minio:
    profiles: ["minio"]
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [objectstore_access_key, objectstore_secret_key]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/objectstore_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/objectstore_secret_key
      MINIO_BROWSER: "off"
    volumes:
      - smo_minio:/bitnami/minio/data
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  minio-init:
    profiles: ["minio"]
    build: { context: ., args: { <<: *build_info, MODULE: r1-termination } }
    stop_grace_period: 30s
    command: ["python", "-m", "smo_shared.objectstore", "ensure-buckets"]
    restart: "no"
    <<: *hardening
    secrets: [objectstore_access_key, objectstore_secret_key]
    depends_on: { minio: { condition: service_healthy } }
    environment:
      <<: *objectstore_env
      SMO_OBJECTSTORE_URL: http://minio:9000

  # Kafka (D9, ADR 0006 slice 3), profile `kafka`: one broker and controller (KRaft, no ZooKeeper), PLAINTEXT on the compose network only (no port on the host;
  # ADR 0006 Q5: a lab broker). The broker S3.23 will share with smo-teiv: topics are named per owner (smo.<owner>[.<stream>].v<N>, smo_shared/kafka_settings.py),
  # so per-owner ACLs (PR-CONV-S1.15) can be added without renaming, and smo-teiv's ingestion topic (smo.teiv....) is not created here and is no module's but
  # TE&IV's. `kafka-init` creates the event bus's topic smo.events.v1 (6 partitions by default, one replica: one broker); the DME worker relays to it.
  kafka:
    profiles: ["kafka", "teiv"]                    # TE&IV's smo-teiv shares this broker (S3.23)
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    restart: unless-stopped
    networks: [default, teiv]                      # the DME worker's relay on default; smo-teiv's ingestion on teiv only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"     # a topic exists because kafka-init (or the platform team) made it, never because a client named it
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - smo_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  kafka-init:
    profiles: ["kafka"]
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $${SMO_KAFKA_EVENTS_TOPIC}
        --partitions $${SMO_KAFKA_PARTITIONS} --replication-factor $${SMO_KAFKA_REPLICATION}
    environment:
      SMO_KAFKA_EVENTS_TOPIC: ${SMO_KAFKA_EVENTS_TOPIC:-smo.events.v1}
      SMO_KAFKA_PARTITIONS: ${SMO_KAFKA_PARTITIONS:-6}
      SMO_KAFKA_REPLICATION: ${SMO_KAFKA_REPLICATION:-1}

secrets:
  # >>> modules: generated by scripts/modules.py from each <module>/module.yaml (compose.secrets); edit those, then run it with --write
  # --- aimgf/module.yaml
  db_password_aimgf:
    file: ./secrets/db_password_aimgf

  # --- dme/module.yaml
  db_password_dme:
    file: ./secrets/db_password_dme

  # --- echo/module.yaml
  db_password_echo:
    file: ./secrets/db_password_echo

  # --- focom/module.yaml
  db_password_focom:
    file: ./secrets/db_password_focom

  # --- intent-service/module.yaml
  db_password_intent-service:
    file: ./secrets/db_password_intent-service

  # --- mdaf/module.yaml
  db_password_mdaf:
    file: ./secrets/db_password_mdaf

  # --- nfo/module.yaml
  db_password_nfo:
    file: ./secrets/db_password_nfo

  # --- onboarding/module.yaml
  db_password_onboarding:         # the password of the role smo_onboarding (PR-DB-2.6), set by scripts/db_roles.py
    file: ./secrets/db_password_onboarding

  # --- r1-termination/module.yaml
  db_password_r1-termination:
    file: ./secrets/db_password_r1-termination

  # --- ran-analytics/module.yaml
  db_password_ran-analytics:
