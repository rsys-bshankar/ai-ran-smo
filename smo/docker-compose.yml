    file: ./secrets/objectstore_access_key
  objectstore_secret_key:
    file: ./secrets/objectstore_secret_key
  db_password:
    file: ./secrets/db_password   # created by scripts/init_secrets.sh; git-ignored
  enrollment_secret:              # PR-SEC-14: what an SMO module presents to SME to be recorded as one (never an rApp); same script
    file: ./secrets/enrollment_secret
  tls_cert:                       # the `tls` profile only; created by scripts/make_dev_certs.sh
    file: ./certs/server.crt
  tls_key:
    file: ./certs/server.key

networks:
