# rapp-mgmt: what this module is to the rest of the SMO (scripts/modules.py; the schema is scripts/module.schema.json). Edit this file, then run
# `python scripts/modules.py --write` from smo/: it regenerates the shared files that list modules, and CI runs `--check`.
name: rapp-mgmt
lane: rapp-mgmt
r1:
  - {prefix: /rapp-mgmt, env: RAPP_MGMT_URL, url: "http://rapp-mgmt:8000"}
database:
  role: {schema: rapp_mgmt, shared: [module_identity, notification_outbox, idempotency_key, periodic_run, audit_log, audit_head, smo_event, smo_event_relay]}
  tables: [rapp_fault_report, rapp_instance, rapp_instance_version, rapp_performance_report]
openapi: true
tests: {source: app, pythonpath: ".:../shared", floor: 97}
mutation: null
code_docs: true
config_reference: true
compose:
  services: |
    rapp-mgmt:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: rapp-mgmt, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      stop_grace_period: 30s
      secrets: [db_password_rapp-mgmt, enrollment_secret]
      <<: *hardening
      healthcheck: *ready_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
        SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_rapp_mgmt@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_rapp-mgmt
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway

    # SEC-15.19: the same image, run as a worker. It rotates the secret of running rApp instances that are older than RAPP_MGMT_SECRET_ROTATION_DAYS (rapp-mgmt/app/tasks.py).
    # With the default 0 it rotates nothing. Run as many as you like: the task runs once per interval across all of them.
    rapp-mgmt-worker:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: rapp-mgmt, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      command: ["python", "-m", "smo_shared.worker"]
      stop_grace_period: 30s
      secrets: [db_password_rapp-mgmt, enrollment_secret]
      <<: *hardening
      healthcheck: *worker_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}
        SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # the worker is the same SMO module as rapp-mgmt (one identity, ST-4)
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_rapp_mgmt@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_rapp-mgmt
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}
        RAPP_MGMT_SECRET_ROTATION_DAYS: ${RAPP_MGMT_SECRET_ROTATION_DAYS:-0}                     # 0: no automatic rotation
        RAPP_MGMT_SECRET_ROTATION_MAX_PER_RUN: ${RAPP_MGMT_SECRET_ROTATION_MAX_PER_RUN:-10}
        RAPP_MGMT_SECRET_ROTATION_SWEEP_SECONDS: ${RAPP_MGMT_SECRET_ROTATION_SWEEP_SECONDS:-900}
  secrets: |
    db_password_rapp-mgmt:
      file: ./secrets/db_password_rapp-mgmt
helm: |
  rapp-mgmt: { image: rapp-mgmt, databaseRole: rapp-mgmt, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the same image as a worker: rotates the secret of running rApp instances older than RAPP_MGMT_SECRET_ROTATION_DAYS (SEC-15.19; 0 = never, the default: the worker then does nothing)
  rapp-mgmt-worker: { image: rapp-mgmt, databaseRole: rapp-mgmt, kind: worker, env: { R1_GATEWAY_URL: "http://r1-termination:8000", RAPP_MGMT_SECRET_ROTATION_DAYS: "0", RAPP_MGMT_SECRET_ROTATION_MAX_PER_RUN: "10", RAPP_MGMT_SECRET_ROTATION_SWEEP_SECONDS: "900" } }
