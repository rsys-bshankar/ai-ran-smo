# Mutual TLS between the services (PR-SEC-2). Off unless you ask for it: the default stack is unchanged.
#
#   scripts/init_secrets.sh                                     (once, as for the default stack)
#   scripts/mtls_certs.py init                                  a development CA and a certificate per service in certs/mtls (git-ignored)
#   docker compose -f docker-compose.yml -f docker-compose.mtls.yml up -d --build
#
# What it does: every SMO service (and the sample rApps) serves HTTPS on :8000 and REFUSES a client that does not present a certificate signed by the CA;
# every call a module makes (R1Client, the gateway's proxying and token introspection, the callbacks to another service) presents the module's own
# certificate and verifies the server against the CA. Each service mounts its own directory read-only at /run/mtls (tls.crt, tls.key, ca.crt).
# Not part of it, by design: mock-o1-adaptor (a stand-in for a network function outside the SMO: plain HTTP; so its emit routes, POST /emit/alarm and the others, cannot reach a RAN NF OAM that requires a client certificate: they answer 502 under this overlay), the GUI's nginx and gui-bff (the BFF is a client
# of R1, with a certificate, and serves the nginx plain HTTP), Postgres (its TLS is the separate overlay docker-compose.pgtls.yml, PR-SEC-2.4; the two can be combined). The tracing and logging profiles' third-party containers (tempo, loki,
# fluent-bit, grafana) are not part of it either: spans go to tempo over plain OTLP/HTTP.
#
# Consequences: the published port 8080 is the gateway over mTLS, so a host client needs a certificate too (`scripts/mtls_certs.py client NAME`, then
# `curl --cacert certs/mtls/ca/ca.crt --cert certs/mtls/clients/NAME/tls.crt --key certs/mtls/clients/NAME/tls.key https://localhost:8080/live`); the `tls`
# profile's edge forwards plain HTTP and does not work with this file; a health check cannot be a plain HTTP request (the server would refuse it), so each
# service's check is `python -m smo_shared.mtls probe`, which calls /ready over TLS with the service's own certificate. A notification destination inside
# the stack must be https:// (a plain http:// one cannot reach a service that requires a certificate).
# Rotation: scripts/mtls_certs.py renew | rotate-ca (its docstring), then `docker compose ... up -d --force-recreate`; expiry: `scripts/mtls_certs.py status`
# and the metric smo_mtls_cert_not_after_timestamp_seconds (docs/runbooks/SmoMtlsCertExpiring.md).

x-mtls-probe: &mtls_probe
  test: ["CMD", "python", "-m", "smo_shared.mtls", "probe", "/ready"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  r1-termination:
    environment:
      SMO_MTLS: "on"
    volumes:
      - ./certs/mtls/r1-termination:/run/mtls:ro
    healthcheck: *mtls_probe
  sme:
    environment:
      SMO_MTLS: "on"
    volumes:
      - ./certs/mtls/sme:/run/mtls:ro
    healthcheck: *mtls_probe
  dme:
    environment:
      SMO_MTLS: "on"
    volumes:
      - ./certs/mtls/dme:/run/mtls:ro
    healthcheck: *mtls_probe
  onboarding:
    environment:
      SMO_MTLS: "on"
    volumes:
      - ./certs/mtls/onboarding:/run/mtls:ro
    healthcheck: *mtls_probe
  rapp-mgmt:
