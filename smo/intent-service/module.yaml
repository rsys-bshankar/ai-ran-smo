# intent-service: what this module is to the rest of the SMO (scripts/modules.py; the schema is scripts/module.schema.json). Edit this file, then run
# `python scripts/modules.py --write` from smo/: it regenerates the shared files that list modules, and CI runs `--check`.
name: intent-service
lane: intent-service
r1:
  - {prefix: /intent-service, env: INTENT_SERVICE_URL, url: "http://intent-service:8000"}
database:
  role: {schema: intent_service, shared: [module_identity, notification_outbox, idempotency_key]}
  tables: [autonomy_dispatch, intent, intent_handling_function, intent_report, intent_utility_formula]
openapi: true
tests: {source: app, pythonpath: ".:../shared", floor: 98}
mutation: null
code_docs: true
config_reference: false
compose:
  services: |
    intent-service:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: intent-service, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      stop_grace_period: 30s
      secrets: [db_password_intent-service, enrollment_secret]
      <<: *hardening
      healthcheck: *ready_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
        SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_intent_service@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_intent-service
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway (DOC-CF-3.1)
  secrets: |
    db_password_intent-service:
      file: ./secrets/db_password_intent-service
helm: |
  intent-service: { image: intent-service, databaseRole: intent-service }
