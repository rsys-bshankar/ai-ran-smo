# The CloudNativePG cluster of ci/cnpg-cluster.yaml with continuous WAL archiving and base backups to an S3-compatible bucket (PR-HA-6.2).
# An example to copy (the drill of .github/workflows/smo-dr.yml runs it against an S3 stand-in): replace the bucket, the endpoint and the credentials. For MinIO keep `endpointURL`; for AWS S3 drop it
# (and give the credentials by IRSA or a pod identity instead of a Secret).
#
#   * barman-cloud-wal-archive ships every finished WAL segment, and `archive_timeout` forces a segment switch on a quiet database, so the newest
#     data that can be lost is about archive_timeout plus the upload (here 5 minutes): inside the RPO of 15 minutes (docs/DISASTER_RECOVERY.md).
#   * base backups are scheduled by the chart: `--set postgres.cnpgBackup.enabled=true --set postgres.cnpgBackup.cluster=smo-pg`.
#   * `retentionPolicy` deletes base backups (and the WAL before the oldest kept one) older than 14 days.
#
# Restore into a new cluster: a Cluster with `bootstrap.recovery` pointing at this object store (and, optionally, a `recoveryTarget.targetTime`
# for point-in-time recovery): the runbook in docs/DISASTER_RECOVERY.md, "Kubernetes with CloudNativePG".
apiVersion: v1
kind: Secret
metadata:
  name: smo-pg-backup-s3
type: Opaque
stringData:
  ACCESS_KEY_ID: replace-me
  ACCESS_SECRET_KEY: replace-me
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: smo-pg
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4@sha256:3c0ba08ea353c9705a755c113e4ae395be76553e0ed68076e5410cb09b9d17d9
  primaryUpdateStrategy: unsupervised
  storage:
    size: 2Gi
  postgresql:
    parameters:
      max_connections: "300"
      archive_timeout: "300"
  bootstrap:
    initdb:
      database: smo
      owner: smo
      secret:
        name: smo-pg-owner
      postInitApplicationSQL:
        - ALTER ROLE smo CREATEROLE
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://smo-backups/smo-pg
      endpointURL: http://minio.minio.svc:9000
      s3Credentials:
        accessKeyId: { name: smo-pg-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: smo-pg-backup-s3, key: ACCESS_SECRET_KEY }
      wal:
        compression: gzip
      data:
        compression: gzip
