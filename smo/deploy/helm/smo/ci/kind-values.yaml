# The CI install on kind (.github/workflows/smo-tests.yml, job `helm`): images built from the checkout and loaded into the cluster, so nothing is pulled.
image:
  registry: local
  tag: ci
  pullPolicy: Never
gui:
  env:
    GUI_COOKIE_SECURE: "false"          # no TLS in front of the GUI in CI
rappCredentials:
  delivery: kubernetes                  # exercised by the "credentials reach a Secret" step
modules:
  echo:
    enabled: true                       # PR-CONV-S1.6: the reference ProvMnS module is off by default; CI runs it so its image and role are proved on the cluster
