# Production sample: the retention periods proposed in docs/RETENTION.md (DB-3.10), and the production safeguards at the end and under rapp-mgmt (signed packages, SME registration; call flow 01). The chart's own defaults keep every row (0), so an upgrade deletes
# nothing; this file is what an operator who has confirmed the periods layers on top:
#   helm upgrade --install smo deploy/helm/smo -f deploy/helm/smo/values-production.yaml -f my-values.yaml
# The numbers are proposals, not legal advice: the retention a law or a contract requires is yours to decide (docs/PRIVACY.md). Change a number here
# and in docs/RETENTION.md together (tests_integration/test_helm_chart.py checks that this file sets every retention variable of that document).
# Sizing the disk: docs/SIZING.md. A table whose retention is left at 0 is reported by the metric smo_retention_off_rows{table} and a daily
# warning once it is large (SMO_RETENTION_WARN_ROWS, default 1000000).
modules:
  # Call flow 01d (DOC-CF-1.1 review): an instance runs only once every SME declaration of its package is registered (default: best-effort).
  rapp-mgmt:
    env:
      RAPP_MGMT_REQUIRE_SME_REGISTRATION: "true"
  ran-nf-oam:
    env:
      SAFEGUARD_REFUSAL_RETENTION_DAYS: "90"       # safeguard refusals; also what POST /safeguard-refusals/purge uses
  ran-nf-oam-worker:
    env:
      SAFEGUARD_REFUSAL_RETENTION_DAYS: "90"       # task purge-safeguard-refusals, hourly
      SMO_RETENTION_ALARMS_DAYS: "90"              # task purge-cleared-alarms: only alarms cleared more than 90 days ago; a raised alarm is never removed
      SMO_RETENTION_PM_FILES_DAYS: "14"            # task purge-pm-files: keep at least the longest KPI look-back
  mdaf-worker:
    env:
      SMO_RETENTION_MDAF_REPORTS_DAYS: "30"        # task purge-reports

# The GUI backend's audit log is purged by a command, not by a worker, and NOT by a CronJob of this chart: its SQLite file is on a volume that
# one pod may hold (gui-bff rolls with Recreate, ReadWriteOnce), so a second pod cannot open it safely. These two variables go to the gui-bff pod, and
# the command runs inside that pod, from your scheduler (a CronJob of your own with a service account allowed to `pods/exec`, or the platform's job runner):
#   kubectl -n smo exec deploy/gui-bff -- python -m app.retention
# With GUI_AUDIT_EXPORT_DIR set the rows are first written there as JSON lines and only the rows written are deleted; the directory is on the pod's
# volume (/data), so archive it off the volume (copy it out, or use a backup that takes the volume) before it fills.
gui:
  env:
    GUI_AUDIT_RETENTION_DAYS: "365"
    GUI_AUDIT_EXPORT_DIR: /data/audit-export

# Sign-in (PR-SEC-7), NOT switched on here because it needs a Secret that only you can create: GUI_ADMIN_MFA_REQUIRED=true makes a local admin enrol a one-time
# code first, and the backend refuses to start with it unless it has the key for the code secrets. To switch it on, create the Secret and uncomment:
#   kubectl -n smo create secret generic gui-totp --from-literal=totp-key="$(openssl rand -base64 32)"
# gui:
#   totpKeySecretRef: { name: gui-totp, key: totp-key }
#   env:
#     GUI_ADMIN_MFA_REQUIRED: "true"
#     GUI_LOGIN_MODE: oidc          # only with the OIDC settings in gui.env; "both" (the default) keeps the password form
# gui-bff/README.md, "Multi-factor sign-in".

# Encryption of the SME identities kept in the database (SEC-15.18), NOT switched on here because it needs a Secret that only you can create. Create it, uncomment, upgrade,
# then run the one-shot command in a pod (deploy/helm/smo/README.md, "Encrypting the module identities"):
#   kubectl -n smo create secret generic smo-identity-key --from-literal=identity-key="$(openssl rand -base64 32)"
# identityKeySecretRef: { name: smo-identity-key, key: identity-key }

# A key pair for the session token instead of the shared GUI_JWT_SECRET (PR-SEC-5; gui-bff/README.md, "Signing keys"):
#   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out private-key.pem
#   kubectl -n smo create secret generic gui-jwt-key --from-file=private-key.pem
# gui:
#   jwtKeySecretRef: { name: gui-jwt-key, key: private-key.pem }
#   env:
#     GUI_JWT_ALGORITHM: ES256

# Signed rApp packages (PR-RAPP-1; call flow 01a, DOC-CF-1.1 review): production accepts only packages signed by a publisher you trust. The chart refuses to
# render this file until you name the ConfigMap of the publishers' public keys (values.yaml, rappSigning), for example in my-values.yaml:
#   rappSigning: { trustStoreConfigMap: rapp-publishers }
# made with `kubectl -n smo create configmap rapp-publishers --from-file=acme.pub`. Never put the samples' DEMO key (samples/demo-signing) in it.
rappSigning:
  requireSigned: true
