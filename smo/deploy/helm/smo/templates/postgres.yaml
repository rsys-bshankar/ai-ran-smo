{{- /*
  Renders the bundled database (`postgres.enabled`, a lab or trial setup: one pod, one volume): a headless Service `postgres`, the StatefulSet
  `postgres`, and with `postgres.tls.enabled` also the ConfigMap `postgres-hba` (hostssl only) and, with `postgres.tls.certManager.enabled`, the
  cert-manager Certificate for the server. Driven by `postgres.*` (image, pullPolicy, storage, storageClassName, resources, tls). The password comes
  from the Secret named by smo.secretName (templates/_helpers.tpl). The pod template's labels are frozen on purpose (see the comment there): a
  changed template restarts the database.
*/ -}}
{{- if .Values.postgres.enabled }}
{{- $labels := include "smo.labels" (dict "root" .) }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
# The bundled database: one pod, one volume. A lab or trial; for production run a managed or HA Postgres (postgres.enabled=false).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "smo.podLabels" (dict "root" $) | nindent 8 }}
        # Frozen at the value release 0.4.0 rendered. A pod label is part of the pod template, and a changed template restarts the database: with the chart's version here every
        # chart release restarted it (found by the upgrade lane under load, V-10: the 401s, 500s and 502s of a database that is gone for a few seconds). Do not change it, and never
        # put the chart version, a checksum or a timestamp in this pod's labels or annotations: only a change that must restart the database may.
        helm.sh/chart: smo-0.4.0
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # `postgres` in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.postgres.pullPolicy }}
          # D8 (plan task S1.10): the TimescaleDB library preloaded (a volume first made by the stock postgres image gets it too) and its telemetry off;
          # the migrate Job creates the extension (SMO_TIMESCALEDB=require). With `postgres.tls.enabled`, the server arguments that switch TLS on and name
          # the certificate, the key and the hba file follow.
          args:
            - -c
            - shared_preload_libraries=timescaledb
            - -c
            - timescaledb.telemetry_level=off
          {{- if .Values.postgres.tls.enabled }}
            # PR-SEC-2.4: TLS from the network only (the hba file below: `hostssl`, plain `host` rejected); the modules verify the certificate (sslmode=verify-full)
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/run/pg-tls/tls.crt
            - -c
            - ssl_key_file=/run/pg-tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - hba_file=/etc/smo/pg_hba.conf
          {{- end }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: smo }
            - { name: POSTGRES_DB, value: smo }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/db_password }
            - { name: NO_TS_TUNE, value: "true" }           # the TimescaleDB image's start-up tuning off: the resources above size the pod, not a guess from the node
            - { name: TIMESCALEDB_TELEMETRY, value: "off" }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "smo"] }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "smo"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql }    # PostgreSQL 18+ keeps its data in a version-named subdirectory here
            - { name: run, mountPath: /var/run/postgresql }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            {{- /* Renders when `postgres.tls.enabled`: the mounts of the certificate Secret and of the hba ConfigMap. */}}
            {{- if .Values.postgres.tls.enabled }}
            - { name: pg-tls, mountPath: /run/pg-tls, readOnly: true }
            - { name: pg-hba, mountPath: /etc/smo, readOnly: true }
            {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ include "smo.secretName" . }}
            defaultMode: 0444
            items:
              - { key: db-password, path: db_password }
        {{- /* Renders when `postgres.tls.enabled`: the volumes behind those mounts. */}}
        {{- if .Values.postgres.tls.enabled }}
        - name: pg-tls
          secret:
            secretName: {{ .Values.postgres.tls.secretName }}
            defaultMode: 0440              # owned by root, readable by the pod's group (fsGroup 70): Postgres accepts a key that root owns with mode 0640 or less
        - name: pg-hba
          configMap:
            name: postgres-hba
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- /* Renders when `postgres.tls.enabled`: the hba ConfigMap, and below it the Certificate when cert-manager makes the server certificate. */}}
{{- if .Values.postgres.tls.enabled }}
---
# PR-SEC-2.4: the same rules as smo/pgtls/pg_hba.conf (docker-compose.pgtls.yml); a test keeps the two equal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/name: postgres
data:
  pg_hba.conf: |
    local   all   all                    trust
    hostssl all   all   all              scram-sha-256
    host    all   all   all              reject
{{- /* Renders when `postgres.tls.certManager.enabled`: a cert-manager Certificate whose Secret is `postgres.tls.secretName`; the render fails without an issuer name. */}}
{{- if .Values.postgres.tls.certManager.enabled }}
{{- $ref := .Values.postgres.tls.certManager.issuerRef }}
{{- if not $ref.name }}{{ fail "postgres.tls.certManager.enabled needs postgres.tls.certManager.issuerRef.name (an Issuer or ClusterIssuer of cert-manager; with mtls.certManager.createCA that is smo-mtls-ca)" }}{{ end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.postgres.tls.secretName }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  commonName: postgres
  secretName: {{ .Values.postgres.tls.secretName }}
  duration: {{ .Values.postgres.tls.certManager.duration }}
  renewBefore: {{ .Values.postgres.tls.certManager.renewBefore }}
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [digital signature, server auth]
  dnsNames:
    - postgres
    - postgres.{{ .Release.Namespace }}.svc
    - postgres.{{ .Release.Namespace }}.svc.cluster.local
    - localhost
  issuerRef:
    {{- toYaml $ref | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
