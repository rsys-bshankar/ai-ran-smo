{{- /*
  One Deployment per enabled module, and its Service (none for a worker) and PersistentVolumeClaim (only for a module with `persistence`), all from this one
  template (PR-OPS-2.2). Driven by `modules` and `moduleDefaults` (kind, port, replicas, database, databaseRole, enrollment, mtls, env, resources,
  persistence, scratch, preStopSeconds) and by image, placement, mtls, postgres.tls, rappSigning, rappCredentials, gui, tracing and ranNfOam.
  What it must keep in step with: docker-compose.yml (each module's image, secrets and environment, checked by tests_integration/test_helm_chart.py) and
  the optional templates that add to a module's pod (mtls.yaml, postgres.yaml, rapp-credentials.yaml). A comment in the YAML below is rendered into the
  manifest; a template comment such as this one is not.
*/}}
{{- if not (has .Values.placement.mode (list "soft" "hard" "off")) }}
{{- fail (printf "placement.mode must be soft, hard or off, not %q" .Values.placement.mode) }}
{{- end }}
{{- range $name, $_ := .Values.modules }}
{{- $m := include "smo.module" (dict "root" $ "name" $name) | fromYaml }}
{{- if $m.enabled }}
{{- $role := include "smo.dbRole" (dict "root" $ "module" $m) }}
{{- $mtls := include "smo.mtlsMode" (dict "root" $ "name" $name "module" $m) }}
{{- if not (has $mtls (list "server" "client" "off")) }}
{{- fail (printf "module %s: mtls must be server, client or off, not %q" $name $mtls) }}
{{- end }}
{{- $labels := include "smo.labels" (dict "root" $) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $m.replicas }}
  {{- end }}
  {{- if $m.persistence }}
  strategy: { type: Recreate }       # a volume that only one pod may hold at a time
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "smo.podLabels" (dict "root" $) | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
      annotations:
        {{- /* a changed secret or value that the pod reads at start rolls the pod */}}
        checksum/config: {{ toYaml $m | sha256sum }}
    spec:
      {{- include "smo.pullSecrets" $ | nindent 6 }}
      securityContext:
        {{- toYaml (default $.Values.podSecurityContext $m.podSecurityContext) | nindent 8 }}
      # no pod here calls the Kubernetes API, so none gets a token; the token's mount point also sits inside /run/secrets, which a read-only root filesystem
      # cannot create
      automountServiceAccountToken: false
      {{- if and (eq $name "rapp-mgmt") (eq $.Values.rappCredentials.delivery "kubernetes") }}
      serviceAccountName: rapp-mgmt       # the one pod with Kubernetes access (rapp-credentials.yaml); its token is projected below, not auto-mounted
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- if ne $.Values.placement.mode "off" }}
      {{- $when := ternary "DoNotSchedule" "ScheduleAnyway" (eq $.Values.placement.mode "hard") }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ $when }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/name: {{ $name }}
        {{- if $.Values.placement.zoneKey }}
        - maxSkew: 1
          topologyKey: {{ $.Values.placement.zoneKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/name: {{ $name }}
        {{- end }}
      {{- end }}
      {{- if $m.database }}
      initContainers:
        # PR-OPS-3.2: a pod of this release does not start on an older schema. It waits for the migration (the Job of migrate.yaml) and, if the
        # schema never arrives, fails and is restarted, so a bad migration shows as a pod stuck here and old pods keep serving.
        - name: wait-for-schema
          image: {{ include "smo.image" (dict "root" $ "name" $m.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "/srv/scripts/migrate.py", "--wait", "{{ $.Values.migrate.schemaWaitSeconds }}"]
          env:
            {{- include "smo.dbEnv" (dict "root" $ "role" $role) | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if eq (include "smo.pgTls" $) "true" }}
            - { name: pg-tls-ca, mountPath: /run/pg-tls, readOnly: true }
            {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "smo.image" (dict "root" $ "name" $m.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if eq $m.kind "worker" }}
          command: ["python", "-m", "smo_shared.worker"]
          {{- else }}
          ports:
            - { name: http, containerPort: {{ $m.port }} }
          {{- end }}
          env:
            {{- if $m.database }}
            {{- include "smo.dbEnv" (dict "root" $ "role" $role) | nindent 12 }}
            {{- end }}
            {{- if $m.enrollment }}
            - { name: SMO_ENROLLMENT_SECRET_FILE, value: /run/secrets/enrollment_secret }
            {{- end }}
            {{- if ne $mtls "off" }}
            # PR-SEC-2: the certificate, key and CA are mounted at /run/mtls (the default of SMO_MTLS_*_FILE)
            - { name: SMO_MTLS, value: "on" }
            {{- if and (eq $mtls "client") (ne $m.kind "worker") }}
            - { name: SMO_MTLS_SERVE, value: "off" }
            {{- end }}
            {{- end }}
            {{- /* PR-OBS-3: an SMO service (not the GUI's nginx or its backend) is told where to send spans, when there is a place */}}
            {{- $otel := default (ternary "http://tempo:4318" "" $.Values.observability.tempo.enabled) $.Values.tracing.endpoint }}
            {{- if and $otel (ne $m.kind "static") }}
            - { name: SMO_OTEL_ENDPOINT, value: {{ $otel | quote }} }
            {{- with $.Values.tracing.sampleRatio }}
            - { name: SMO_OTEL_SAMPLE_RATIO, value: {{ . | toString | quote }} }
            {{- end }}
            {{- end }}
            {{- if eq $name "r1-termination" }}
            {{- with $.Values.ingress.r1.publicBaseUrl }}
            - { name: R1_PUBLIC_BASE_URL, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if and (eq $name "rapp-mgmt") (eq $.Values.rappCredentials.delivery "kubernetes") }}
            - { name: RAPP_CREDENTIAL_DELIVERY, value: kubernetes }
            - { name: RAPP_K8S_TOKEN_FILE, value: /var/run/smo-k8s/token }
            - { name: RAPP_K8S_CA_FILE, value: /var/run/smo-k8s/ca.crt }
            - name: RAPP_K8S_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            {{- end }}
            {{- range $k, $v := $m.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if eq $name "ran-nf-oam" }}
            {{- with $.Values.ranNfOam.vesPasswordSecretRef }}
            {{- if .name }}
            {{- if or (hasKey $m.env "RAN_NF_OAM_VES_PASSWORD") (hasKey $m.env "RAN_NF_OAM_VES_PASSWORD_FILE") }}
            {{- fail "ranNfOam.vesPasswordSecretRef is set and modules.ran-nf-oam.env also sets RAN_NF_OAM_VES_PASSWORD or RAN_NF_OAM_VES_PASSWORD_FILE: the VES listener refuses a password given twice (503); use one" }}
            {{- end }}
            # SB-7.8: the VES listener's password from a Secret of your own, a file mounted at /run/ves (the listener exists only with a password)
            - { name: RAN_NF_OAM_VES_PASSWORD_FILE, value: /run/ves/password }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq $name "onboarding" }}
            {{- if $.Values.rappSigning.trustStoreConfigMap }}
            # PR-RAPP-1: the accepted publishers' public keys, the files of a ConfigMap of your own mounted at /run/rapp-trust (read for each package)
            - { name: ONBOARDING_TRUST_STORE, value: /run/rapp-trust }
            {{- end }}
            {{- if $.Values.rappSigning.requireSigned }}
            - { name: ONBOARDING_REQUIRE_SIGNED_PACKAGES, value: "true" }
            {{- end }}
            {{- end }}
            {{- if eq $name "gui-bff" }}
            {{- range $k, $v := $.Values.gui.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /* SEC-15.11: behind the chart's GUI Ingress two proxies stand in front of the backend (the ingress controller, then the console's nginx), so the client address is the second entry from the right of X-Forwarded-For; without it every client would be one source for the sign-in throttle. An operator's own gui.env value wins. */}}
            {{- if and $.Values.ingress.enabled $.Values.ingress.gui.host (not (hasKey $.Values.gui.env "GUI_TRUSTED_PROXY_HOPS")) }}
            - { name: GUI_TRUSTED_PROXY_HOPS, value: "2" }
            {{- end }}
            {{- with $.Values.gui.oidcClientSecretRef }}
            {{- if .name }}
            # PR-SEC-6: the OIDC client's credential from a Secret of your own, not from values
            - name: GUI_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .name | quote }}, key: {{ .key | default "client-secret" | quote }} } }
            {{- end }}
            {{- end }}
            {{- with $.Values.gui.totpKeySecretRef }}
            {{- if .name }}
            # PR-SEC-7: the key for the one-time-code secrets, from a Secret of your own
            - name: GUI_TOTP_KEY
              valueFrom: { secretKeyRef: { name: {{ .name | quote }}, key: {{ .key | default "totp-key" | quote }} } }
            {{- end }}
            {{- end }}
            {{- with $.Values.gui.jwtKeySecretRef }}
            {{- if .name }}
            # PR-SEC-5: the session token's private key, a file of a Secret of your own mounted at /run/gui-jwt
            - { name: GUI_JWT_PRIVATE_KEY_FILE, value: {{ printf "/run/gui-jwt/%s" (.key | default "private-key.pem") | quote }} }
            {{- end }}
            {{- end }}
            {{- end }}
          {{- /* the probes follow `kind`: a service answers /live and /ready (with mTLS in server mode they run inside the container, with the module's own certificate), a worker touches a heartbeat file and has no port, a static module (the GUI) gets a TCP check */}}
          {{- if eq $m.kind "service" }}
          {{- if $m.preStopSeconds }}
          # PR-HA-2: stay up for a few seconds after the pod is marked terminating, so the Service and the other pods stop sending to it
          # before the server is told to stop (the endpoint update and SIGTERM race otherwise, and a request lands on a closing pod)
          lifecycle:
            preStop:
              exec: { command: ["sleep", {{ $m.preStopSeconds | quote }}] }
          {{- end }}
          {{- if eq $mtls "server" }}
          # PR-SEC-2: the server refuses a client without a certificate, and the kubelet's httpGet presents none: the probe runs in the container and presents
          # the module's own (`python -m smo_shared.mtls probe PATH PORT`)
          startupProbe:
            exec: { command: ["python", "-m", "smo_shared.mtls", "probe", "/live", {{ $m.port | quote }}] }
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 40
          readinessProbe:
            exec: { command: ["python", "-m", "smo_shared.mtls", "probe", "/ready", {{ $m.port | quote }}] }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["python", "-m", "smo_shared.mtls", "probe", "/live", {{ $m.port | quote }}] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- else }}
          startupProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          {{- else if eq $m.kind "worker" }}
          # no port: the worker touches a file on every tick, and is unhealthy when it is a minute old (docker-compose.yml's x-worker-probe)
          startupProbe:
            exec: &heartbeat
              command: ["python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: *heartbeat
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          {{- else }}
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if or $m.database $m.enrollment }}
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            {{- end }}
            {{- if ne $mtls "off" }}
            - { name: mtls, mountPath: /run/mtls, readOnly: true }
            {{- end }}
            {{- if and $m.database (eq (include "smo.pgTls" $) "true") }}
            - { name: pg-tls-ca, mountPath: /run/pg-tls, readOnly: true }
            {{- end }}
            {{- if and (eq $name "rapp-mgmt") (eq $.Values.rappCredentials.delivery "kubernetes") }}
            - { name: k8s-access, mountPath: /var/run/smo-k8s, readOnly: true }
            {{- end }}
            {{- if and (eq $name "gui-bff") $.Values.gui.jwtKeySecretRef.name }}
            - { name: gui-jwt, mountPath: /run/gui-jwt, readOnly: true }
            {{- end }}
            {{- if and (eq $name "onboarding") $.Values.rappSigning.trustStoreConfigMap }}
            - { name: rapp-trust, mountPath: /run/rapp-trust, readOnly: true }
            {{- end }}
            {{- if and (eq $name "ran-nf-oam") $.Values.ranNfOam.vesPasswordSecretRef.name }}
            - { name: ves-password, mountPath: /run/ves, readOnly: true }
            {{- end }}
            {{- if $m.persistence }}
            - { name: data, mountPath: {{ $m.persistence.mountPath }} }
            {{- end }}
            {{- if $m.scratch }}
            - { name: scratch, mountPath: {{ $m.scratch }} }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { medium: Memory }
        {{- if or $m.database $m.enrollment }}
        - name: secrets
          projected:
            defaultMode: 0444
            sources:
              # only what the module needs: an rApp must never be able to read the enrollment secret (PR-SEC-14), and a module with a role of its own does not hold the owner's password (PR-DB-2.6)
              {{- if or (and $m.database (not $role)) $m.enrollment }}
              - secret:
                  name: {{ include "smo.secretName" $ }}
                  items:
                    {{- if and $m.database (not $role) }}
                    - { key: db-password, path: db_password }
                    {{- end }}
                    {{- if $m.enrollment }}
                    - { key: enrollment-secret, path: enrollment_secret }
                    {{- end }}
              {{- end }}
              {{- if $role }}
              - secret:
                  name: {{ include "smo.roleSecretName" $ }}
                  items:
                    - { key: {{ printf "db-password-%s" $role }}, path: {{ printf "db_password_%s" $role }} }
              {{- end }}
        {{- end }}
        {{- if and $m.database (eq (include "smo.pgTls" $) "true") }}
        # PR-SEC-2.4: only the CA certificate out of the bundled Postgres's Secret, never its key
        - name: pg-tls-ca
          secret:
            secretName: {{ $.Values.postgres.tls.secretName }}
            defaultMode: 0444
            items:
              - { key: ca.crt, path: ca.crt }
        {{- end }}
        {{- if ne $mtls "off" }}
        - name: mtls
          secret:
            secretName: {{ include "smo.mtlsSecretName" (dict "root" $ "name" $name) }}
            defaultMode: 0440              # readable by the pod's group (fsGroup), not by the world
        {{- end }}
        {{- if and (eq $name "rapp-mgmt") (eq $.Values.rappCredentials.delivery "kubernetes") }}
        - name: k8s-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
        {{- end }}
        {{- if and (eq $name "gui-bff") $.Values.gui.jwtKeySecretRef.name }}
        - name: gui-jwt
          secret:
            secretName: {{ $.Values.gui.jwtKeySecretRef.name | quote }}
            defaultMode: 0440              # readable by the pod's group (fsGroup), not by the world
        {{- end }}
        {{- if and (eq $name "ran-nf-oam") $.Values.ranNfOam.vesPasswordSecretRef.name }}
        - name: ves-password
          secret:
            secretName: {{ $.Values.ranNfOam.vesPasswordSecretRef.name | quote }}
            defaultMode: 0440              # readable by the pod's group (fsGroup), not by the world
            items:
              - { key: {{ $.Values.ranNfOam.vesPasswordSecretRef.key | default "ves-password" | quote }}, path: password }      # only this key, not the whole Secret
        {{- end }}
        {{- if and (eq $name "onboarding") $.Values.rappSigning.trustStoreConfigMap }}
        - name: rapp-trust
          configMap:
            name: {{ $.Values.rappSigning.trustStoreConfigMap | quote }}
            defaultMode: 0444              # public keys
        {{- end }}
        {{- if $m.persistence }}
        - name: data
          {{- if $.Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ $name }}-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if $m.scratch }}
        - name: scratch
          emptyDir: {}
        {{- end }}
{{- /* the claim of a module with `persistence` (its Deployment is Recreate, so one pod holds the volume); with persistence.enabled off the pod gets an emptyDir instead and no claim is made */}}
{{- if and $m.persistence $.Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- $labels | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $.Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $m.persistence.size }}
{{- end }}
{{- /* a worker has no port, so no Service */}}
{{- if ne $m.kind "worker" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    - { name: http, port: {{ $m.port }}, targetPort: http }
{{- end }}
{{- end }}
{{- end }}
