# AI-RAN SMO. Install into a namespace of its own: the services are named as in docker-compose.yml (`sme`, `dme`, `postgres`, ...), because that is
# what the modules and the GUI's nginx address each other by, so one release per namespace.
#
#   helm install smo deploy/helm/smo -n smo --create-namespace
#
# By default this brings its own Postgres and generates its own secrets. To use a Postgres you run, set postgres.enabled=false and postgres.external.*,
# and create the password Secret yourself (secrets.existingSecret). See deploy/helm/smo/README.md.

# Where the SMO images are pulled from: <registry>/<prefix><name>:<tag>. `<name>` is a module's `image` below, and the names are the ones scripts/release_images.py
# publishes (tests_integration/test_helm_chart.py checks that). The database image is set under `postgres` and is not affected by pullPolicy.
image:
  registry: ghcr.io/rsys-bshankar/ai-ran-smo   # <registry>/<prefix><name>:<tag>, as the release workflow publishes them
  prefix: smo-
  tag: ""                                      # empty: the chart's appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []                              # names of image pull Secrets, if the registry is private

# The database. Bundled: one Postgres pod (a StatefulSet with a volume), for a lab or a trial. For production run a managed or HA Postgres
# and point the chart at it: postgres.enabled=false and postgres.external.
postgres:
  enabled: true
  image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  pullPolicy: IfNotPresent                     # its own: image.pullPolicy is for the SMO images (CI sets it to Never for the ones it built)
  storage: 10Gi
  storageClassName: ""
  resources:                                   # 150 MiB and 36 % of a core at its peak under the load of docs/SIZING.md (10 000 managed elements); values-sized.yaml asks for 250m
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # PR-SEC-2.4: TLS for the bundled Postgres (postgres.enabled), off by default. On, Postgres serves TLS only (ssl=on, pg_hba `hostssl`; a plain connection is rejected) with the
  # certificate in the Secret `secretName` (keys tls.crt, tls.key, ca.crt: what cert-manager writes), and every module and the migrate Job connect with sslmode=verify-full
  # against that Secret's ca.crt (mounted at /run/pg-tls) and the name `postgres`: a wrong CA, or a certificate without that name, stops the connection. The certificate must
  # name postgres, postgres.<namespace>.svc and postgres.<namespace>.svc.cluster.local. certManager.enabled makes the Certificate from the Issuer or ClusterIssuer in
  # issuerRef (with mtls.certManager.createCA that is `smo-mtls-ca`), else you create the Secret. For a NEW install: switching it on in a running release makes the pre-upgrade
  # migrate Job connect with verify-full to a Postgres that still serves plain, so the upgrade stops there (old pods keep serving); README, "Postgres over TLS".
  # An external Postgres is not touched by this: its own `external.sslmode` below.
  tls:
    enabled: false
    secretName: postgres-tls
    certManager:
      enabled: false
      issuerRef: { name: "", kind: Issuer, group: cert-manager.io }
      duration: 2160h              # 90 days
      renewBefore: 720h            # 30 days
  external:
    host: ""
    port: 5432
    database: smo
    user: smo
    sslmode: prefer                            # disable | prefer | require | verify-full
    # Several hosts, comma separated (and a port for each, or one for all), are tried in order; with targetSessionAttrs: read-write the one that
    # accepts writes is used, so a new primary is found after a failover without a change here. A service that always points at the primary
    # (CloudNativePG's <cluster>-rw, Patroni's leader service) needs neither.
    targetSessionAttrs: ""                     # "" | read-write | any | primary | prefer-standby
  # Disaster recovery (PR-HA-6.2, docs/DISASTER_RECOVERY.md), opt in. With a CloudNativePG cluster behind postgres.external, the Cluster's
  # spec.backup.barmanObjectStore archives the WAL to an S3-compatible bucket continuously (ci/cnpg-cluster-backup.yaml); this renders the
  # ScheduledBackup that takes the base backups the WAL is replayed on. The Cluster is not made by this chart, so `cluster` names it.
  cnpgBackup:
    enabled: false
    cluster: ""                                # the CloudNativePG Cluster to back up, e.g. smo-pg
    schedule: "0 0 2 * * *"                    # six fields, seconds first (CloudNativePG's cron): daily at 02:00 UTC
    immediate: true                            # also take one backup as soon as the object exists

# The two secrets every install needs: the database password and the enrollment secret (what makes a module an SMO module at SME, PR-SEC-14).
# By default the chart makes them (random, kept across upgrades). To bring your own, create a Secret with the keys `db-password` and
# `enrollment-secret` and name it here: the chart then never touches them.
secrets:
  existingSecret: ""

# Per-module database roles (PR-DB-2.6). A module that names a `databaseRole` below connects as `smo_<role>`, which can use its schema and the shared
# tables it is given, and nothing else, instead of as the owner. The chart makes one password per role (random, kept across upgrades) in the Secret
# `smo-role-secrets` and the migrate Job runs scripts/db_roles.py to make the roles. With `enabled: false` every module connects as the owner.
# To bring your own passwords, create a Secret with a key `db-password-<role>` for each role and name it in `existingSecret`. The bundled Postgres
# lets the owner create roles; an external one needs an owner with CREATEROLE, or the roles made by hand (the SQL is in scripts/db_roles.py).
databaseRoles:
  enabled: true
  existingSecret: ""

# PR-SEC-9.2: a NetworkPolicy on R1 Termination's port. Off by default (it needs a CNI that enforces policy, and it denies whatever it does not list).
# A NetworkPolicy works per pod and port, not per URL path, so it cannot single out /bootstrap: enabled, ONLY the pods of this release and `allowedSources`
# may reach the gateway at all. Put in `allowedSources` whoever else must call it: the rApps (their namespace and pod labels), the ingress controller's
# namespace, a Prometheus. Entries are NetworkPolicyPeers, for example
#   allowedSources:
#     - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: rapps } }
#     - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
bootstrapNetworkPolicy:
  enabled: false
  allowedSources: []

# Egress policy for rApp pods (PR-RAPP-2.3): a rApp may reach R1 Termination and nothing else. Off by default, so an upgrade changes nothing; needs a CNI that
# enforces NetworkPolicy (with none the objects are accepted and do nothing). Egress only: who may reach a rApp is not touched. Selects the reference rApps of this
# release (the modules with SMO_IDENTITY_KIND: rapp) without adding a pod label. The rules: R1 Termination's port; DNS; the bundled Postgres (the reference rApps keep
# their own tables; `database: false` for a workload that does not; with an external database add its address to `extraEgress`); the bundled Tempo when traces go
# there; and `extraEgress` (NetworkPolicy egress rules, verbatim). `extraPodSelectors`: label selectors of rApp workloads of your own in this namespace, one policy each
#   extraPodSelectors: [{matchLabels: {app: my-rapp}}]
#   extraEgress: [{to: [{ipBlock: {cidr: 10.20.0.0/24}}], ports: [{protocol: TCP, port: 5432}]}]
rappNetworkPolicy:
  enabled: false
  dns: true
  dnsTo:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      podSelector: { matchLabels: { k8s-app: kube-dns } }
  database: true
  extraPodSelectors: []
  extraEgress: []

# Signed rApp packages (PR-RAPP-1). Off by default: Onboarding checks no signature, as before.
#   trustStoreConfigMap  the name of a ConfigMap of your own whose keys are `<publisher>.pub` (a PEM ed25519 public key each; the file name is the publisher's name).
#                        Mounted read-only at /run/rapp-trust in the onboarding pod and named by ONBOARDING_TRUST_STORE. With it set, a package that carries a signature
#                        must verify against these keys, or it is refused (tampered, added or removed file, unknown publisher, wrong key). The keys are read for each
#                        package, so changing the ConfigMap needs no restart (the mounted files follow it within about a minute).
#   requireSigned        true: a package without a signature from one of those keys is refused too (ONBOARDING_REQUIRE_SIGNED_PACKAGES). Needs trustStoreConfigMap
#                        (without it every package is refused, with a message that says so).
# Make the ConfigMap with `kubectl -n smo create configmap rapp-publishers --from-file=acme.pub`. The sample packages are signed with a DEMO key whose private half is
# public (samples/demo-signing): never put that key in the trust store of a deployment that matters.
rappSigning:
  trustStoreConfigMap: ""
  requireSigned: false

# SEC-15.18: the key that encrypts the SME identities (invoker secrets) of the modules and of the rApp instances in the shared module_identity table, from a Secret of your own
# ({name: smo-identity-key, key: identity-key}; `openssl rand -base64 32`). The chart passes it as SMO_IDENTITY_KEY to every module that has a database: all replicas get the same
# key. Empty (the default): the identities are stored as before. After setting it, run `python -m smo_shared.module_identity encrypt-existing` in one pod (deploy/helm/smo/README.md).
# To rotate, make the new key `key` and name the old one in `previousKey` (a key of the same Secret), roll the modules, run the command again, then remove `previousKey`.
identityKeySecretRef: {}

# The GUI backend's own settings, passed through as environment (GUI_JWT_SECRET, GUI_ADMIN_PASSWORD, ...). Empty values are generated by the backend
# on first start (the initial admin password is written to /data/initial-admin-password in its pod).
gui:
  # The GUI backend's settings (docs/CONFIGURATION.md, GUI_*). OIDC login (PR-SEC-6) is `GUI_OIDC_ENABLED: "true"` with the issuer, client id,
  # redirect URI and group map here; the client's credential is better kept in a Secret you make: oidcClientSecretRef.
  env: {}
  oidcClientSecretRef: {}      # {name: my-oidc-secret, key: client-secret}
  # PR-SEC-7: the key that encrypts the one-time-code secrets of local accounts, from a Secret of your own ({name: my-totp-key, key: totp-key}); the chart passes it
  # as GUI_TOTP_KEY. With it set, accounts can enrol a one-time code. GUI_LOGIN_MODE (both|oidc|local) and GUI_ADMIN_MFA_REQUIRED go in `env`.
  totpKeySecretRef: {}
  # PR-SEC-5: the private key (PEM) that signs the session token under GUI_JWT_ALGORITHM RS256 or ES256, from a Secret of your own ({name: gui-jwt-key, key: private-key.pem}).
  # The chart mounts the whole Secret read-only at /run/gui-jwt and sets GUI_JWT_PRIVATE_KEY_FILE to the named key; put the public keys of earlier rotations in the same Secret
  # (public-previous-1.pem, ...) and name them in `env` as GUI_JWT_PREVIOUS_KEY_FILES: /run/gui-jwt/public-previous-1.pem. GUI_JWT_ALGORITHM goes in `env`.
  jwtKeySecretRef: {}

# RAN NF OAM's own settings that need a Secret (SB-7.8). Everything else of the module goes in modules.ran-nf-oam.env.
#   vesPasswordSecretRef  the password of the VES event listener (POST /ves/eventListener/v7), from a Secret of your own ({name: ves-listener, key: ves-password}; the key
#                         defaults to ves-password). Only that key is mounted, read-only, at /run/ves/password and named by RAN_NF_OAM_VES_PASSWORD_FILE, so the password
#                         is not an environment value that anyone who can read the Deployment sees. The listener exists only with a password (it answers 404 without one),
#                         so setting this turns the listener ON; empty (the default) changes nothing. The user name stays in `modules.ran-nf-oam.env`
#                         (RAN_NF_OAM_VES_USERNAME, default ves). Setting this and RAN_NF_OAM_VES_PASSWORD(_FILE) in env fails the render (a password given twice is a 503).
ranNfOam:
  vesPasswordSecretRef: {}

# Where each module keeps files (Onboarding's packages, the GUI backend's database). With persistence off they are emptyDirs and are lost
# when the pod goes.
persistence:
  enabled: true
  storageClassName: ""

# Ingress objects for the operator GUI and for the R1 gateway, each rendered only when its host is set; off by default (templates/ingress.yaml).
ingress:
  enabled: false
  className: ""
  annotations: {}
  gui:                                         # the operator GUI
    host: ""
    tlsSecretName: ""                          # empty: no TLS section
  r1:                                          # R1 Termination, the gateway rApps call
    host: ""
    tlsSecretName: ""
    publicBaseUrl: ""                          # what /bootstrap advertises, e.g. https://r1.example.com (R1_PUBLIC_BASE_URL); empty: the in-cluster address
    # PR-SEC-9.2, ingress-nginx only: when non-empty (CIDRs, e.g. ["10.0.0.0/8"]) and `host` is set, a second Ingress takes the exact path /bootstrap and
    # carries `nginx.ingress.kubernetes.io/whitelist-source-range`, so only those sources reach /bootstrap through the ingress (every other path is unchanged).
    # The path is the one thing the ingress can tell apart; a NetworkPolicy cannot (bootstrapNetworkPolicy below). Empty: /bootstrap is as open as the rest.
    bootstrapAllowedSourceRanges: []

# How an rApp instance's credentials reach its workload (PR-SEC-14). `none`: rApp Management does not deliver them; an operator fetches them once from
# POST /instances/{id}/credentials. `kubernetes`: rApp Management writes them to a Secret `rapp-<instanceId>-credentials` in this namespace (the workload
# takes it with envFrom), replaces it on rotation and deletes it on terminate; nobody sees the secret. This gives the rApp Management pod (only) a service
# account whose Role can create, update and delete Secrets in this namespace, and read none.
rappCredentials:
  delivery: none

# Where the replicas of a module land (PR-HA-5). Every module's pods are spread over nodes, so one node lost takes at most its share of a module.
#   soft  prefer different nodes (topology spread, maxSkew 1, ScheduleAnyway): pods still start when there are fewer nodes than replicas (a one-node cluster, kind)
#   hard  require them (DoNotSchedule): a replica that cannot go on another node stays Pending
#   off   no constraint
# `zoneKey` adds the same rule over zones (topology.kubernetes.io/zone) when set; a cluster without that label ignores a soft one.
placement:
  mode: soft
  zoneKey: ""

# PR-SEC-2: mutual TLS between the services. Off by default: nothing below changes while `enabled` is false. When true every `service` module serves HTTPS
# on its port and refuses a client without a certificate from the CA, and every call between modules presents the module's own certificate and verifies the
# CA (smo_shared/mtls.py). Each module mounts the Secret `<module><secretSuffix>` (keys tls.crt, tls.key, ca.crt: what cert-manager writes) at /run/mtls.
# The probes of such a module become `python -m smo_shared.mtls probe` (an exec probe: the kubelet's httpGet cannot present a certificate). Not part of it:
# `mock-o1-adaptor` (a stand-in for a network function, plain HTTP: `mtls: "off"`), `gui` (nginx) and the GUI backend (`mtls: client`: it calls R1 with a
# certificate and serves the GUI's nginx plain HTTP). Postgres TLS is separate: `postgres.tls` for the bundled one, `postgres.external.sslmode: verify-full` for your own (PR-SEC-2.4).
#   certManager.enabled: true   the chart makes the Certificates (and, with createCA, a self-signed CA chain: Issuer -> CA Certificate -> CA Issuer);
#                               needs cert-manager's CRDs. With createCA: false, name your own Issuer or ClusterIssuer in issuerRef.
#   certManager.enabled: false  you create the Secrets, one per module (names: `<module><secretSuffix>`), from your own CA or from scripts/mtls_certs.py
#                               (deploy/helm/smo/README.md, "Mutual TLS between the services"). A module whose Secret is missing does not start.
# ingress.r1 reaches the gateway over HTTPS then: `ingressClientSecret` ("<namespace>/<name>" of a kubernetes.io/tls Secret with a client certificate and ca.crt)
# adds the ingress-nginx annotations backend-protocol HTTPS and proxy-ssl-secret / proxy-ssl-verify; empty: the ingress is left as it is (and cannot reach the gateway).
mtls:
  enabled: false
  secretSuffix: "-mtls"
  ingressClientSecret: ""
  certManager:
    enabled: false
    createCA: true
    issuerRef: { name: "", kind: Issuer, group: cert-manager.io }
    duration: 2160h              # 90 days
    renewBefore: 720h            # 30 days
    caDuration: 87600h           # 10 years (createCA only)

# Per-module PodDisruptionBudget and HorizontalPodAutoscaler templates, off until a module runs more than one replica (PR-HA).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
autoscaling:           # a HorizontalPodAutoscaler for every service module that has no volume; `replicas` is then left to it (templates/pdb-hpa.yaml)
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Distributed traces (PR-OBS-3). `endpoint` is the OTLP/HTTP base URL of a collector or of Tempo (SMO_OTEL_ENDPOINT, every module); empty turns spans off,
# and the services still pass a W3C `traceparent` on. Spans need images built with the OpenTelemetry packages (docker build --build-arg WITH_TRACING=1);
# without them the services log one warning and propagate only. With observability.tempo.enabled and no endpoint, it is the bundled Tempo's.
tracing:
  endpoint: ""
  sampleRatio: ""                              # SMO_OTEL_SAMPLE_RATIO for new traces, 0 to 1; empty: every trace

# Traces and logs, a lab or trial stack (PR-OBS-3, PR-OBS-6; docs/OBSERVABILITY.md): Tempo (traces), Loki (logs), Fluent Bit (a DaemonSet that ships this
# release's pod logs to Loki) and Grafana (with both as provisioned data sources, linked on the trace id). All four are off by default. They keep their data
# on an emptyDir, so a restarted pod starts empty; for production use your own Tempo, Loki and Grafana (tracing.endpoint) and ship the logs your way.
# The Services are named `tempo`, `loki` and `grafana`. Fluent Bit reads the node's container logs (a hostPath), so its pods run as root.
observability:
  tempo:
    enabled: false
    image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  loki:
    enabled: false
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  fluentBit:
    enabled: false                             # needs loki.enabled (or a Loki at the Service name `loki`)
    image: fluent/fluent-bit:5.1.3@sha256:c5542543523c9678398dd78d927c05e8425ec15b038f226b67b3b019b1a70845
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
  grafana:
    enabled: false
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
# The alert and SLO burn-rate rules (PR-OBS-5, files/smo-alerts.rules.yaml) as a PrometheusRule of the Prometheus Operator. Off by default: it needs that CRD, and
# the rules assume each module is scraped as a job named after it. `labels` is what your Prometheus's ruleSelector matches (for example `release: kube-prometheus-stack`).
prometheusRule:
  enabled: false
  namespace: ""          # empty: the release's namespace
  labels: {}

# Brings the database to this release's schema (PR-OPS-3): a Job that runs on install and, as a pre-upgrade hook, before any pod of a new version
# starts. Every module waits for the schema in an init container (it never serves on an older one).
migrate:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  schemaWaitSeconds: 600                       # how long a starting pod waits for the schema before it fails and is restarted

# Every pod: no capability, no privilege escalation, a read-only root filesystem (PR-SEC-13), the unprivileged user the images run as.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001                     # the volumes (Onboarding's packages, the GUI backend's /data) are made writable for this group
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

# What every module starts from; a module below overrides what it names.
moduleDefaults:
  enabled: true
  kind: service              # service: an HTTP server on port 8000 with /live and /ready; worker: no port, a heartbeat file; static: plain TCP probe
  port: 8000
  replicas: 1
  preStopSeconds: 5          # service kind: wait this long before SIGTERM so traffic has moved away (0 turns it off); must stay under terminationGracePeriodSeconds less the server's own drain (20)
  database: true             # gets the database URL and password
  databaseRole: ""            # connects as smo_<this> with its own password instead of as the owner (databaseRoles above); a schema of its own must exist
  enrollment: true           # presents the enrollment secret to SME, so it is recorded as an SMO module
  mtls: server               # with mtls.enabled: server (serves mTLS and calls with a certificate), client (calls with one, serves plain HTTP), off (not part of it)
  env: {}
  podSecurityContext: null   # replaces the pod-wide one for this module
  persistence: null          # {mountPath: /srv/packages, size: 5Gi}
  scratch: null              # an emptyDir at this path, for files copied in
  resources:                 # measured (docs/SIZING.md): a module's peak is 75 to 135 MiB, nearly idle in CPU; the modules that need more set their own below
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# The modules. `image` is the image name after the prefix (smo-<image>); the services are named by the key. An entry sets only what differs from moduleDefaults
# above; a worker entry is the same image as its service started with `kind: worker`. tests_integration/test_helm_chart.py checks that this list, each module's
# image, secrets and environment agree with docker-compose.yml, so a service added to one is added to the other.
modules:
  r1-termination: { image: r1-termination, databaseRole: r1-termination, enrollment: false, scratch: /srv/scratch, env: { R1_KILL_SWITCH_SCHEMA: ran_nf_oam, R1_RATE_STORE: memory, R1_INTROSPECTION_CACHE_SECONDS: "30", R1_INTROSPECTION_CACHE_MAX_ENTRIES: "10000" }, resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 512Mi } } }   # CPU-bound at about one core per 39 requests/s: values-sized.yaml asks for 500m, scale by replicas (docs/SIZING.md)
  sme: { image: sme, databaseRole: sme, resources: { requests: { cpu: 50m, memory: 480Mi }, limits: { memory: 768Mi } } }   # the largest module: 361 MiB at its peak (docs/SIZING.md); values-sized.yaml asks for 250m
  dme: { image: dme, databaseRole: dme }
  onboarding: { image: onboarding, databaseRole: onboarding, persistence: { mountPath: /srv/packages, size: 5Gi } }
  rapp-mgmt: { image: rapp-mgmt, databaseRole: rapp-mgmt, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the same image as a worker: rotates the secret of running rApp instances older than RAPP_MGMT_SECRET_ROTATION_DAYS (SEC-15.19; 0 = never, the default: the worker then does nothing)
  rapp-mgmt-worker: { image: rapp-mgmt, databaseRole: rapp-mgmt, kind: worker, env: { R1_GATEWAY_URL: "http://r1-termination:8000", RAPP_MGMT_SECRET_ROTATION_DAYS: "0", RAPP_MGMT_SECRET_ROTATION_MAX_PER_RUN: "10", RAPP_MGMT_SECRET_ROTATION_SWEEP_SECONDS: "900" } }
  ran-nf-oam: { image: ran-nf-oam, databaseRole: ran-nf-oam, env: { R1_GATEWAY_URL: "http://r1-termination:8000", SAFEGUARD_REFUSAL_RETENTION_DAYS: "0" } }
  # the same image as a worker: the periodic work of RAN NF OAM (PR-MSG-4). Run more than one if you like.
  ran-nf-oam-worker: { image: ran-nf-oam, databaseRole: ran-nf-oam, kind: worker, env: { R1_GATEWAY_URL: "http://r1-termination:8000", SAFEGUARD_REFUSAL_RETENTION_DAYS: "0", SMO_RETENTION_ALARMS_DAYS: "0", SMO_RETENTION_PM_FILES_DAYS: "0", SMO_RETENTION_APPROVALS_DAYS: "0", SMO_RETENTION_DECISION_RECORDS_DAYS: "0" } }   # retention: days to keep, 0 = forever; the periods proposed for production are in values-production.yaml (docs/RETENTION.md)
  mock-o1-adaptor: { image: mock-o1-adaptor, database: false, enrollment: false, mtls: "off", env: { MOCK_O1_OAM_URL: "http://ran-nf-oam:8000", MOCK_O1_SELF_URL: "http://mock-o1-adaptor:8000", MOCK_O1_HEARTBEAT_SECONDS: "30" } }
  nfo: { image: nfo, databaseRole: nfo, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  focom: { image: focom, databaseRole: focom }
  mlmr: { image: mlmr, databaseRole: mlmr }
  aimgf: { image: aimgf, databaseRole: aimgf, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the same image as a worker: fails the training, validation, emulation and inference runs past their deadline, so a run nobody reads still times out (call flow 27e)
  aimgf-worker: { image: aimgf, databaseRole: aimgf, kind: worker, env: { R1_GATEWAY_URL: "http://r1-termination:8000", AIMGF_TIMEOUT_SWEEP_SECONDS: "60" } }
  mllf: { image: mllf, database: false, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  ran-analytics: { image: ran-analytics, databaseRole: ran-analytics, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  mdaf: { image: mdaf, databaseRole: mdaf }
  # the same image as a worker: purges MDAF reports older than SMO_RETENTION_MDAF_REPORTS_DAYS (PR-DB-3)
  mdaf-worker: { image: mdaf, databaseRole: mdaf, kind: worker, env: { SMO_RETENTION_MDAF_REPORTS_DAYS: "0" } }
  intent-service: { image: intent-service, databaseRole: intent-service }
  so-smos: { image: so-smos, databaseRole: so-smos, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  sa-smos: { image: sa-smos, databaseRole: sa-smos, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the reference rApps: SME records them as rApps (no enrollment secret), and R1 applies the rApp role to them
  energy-saving-rapp: { image: energy-saving-rapp, databaseRole: energy-saving-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  mobility-optimization-rapp: { image: mobility-optimization-rapp, databaseRole: mobility-optimization-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  coverage-optimization-rapp: { image: coverage-optimization-rapp, databaseRole: coverage-optimization-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  traffic-steering-rapp: { image: traffic-steering-rapp, databaseRole: traffic-steering-rapp, enrollment: false, env: { SMO_IDENTITY_KIND: rapp, R1_GATEWAY_URL: "http://r1-termination:8000" } }
  # the GUI: its backend (one replica: it keeps its users in a SQLite file on a volume) and the nginx that serves the SPA
  gui-bff:
    image: gui-bff
    kind: static
    database: false
    mtls: client
    persistence: { mountPath: /data, size: 1Gi }
    env:
      R1_URL: "http://r1-termination:8000"
      GUI_DATABASE_URL: "sqlite:////data/gui-bff.db"
      GUI_INITIAL_PASSWORD_FILE: "/data/initial-admin-password"
  # nginx runs as the image's own user (101), so the pod does not force the SMO images' uid
  gui: { image: gui, kind: static, port: 8080, database: false, enrollment: false, mtls: "off", podSecurityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } } }
