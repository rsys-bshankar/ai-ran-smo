---
# Optional, only with mtls.certManager.enabled=false: one Secret per module, named <module><mtls.secretSuffix>, with the keys cert-manager would write.
# This is the one for r1-termination; repeat it for every module of values.yaml `modules` (the test checks this one's name and keys).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r1-termination-mtls
  namespace: smo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: smo-vault
  target:
    name: r1-termination-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: { key: smo/mtls/r1-termination, property: tls.crt }
    - secretKey: tls.key
      remoteRef: { key: smo/mtls/r1-termination, property: tls.key }
    - secretKey: ca.crt
      remoteRef: { key: smo/mtls/r1-termination, property: ca.crt }
