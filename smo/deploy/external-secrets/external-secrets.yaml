# ExternalSecrets that make every Secret the SMO Helm chart reads, from Vault paths (KV v2, mount `secret`).
# EXAMPLE ONLY: it has NOT been applied to a cluster (README.md). The paths are placeholders; no value is in this file.
# tests_integration/test_external_secrets_example.py checks every Secret name and key below against the chart.
# Namespace `smo` is the chart's namespace (deploy/gitops/base). Create the Vault entries first (README.md).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smo-secrets
  namespace: smo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: smo-vault
  target:
    name: smo-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: smo/database
        property: owner-password
    - secretKey: enrollment-secret
      remoteRef:
        key: smo/enrollment
        property: secret
---
