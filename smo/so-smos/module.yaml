# so-smos: what this module is to the rest of the SMO (scripts/modules.py; the schema is scripts/module.schema.json). Edit this file, then run
# `python scripts/modules.py --write` from smo/: it regenerates the shared files that list modules, and CI runs `--check`.
name: so-smos
lane: so-smos
r1:
  - {prefix: /so-smos, env: SO_SMOS_URL, url: "http://so-smos:8000"}
database:
  role: {schema: so_smos, shared: [module_identity]}
  tables: [service_order]
openapi: true
tests: {source: app, pythonpath: ".:../shared", floor: 100}
mutation: null
code_docs: true
config_reference: false
compose:
  services: |
    so-smos:
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: so-smos, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      stop_grace_period: 30s
      secrets: [db_password_so-smos, enrollment_secret]
      <<: *hardening
      healthcheck: *ready_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
        SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_so_smos@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_so-smos
        R1_GATEWAY_URL: http://r1-termination:8000
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway
  secrets: |
    db_password_so-smos:
      file: ./secrets/db_password_so-smos
helm: |
  so-smos: { image: so-smos, databaseRole: so-smos, env: { R1_GATEWAY_URL: "http://r1-termination:8000" } }
