[project]
name = "smo-shared"
version = "0.1.0"
description = "Shared library for the AI-RAN SMO Phase 1 reference implementation"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# Distributed traces (smo_shared/tracing.py): without these only W3C traceparent propagation runs. Pinned and hashed in requirements/tracing.txt.
tracing = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
# The event-bus relay to Kafka (smo_shared/kafka_relay.py, ADR 0006 slice 1, D9): imported only when SMO_KAFKA_RELAY is on. Pinned and hashed in
# requirements/kafka.txt; images get it with --build-arg WITH_KAFKA=1.
kafka = [
    "confluent-kafka>=2.16,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smo_shared*"]

[tool.mutmut]
source_paths = ["smo_shared"]
only_mutate = ["smo_shared/pagination.py", "smo_shared/ratelimit.py", "smo_shared/timeutil.py", "smo_shared/roles.py",
               "smo_shared/webhook.py", "smo_shared/killswitch.py", "smo_shared/invoker.py", "smo_shared/bodylimit.py", "smo_shared/secretfile.py", "smo_shared/versioning.py", "smo_shared/identity.py", "smo_shared/correlation.py",
               "smo_shared/audit.py", "smo_shared/idempotency.py", "smo_shared/security_headers.py", "smo_shared/errors.py", "smo_shared/scope.py",
               "smo_shared/mns/dn.py", "smo_shared/mns/errors.py", "smo_shared/mns/patch.py", "smo_shared/mns/scope.py", "smo_shared/mns/registry.py",
               "smo_shared/mns/service.py", "smo_shared/mns/router.py"]
pytest_add_cli_args_test_selection = ["tests/", "../../r1-termination/tests/test_roles.py", "../../r1-termination/tests/test_scope.py"]
