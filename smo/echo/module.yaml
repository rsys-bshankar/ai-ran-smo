# echo: what this module is to the rest of the SMO (scripts/modules.py; the schema is scripts/module.schema.json). Edit this file, then run
# `python scripts/modules.py --write` from smo/: it regenerates the shared files that list modules, and CI runs `--check`.
name: echo
lane: echo
r1: []
database:
  role: {schema: echo, shared: [module_identity, smo_event, smo_event_relay, audit_log, audit_head, idempotency_key, notification_outbox]}
  tables: [moi_store]
openapi: true
tests: {source: app, pythonpath: ".:../shared", floor: 100}
mutation:
  pythonpath: ".:$SMO/shared"
  targets: ["app/main.py", "app/models.py"]
  watch: ["smo/echo/**"]
code_docs: true
config_reference: true
compose:
  services: |
    # PR-CONV-S1.6: Echo, the reference ProvMnS module (echo/README.md): the shared router on SubNetwork and ManagedElement, nothing else. Off by default
    # (`docker compose --profile echo up`): a reference and test module with no operator function, whose write API nothing in the platform needs.
    echo:
      profiles: ["echo"]
      build: { context: ., additional_contexts: { specs: ../specs/5G_APIs }, args: { <<: *build_info, MODULE: echo, WITH_TRACING: "${SMO_WITH_TRACING:-0}" } }
      stop_grace_period: 30s
      secrets: [db_password_echo, enrollment_secret]
      <<: *hardening
      healthcheck: *ready_probe
      depends_on: *wait_for_schema
      environment:
        SMO_OTEL_ENDPOINT: ${SMO_OTEL_ENDPOINT:-}    # distributed traces, off when empty (docs: README "Distributed traces and logs")
        SMO_ENROLLMENT_SECRET_FILE: /run/secrets/enrollment_secret    # PR-SEC-14: what makes this an SMO module at SME
        SMO_BOOTSTRAP_KEY: ${R1_BOOTSTRAP_KEY:-}    # PR-SEC-9.3: sent as X-Bootstrap-Key to /bootstrap when R1_BOOTSTRAP_KEY is set at the gateway (DOC-CF-3.1)
        <<: *db_env
        SMO_DATABASE_URL: postgresql+psycopg://smo_echo@${SMO_DB_HOST:-postgres}:${SMO_DB_PORT:-5432}/smo
        SMO_DB_POOLER: ${SMO_DB_POOLER:-}
        SMO_DATABASE_PASSWORD_FILE: /run/secrets/db_password_echo
        ECHO_PLACEMENT: ${ECHO_PLACEMENT:-}         # where an instance is for the scope claim: {"SubNetwork=A": {"region": ..., "tenant": ..., "siteCluster": ...}}
        ECHO_MSAC_RULES: ${ECHO_MSAC_RULES:-}       # TS 28.319 rules per caller: {"<invoker or user>": [{"dataNodeSelector", "operations", "action"}]}
  secrets: |
    db_password_echo:
      file: ./secrets/db_password_echo
helm: |
  # PR-CONV-S1.6: Echo, the reference ProvMnS module (echo/README.md). Off by default: a reference and test module with no operator function; turn it on
  # to try the shared router on a cluster (`--set modules.echo.enabled=true`). Its schema and role exist either way (revision 0066, db_roles.json).
  echo: { image: echo, databaseRole: echo, enabled: false, env: { ECHO_PLACEMENT: "", ECHO_MSAC_RULES: "" } }
