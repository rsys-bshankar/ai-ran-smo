# SMO Operator GUI — serves the built SPA and reverse-proxies /api to the BFF.
# The browser only ever talks to this origin: never to R1 Termination or a
# module port (no CORS anywhere, and no way around the BFF's role checks).

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # BFF: its own responses carry their own security headers (CSP 'none' etc).
    location /api/ {
        proxy_pass http://gui-bff:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;     # longer than the BFF's 65 s for a rApp operator call, so the gateway's own 504 reaches the user (DOC-CF-2.6)
        client_max_body_size 50m;   # AI/ML model artifact and rApp package (.csar) uploads
    }

    # The BFF's event stream (Server-Sent Events, GUI-9.1): not buffered, or every event would wait for a full buffer; read for up to an hour
    # (the BFF pings every 15 s and ends a stream after 30 minutes, the browser reconnects). The BFF's `X-Accel-Buffering: no` is passed on, so
    # a proxy in front of this one (the TLS edge) does not buffer it either.
    location = /api/events {
        proxy_pass http://gui-bff:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_pass_header X-Accel-Buffering;
    }

    # The public keys that verify session tokens (PR-SEC-5.3): one exact path, public by design, an empty key set under the default HS256.
    location = /.well-known/jwks.json {
        proxy_pass http://gui-bff:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes all resolve to the SPA shell, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
