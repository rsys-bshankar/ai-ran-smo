name: Deploy gate (main)

# PR-OPS-10 (option a): on every merge to main, tear the whole stack down and redeploy it from empty data, then replay the demo
# runbook against it. It answers one question for the maintainers: does what is on main still come up and work? It starts from
# empty data, so it cannot catch an upgrade bug (that is OPS-10.5). Runs on GitHub Actions only; no GUI to open.
#
# The same steps as the `compose-e2e` job of smo-tests.yml (a required check on pull requests) are repeated here on purpose, so this
# gate has its own name, its own concurrency rule and its own failure notification; keep the two in step.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_break:
        description: "Fail on purpose, to prove the failure notification works (OPS-10.4)"
        type: boolean
        default: false

permissions:
  contents: read

# OPS-10.2: a newer merge supersedes the run in flight; two quick merges leave one run.
concurrency:
  group: deploy-on-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Redeploy the stack from empty and replay the runbook
    runs-on: ubuntu-latest
    timeout-minutes: 25          # below the 30 minutes of the PR job and far below the monthly minutes budget
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Seeded break (workflow_dispatch with seed_break only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_break }}
        run: |
          echo "::error::seeded break: this failure is on purpose"
          exit 1

      - name: Create the secret files and .env
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env

      - name: docker compose up --build
        working-directory: smo
        env:
          GUI_COOKIE_SECURE: "false"       # no TLS terminator in front of the GUI here
        run: docker compose up -d --build

      - name: The migrate service ran and the database is at the migration head
        working-directory: smo
        run: |
          state=$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')
          echo "migrate: $state"
          [ "$state" = "exited 0" ]
          head=$(python3 scripts/check_revision_branches.py --heads)   # one per branch (docs/adr/0001-schema-migrations.md)
          at=$(docker compose exec -T postgres psql -U smo -d smo -Atc "SELECT string_agg(version_num, ',' ORDER BY version_num) FROM alembic_version")
          echo "database at $at, repository head $head"
          [ "$at" = "$head" ]

      - name: Every service up, R1 gate answers
        working-directory: smo
        run: docker compose exec -T r1-termination python3 - < scripts/compose_e2e.py

      - name: Caller roles through the gateway (PR-SEC-14)
        working-directory: smo
        run: docker compose exec -T sme python3 - < scripts/compose_e2e_roles.py

      - name: The audit trail holds those calls and its chain verifies (PR-SEC-11)
        working-directory: smo
        run: |
          rows=$(docker compose exec -T postgres psql -U smo -d smo -Atc "SELECT count(*) FROM audit_log")
          echo "audit rows: $rows"
          [ "$rows" -gt 0 ]
          docker compose exec -T r1-termination python -m smo_shared.audit verify

      - name: Replay DEMO_RUNBOOK against the live stack
        working-directory: smo
        run: |
          docker run --rm --network smo_default --network-alias demo-consumer \
            -e SMO_E2E_LIVE=1 -e PYTHONPATH=/work/smo/shared:/work/smo/sdk \
            -v "$PWD/..:/work" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c '
              pip install -q --require-hashes -r requirements/dev.txt &&
              pip install -q --no-deps -e shared &&
              python -m pytest tests_integration/test_demo_runbook.py -v -p no:cacheprovider'

      - name: GUI serves the SPA and proxies /api to the BFF
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/ | grep -qi '<div id="root"'
          curl -sS -o /dev/null -w '%{http_code}\n' http://localhost:3000/api/modules/status

      # OPS-10.3: sign in to the GUI in a headless browser, check the dashboard shows every module healthy, keep the screenshots
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Headless GUI smoke check
        working-directory: smo
        run: |
          pip install -q --require-hashes -r requirements/smoke.txt
          python -m playwright install --with-deps chromium
          # the generated admin password is in the BFF container (mode 0600, never in the log)
          GUI_SMOKE_PASSWORD=$(docker compose exec -T gui-bff cat /data/initial-admin-password) \
            python scripts/gui_smoke.py --base-url http://localhost:3000 --out "$RUNNER_TEMP/gui-smoke"

      - name: Upload the GUI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-smoke-screenshots
          path: ${{ runner.temp }}/gui-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect logs on failure
        if: failure()
        working-directory: smo
        run: |
          mkdir -p /tmp/deploy-logs
          docker compose ps -a > /tmp/deploy-logs/ps.txt || true
          docker compose logs --no-color > /tmp/deploy-logs/compose.log 2>&1 || true

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-gate-logs
          path: /tmp/deploy-logs
          retention-days: 7

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose down -v

  # OPS-10.4: a failed run opens (or comments on) one issue labelled `deploy-gate`; the next green run closes it. The maintainers are
  # notified through the repository's normal issue notifications. A cancelled run (a newer merge superseded it) notifies nobody.
  notify:
    name: Tell the maintainers
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'cancelled' && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - name: Open, update or close the deploy-gate issue
        run: |
          gh label create deploy-gate --color B60205 --description "The deploy gate on main failed" 2>/dev/null || true
          open=$(gh issue list --label deploy-gate --state open --json number --jq '.[0].number // empty')
          if [ "${{ needs.deploy.result }}" = "failure" ]; then
            body="The deploy gate failed on \`${SHA::7}\`: ${RUN_URL}. The logs are in the run's \`deploy-gate-logs\` artifact."
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Failed again on \`${SHA::7}\`: ${RUN_URL}"
            else
              gh issue create --label deploy-gate --title "Deploy gate failed on main" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Green again on \`${SHA::7}\`: ${RUN_URL}. Closing."
            gh issue close "$open"
          fi
