name: SMO tests

# No `paths:` filter, on purpose: these jobs are required status checks on `main`,
# and a required check that never runs (a docs-only PR) would block the merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only checks out and runs tests: the GITHUB_TOKEN needs nothing
# beyond reading the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight (main is never cancelled).
concurrency:
  group: smo-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "Lint (ruff - syntax errors, undefined names)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      # Rules, and what is switched off and why: smo/ruff.toml.
      - name: ruff check
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/lint.txt
          ruff check .

      # PR-V-2b: the shared library is type checked (smo/shared/mypy.ini). It needs the packages it imports, for their types: the runtime requirements.
      - name: mypy (shared library)
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          cd shared && mypy

      # PR-V-2d: every module is type checked too (smo/scripts/run_mypy.sh lists them).
      - name: mypy (modules)
        working-directory: smo
        run: scripts/run_mypy.sh

      # Service code keeps no request-visible state and starts no background work
      # (docs/ARCHITECTURE.md, "Process state and scale-out"). Standard library only.
      - name: statelessness guard
        working-directory: smo
        run: python scripts/check_statelessness.py

  # PR-RAPP-4 (Go): the Go AI Runtime SDK and its example rApp (smo/sdk-go). Standard library only, so there is no go.sum to verify and no module
  # download; the Go version is the one go.mod names, and the same job builds the example's static binary the way its Dockerfile does.
  sdk-go:
    name: "Go SDK (gofmt, vet, test -race, build)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: smo/sdk-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: smo/sdk-go/go.mod
          cache: false   # no dependencies: nothing to cache, and no go.sum to key a cache on

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      # The tests check the client against a fake platform and every route it calls against ../docs/openapi/*.json
      - name: go test -race
        run: go test -race -count=1 -cover ./...

      - name: go build (library and the example's static binary)
        run: |
          go build ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/hello-rapp ./examples/hello-rapp

  # PR-V-4: the R1 contract against the previous release. Every docs/openapi/<module>.json at the newest smo-v* tag is compared with this commit's;
  # a removed operation, a new required parameter or property, a narrowed bound or enum, a changed type, or a lost response property fails unless
  # smo/scripts/breaking_change_waivers.json waives it with a reason (the file is emptied when a release is cut). Standard library only.
  breaking-changes:
    name: "R1 contract has no breaking change since the previous release"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Rewrite mode (smo/scripts/rewrite_mode.json, plan task S0.8): until 1.0 a replaced route is deleted with its replacement, so the comparison with
      # 0.9.0 is paused: the job prints a notice naming the file and passes. The step and its script stay; S8.8 switches it back on.
      - name: Rewrite mode
        id: rewrite
        working-directory: smo
        run: |
          if python scripts/rewrite_mode.py notice "R1 contract has no breaking change since the previous release"; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare the committed OpenAPI specs with the previous release's
        if: steps.rewrite.outputs.paused != 'true'
        working-directory: smo
        run: python scripts/check_breaking_changes.py

  # The code-documentation gate (smo/docs/CODE_DOCUMENTATION.md). `check_code_docs.py` counts, per module, the files and functions that still lack the description the rule asks for and fails
  # when a count goes up against smo/scripts/code_docs_baseline.json or when a NEW file or function lacks one. A pull request titled `Docs(code): ...` is a documentation change: it must
  # also pass `verify_docs_only.py`, which proves against the merge base that only comments, docstrings and layout changed (Markdown is allowed through unverified). The label
  # `docs-tooling` switches that proof off for the one kind of pull request that cannot satisfy it: a change to the verifier or the gate themselves. The tools' own tests run here
  # (not only in the integration job) because the TypeScript cases need smo/gui/node_modules.
  code-docs:
    name: Code documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the merge base with origin/main is the reference for "new" code and for the comment-only proof

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: smo/sdk-go/go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smo/gui/package-lock.json

      # The TypeScript half reads the syntax tree with the parser in the GUI's toolchain (rolldown/Oxc), so the GUI's packages are installed; nothing is built.
      - name: Install the GUI's packages and the test runner
        run: |
          (cd smo/gui && npm ci --ignore-scripts)
          cd smo && pip install --require-hashes -r requirements/dev.txt

      - name: The tools' own tests
        working-directory: smo
        run: PYTHONPATH=shared python -m pytest tests_integration/test_code_docs_tools.py -q

      - name: Documentation gate (counts against the baseline, new code must be documented)
        working-directory: smo
        run: python scripts/check_code_docs.py

      # Only a pull request whose title starts with `Docs(code):` claims to change nothing but comments; the proof compares each changed file with the merge base.
      - name: Comment-only proof (pull requests titled "Docs(code):")
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Docs(code):') && !contains(github.event.pull_request.labels.*.name, 'docs-tooling')
        working-directory: smo
        run: |
          base="$(git merge-base origin/main HEAD)"
          python scripts/verify_docs_only.py --base "$base" --head HEAD --allow-unverified-extension .md

  # Plan task S0.7: the schema bundle (specs/smo-schema-bundle, docs in its README) is the contract every module is held to. redocly lints every OpenAPI
  # document (structural rules; problems inside the published 3GPP files are listed in the bundle's .redocly.lint-ignore.yaml), pyang --strict checks the
  # YANG modules the bundle names, every example validates (the Intent ones against Intent Service's own strict TS 28.312 models), the DDL applies to
  # Postgres 18 with TimescaleDB with one role per schema, and the drift between each module's generated OpenAPI and its contract may not grow
  # (scripts/contract_drift_baseline.json). A required check: the owner adds "Contracts" to the branch protection of main.
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Start Postgres 18 with TimescaleDB (a scratch database for the bundle's DDL)
        run: |
          docker run -d --name contracts-pg -p 5432:5432 -e POSTGRES_PASSWORD=contracts-only -e POSTGRES_DB=smo \
            --health-cmd "pg_isready -U postgres -d smo" --health-interval 5s --health-timeout 3s --health-retries 12 \
            "$SMO_IMAGE_TIMESCALEDB_2_31_0_PG18"
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' contracts-pg)" = "healthy" ] && break; sleep 2; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' contracts-pg)" = "healthy" ]

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the checks' dependencies (hashed locks; pyang from requirements/contracts.txt)
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/dev.txt -r requirements/contracts.txt
          pip install --no-deps -e shared

      - name: redocly lint every OpenAPI document of the bundle (pinned @redocly/cli 2.63.0)
        working-directory: specs/smo-schema-bundle
        env:
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
        run: npx --yes @redocly/cli@2.63.0 lint openapi/common/*.yaml openapi/modules/*.yaml

      - name: Structure, examples, pyang --strict, and the DDL on Postgres 18 + TimescaleDB
        working-directory: smo
        run: python scripts/check_contract_bundle.py --database-url postgresql://postgres:contracts-only@localhost:5432/smo

      - name: Contract drift does not grow (scripts/contract_drift_baseline.json)
        working-directory: smo
        run: python scripts/check_contract_drift.py

  # Plan task S0.17, ADR 0011 section 7: every served route and every call of the SMO's own code is a bundle operation, a listed [D] exception, or
  # waiting in smo/scripts/interface_baseline.json for the PR-CONV row that replaces or deletes it. Fails on a new private route or call, on a stale
  # baseline entry, and (on a pull request) on a baseline that grew against the base branch. Required check (the owner sets it in branch protection).
  interfaces:
    name: Interfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install the gate's dependencies (hashed lock)
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e shared

      - name: Interface gate (scripts/check_interfaces.py); the baseline may only shrink
        working-directory: smo
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/check_interfaces.py --base-ref "$BASE_REF"
          else
            python scripts/check_interfaces.py
          fi

      - name: No path of the removed MLMR and MLLF services (scripts/check_no_old_ml_prefixes.py, plan task S2.4)
        working-directory: smo
        run: python scripts/check_no_old_ml_prefixes.py

  unit-and-integration:
    name: Unit + integration tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install shared library + service dependencies
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e shared

      # Every unit suite runs under coverage (scripts/run_unit_suite.sh) and leaves smo/coverage/<name>.json; the floors file is checked after the suites
      - name: Run each module's unit test suite, with coverage
        working-directory: smo
        run: |
          set -e
          for m in onboarding rapp-mgmt ran-nf-oam aimgf so-smos \
                   sme dme r1-termination nfo focom ran-analytics mdaf \
                   intent-service sa-smos mock-o1-adaptor; do
            scripts/run_unit_suite.sh "$m" "$m" app ".:../shared"
          done
          scripts/run_unit_suite.sh sdk sdk smo_sdk ".:../shared"

      - name: Run the sample rApps' own tests (EnergySaving, Mobility, Coverage and Traffic Steering, model and decision engines)
        working-directory: smo
        run: |
          set -e
          for r in energy-saving-rapp mobility-optimization-rapp coverage-optimization-rapp traffic-steering-rapp; do
            scripts/run_unit_suite.sh "$r" "samples/$r" app ".:../../shared:../../sdk"
          done

      - name: Run the shared library's tests (R1Client's OAuth2 client flow, database, worker, ...)
        working-directory: smo
        run: scripts/run_unit_suite.sh shared shared smo_shared "."

      - name: Run the Operator GUI BFF tests
        working-directory: smo
        run: scripts/run_unit_suite.sh gui-bff gui-bff app ".:../shared"

      - name: Coverage against the floors (PR-V-1)
        working-directory: smo
        run: python scripts/coverage_floor.py coverage/

      - name: Run cross-service integration tests
        working-directory: smo
        run: PYTHONPATH=shared python -m pytest tests_integration/ -v

      # The READMEs link to docs/TEST_COUNTS.md instead of stating hand-typed totals; this fails (with the diff) when tests were added or removed without regenerating it
      - name: Test counts table is current (docs/TEST_COUNTS.md)
        working-directory: smo
        run: python scripts/count_tests.py --check

  gui:
    name: Operator GUI (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smo/gui/package-lock.json

      - name: Install, typecheck, test, build
        working-directory: smo/gui
        run: |
          npm ci
          npm run typecheck
          npm test
          npx vite build

      - name: Validate every call-flow doc's mermaid diagram parses clean
        working-directory: smo/gui
        run: npm run validate:diagrams

  # PR-RAPP-4: the Java AI Runtime SDK (smo/sdk-java) and its example rApp. JDK 21, Maven through the checked-in wrapper (the Maven
  # distribution is pinned by SHA-256), every dependency pinned by version and by jar hash (dependencies.sha256).
  sdk-java:
    name: Java SDK (build, tests, pinned dependencies, example image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: smo/sdk-java/**/pom.xml

      # -C: a checksum Maven Central publishes that does not match the download fails the build instead of warning.
      # The SDK's contract test compares its routes with smo/docs/openapi/*.json.
      - name: Build and test (SDK, example rApp)
        working-directory: smo/sdk-java
        run: ./mvnw -B -ntp -C verify

      - name: The resolved jars are the pinned ones
        working-directory: smo/sdk-java
        run: scripts/verify-dependencies.sh

      - name: The example rApp's image builds
        working-directory: smo/sdk-java
        run: |
          # the Maven and JRE base images from the GHCR mirror when it holds them (docs/MIRROR.md); none when the mirror is off
          mapfile -t mirror < <(python3 ../scripts/ci_mirror.py build-contexts . -f examples/hello-rapp/Dockerfile)
          docker build -f examples/hello-rapp/Dockerfile -t hello-java-rapp:ci "${mirror[@]}" .

  compose-e2e:
    name: Full docker-compose stack runs end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: docker-compose.yml is structurally valid
        working-directory: smo
        run: |
          docker compose config --quiet
          # the database password is a secret file: it must not appear in the rendered config (PR-SEC-4.3)
          if docker compose config | grep -E "POSTGRES_PASSWORD:|smo:smo@"; then
            echo "::error::a database password is in the compose configuration"; exit 1
          fi

      - name: Create the secret files and .env
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env

      - name: docker compose up --build
        working-directory: smo
        env:
          # No TLS terminator in front of the GUI in CI.
          GUI_COOKIE_SECURE: "false"
          SMO_BUILD_SHA: ${{ github.sha }}    # GET /version answers it (PR-OBS-8.1)
        run: docker compose up -d --build

      # PR-OPS-1.5: the one-shot migrate service created the schema (the stack no longer mounts 001_init.sql into
      # Postgres) and the database is at the newest revision in the repository.
      - name: The migrate service ran and the database is at the migration head
        working-directory: smo
        run: |
          state=$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')
          echo "migrate: $state"
          [ "$state" = "exited 0" ]
          head=$(ls migrations/versions | grep -oE '^[0-9]+' | sort | tail -1)
          at=$(docker compose exec -T postgres psql -U smo -d smo -Atc "SELECT version_num FROM alembic_version")
          echo "database at $at, repository head $head"
          [ "$at" = "$head" ]

      - name: Every service up, R1 gate answers (fast gate)
        working-directory: smo
        run: docker compose exec -T r1-termination python3 - < scripts/compose_e2e.py

      - name: Caller roles through the gateway (PR-SEC-14)
        working-directory: smo
        run: docker compose exec -T sme python3 - < scripts/compose_e2e_roles.py

      - name: The audit trail holds those calls and its chain verifies (PR-SEC-11)
        working-directory: smo
        run: |
          rows=$(docker compose exec -T postgres psql -U smo -d smo -Atc "SELECT count(*) FROM audit_log")
          echo "audit rows: $rows"
          [ "$rows" -gt 0 ]
          docker compose exec -T r1-termination python -m smo_shared.audit verify

      - name: Replay DEMO_RUNBOOK §2-§27 against the live stack
        working-directory: smo
        # The same test file the in-process suite runs, with SMO_E2E_LIVE=1: a
        # container on the compose network drives every module by hostname, and
        # stands in as `demo-consumer` (the runbook's callback receiver) and as
        # the package server (tests_integration/live.py).
        run: |
          docker run --rm --network smo_default --network-alias demo-consumer \
            -e SMO_E2E_LIVE=1 -e PYTHONPATH=/work/smo/shared:/work/smo/sdk \
            -v "$PWD/..:/work" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c '
              pip install -q --require-hashes -r requirements/dev.txt &&
              pip install -q --no-deps -e shared &&
              python -m pytest tests_integration/test_demo_runbook.py -v -p no:cacheprovider'

      # PR-SB-9b (SB-9.3 to 9.5, 9.8): the O1 conformance kit's emitting groups (FM, PM, SW, HB) against the stack: the mock adaptor (MOCK_O1_OAM_URL) raises
      # alarms, reports PM, reports software phases and heartbeats to the real RAN NF OAM container, and the kit reads RAN NF OAM back. After the runbook replay,
      # which expects the stack otherwise untouched (the kit leaves its element, alarms and files behind). Every check must run: none skipped.
      - name: O1 conformance kit, emitting side, mock adaptor to RAN NF OAM (SB-9.8)
        working-directory: smo
        run: |
          docker run --rm --network smo_default \
            -e PYTHONPATH=/work/smo/shared -v "$PWD/..:/work" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c '
              pip install -q --require-hashes -r requirements/runtime.txt &&
              pip install -q --no-deps -e shared &&
              python -m conformance.o1 --adaptor http://mock-o1-adaptor:8000 --oam-url http://ran-nf-oam:8000 --protocol both --out /tmp/kit &&
              grep -q "0 failed, 0 skipped" /tmp/kit.md'

      # PR-RAPP-3: the rApp conformance pack. Offline first: every sample package against Onboarding's validation, with its signature checked against the demo
      # publisher's key and signing required. Then the runtime checks against the stack, modules addressed by name (--direct, as the runbook replay does): the
      # kit serves a signed copy of the energy-saving package that is new to the stack (scripts/unique_sample_csar.py: the runbook replay above already onboarded the
      # committed one, and Onboarding refuses identical bytes), Onboarding fetches it, and the kit takes it through register, heartbeat, R1 usage and terminate and removes
      # what it made. Every check must run: none failed, no warning, none skipped. Not run locally (no docker in the session that wrote it): this step is the
      # first run against the real stack.
      - name: rApp conformance pack, offline and against the stack (PR-RAPP-3)
        working-directory: smo
        run: |
          docker run --rm --network smo_default --network-alias rapp-packages \
            -e PYTHONPATH=/work/smo/shared -v "$PWD/..:/work" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c '
              pip install -q --require-hashes -r requirements/runtime.txt &&
              pip install -q --no-deps -e shared &&
              python -m conformance.rapp package samples --trust samples/demo-signing --require-signed --out /work/rapp-conformance-package &&
              grep -q "0 failed, 0 warnings" /work/rapp-conformance-package.md &&
              mkdir -p /tmp/pkg && python scripts/unique_sample_csar.py energy-saving-rapp /tmp/pkg/conformance-rapp.csar &&
              (python -m http.server 9100 --directory /tmp/pkg > /dev/null 2>&1 &) && sleep 2 &&
              python -m conformance.rapp runtime --package-url http://rapp-packages:9100/conformance-rapp.csar --direct --out /work/rapp-conformance-runtime &&
              grep -q "0 failed, 0 warnings, 0 skipped" /work/rapp-conformance-runtime.md'
          { echo "### rApp conformance pack, offline"; echo; cat ../rapp-conformance-package.md; echo; echo "### rApp conformance pack, against the stack"; echo; cat ../rapp-conformance-runtime.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Every module with a role runs as it, and each role can use its schema and nothing else (PR-DB-2.6, 2.7)
        working-directory: smo
        run: |
          psql() { docker compose exec -T postgres psql -U smo -d smo -Atc "$1"; }
          roles="$(python3 -c "import json; print(*[m.rsplit('/', 1)[-1] for m in json.load(open('migrations/db_roles.json')) if m != '_comment'])")"
          echo "modules with a role: $roles"
          for name in $roles; do
            role="smo_${name//-/_}"
            # the runbook replay above went through every module: its connections are the role's
            [ "$(psql "SELECT count(*) FROM pg_stat_activity WHERE usename = '$role'")" -gt 0 ] || { echo "::error::$name does not connect as $role"; exit 1; }
            pw="$(cat "secrets/db_password_$name")"
            # the role refuses a table of every other kind: another module's, the audit chain, and a shared table it was not given
            for table in $(scripts/db_roles_denied.py "$name"); do
              if docker compose exec -T -e PGPASSWORD="$pw" postgres psql -h postgres -U "$role" -d smo -Atc "SELECT count(*) FROM $table" 2>/dev/null; then
                echo "::error::$role can read $table"; exit 1
              fi
            done
          done
          [ "$(psql "SELECT count(*) FROM onboarding.application_package")" -gt 0 ]

      - name: Only the documented host ports are published
        working-directory: smo
        run: |
          published=$(docker compose ps --format json | jq -rs '[.[] | select(any(.Publishers[]?; .PublishedPort > 0)) | .Service] | unique | join(" ")')
          echo "services publishing host ports: $published"
          [ "$published" = "gui postgres r1-termination" ]

      - name: GUI serves the SPA and proxies /api to the BFF
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/ | grep -qi '<div id="root"'
          curl -sS -o /dev/null -w '%{http_code}\n' http://localhost:3000/api/modules/status

      - name: TLS edge (profile tls, PR-SEC-1)
        working-directory: smo
        run: |
          scripts/make_dev_certs.sh
          docker compose --profile tls up -d edge-tls
          for i in $(seq 1 30); do
            curl -fsS --cacert certs/ca.crt https://localhost:8443/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --cacert certs/ca.crt https://localhost:8443/bootstrap | grep -q apiEndpoints
          curl -fsS --cacert certs/ca.crt https://localhost:3443/ | grep -qi '<div id="root"'
          curl -fsS --cacert certs/ca.crt -D - -o /dev/null https://localhost:3443/ | grep -qi '^strict-transport-security: max-age=86400'
          curl -fsS --cacert certs/ca.crt -D - -o /dev/null https://localhost:8443/health | grep -qi '^strict-transport-security: max-age=86400'
          # a client that does not trust the CA is refused, and TLS 1.1 is not offered
          if curl -fsS https://localhost:8443/health > /dev/null 2>&1; then echo "::error::accepted an untrusted certificate"; exit 1; fi
          if curl -sS --cacert certs/ca.crt --tls-max 1.1 https://localhost:8443/health > /dev/null 2>&1; then
            echo "::error::TLS 1.1 was accepted"; exit 1
          fi

      # PR-SEC-1.6: with R1_PUBLIC_BASE_URL set, /bootstrap names the HTTPS door, the edge forwards the token endpoint to SME without a token,
      # and SME's assertion audience is that same URL. Then the default (unset) is restored for the steps after this one.
      - name: /bootstrap behind the TLS edge (PR-SEC-1.6)
        working-directory: smo
        run: |
          # nginx resolves its upstreams once at start, so the edge is recreated together with the services it fronts; ready = /bootstrap answers
          wait_for_edge() {
            for i in $(seq 1 45); do
              curl -fsS --cacert certs/ca.crt https://localhost:8443/bootstrap > /dev/null 2>&1 && return 0
              sleep 2
            done
            return 1
          }
          R1_PUBLIC_BASE_URL=https://localhost:8443 docker compose --profile tls up -d --no-deps --force-recreate sme r1-termination edge-tls
          wait_for_edge
          curl -fsS --cacert certs/ca.crt https://localhost:8443/bootstrap | tee /dev/stderr | \
            jq -e '[.apiEndpoints[].tokenEndPoint.uri] | all(. == "https://localhost:8443/sme/oauth2/token")'
          # the token endpoint is reachable through the edge with no token: SME answers a malformed request itself (not the edge, not R1's token check)
          code=$(curl -sS --cacert certs/ca.crt -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://localhost:8443/sme/oauth2/token)
          echo "POST /sme/oauth2/token -> $code"
          [ "$code" = 422 ] || [ "$code" = 400 ]
          # every other SME path still goes through R1's token check
          code=$(curl -sS --cacert certs/ca.crt -o /dev/null -w '%{http_code}' https://localhost:8443/sme/service-apis/v1/allServiceAPIs)
          echo "GET /sme/service-apis/v1/allServiceAPIs without a token -> $code"
          [ "$code" = 401 ]
          docker compose exec -T sme printenv SME_TOKEN_AUDIENCE | grep -x "https://localhost:8443/sme/oauth2/token"
          docker compose --profile tls up -d --no-deps --force-recreate sme r1-termination edge-tls
          wait_for_edge

      - name: Slow statements are logged (PR-DB-4.1)
        working-directory: smo
        run: |
          docker compose exec -T postgres psql -U smo -d smo -c "SELECT pg_sleep(1)" > /dev/null
          docker compose logs --no-color postgres | grep -E "duration: [0-9.]+ ms +statement: SELECT pg_sleep"

      - name: Backup and restore round trip (compose mode, PR-DB-6.1)
        working-directory: smo
        run: |
          count() { docker compose exec -T postgres psql -U smo -d smo -Atc "SELECT count(*) FROM $1"; }
          before=$(count module_identity)
          [ "$before" -gt 0 ]
          scripts/db_backup.sh --compose /tmp/smo-ci.dump
          # nothing may write during a restore: stop every service but the database, then lose some data
          docker compose stop $(docker compose config --services | grep -vx postgres)
          docker compose exec -T postgres psql -U smo -d smo -c "DELETE FROM module_identity"
          [ "$(count module_identity)" = 0 ]
          scripts/db_restore.sh --compose --yes /tmp/smo-ci.dump
          [ "$(count module_identity)" = "$before" ]

      # PR-SEC-4.8: the database password's rotation runbook, tried once: the script rotates it, the old value is refused by the database,
      # and the stack (every service, through the fast gate) comes back on the new one.
      - name: Rotate the database password (PR-SEC-4.8)
        working-directory: smo
        run: |
          old="$(cat secrets/db_password)"
          scripts/rotate_db_password.sh
          [ "$(cat secrets/db_password)" != "$old" ]
          if docker compose run --rm --no-deps -T --entrypoint psql -e PGPASSWORD="$old" postgres -h postgres -U smo -d smo -c 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::the old database password still works"; exit 1
          fi
          docker compose run --rm --no-deps -T --entrypoint psql -e PGPASSWORD="$(cat secrets/db_password)" postgres -h postgres -U smo -d smo -Atc 'SELECT 1' | grep -qx 1
          docker compose exec -T r1-termination python3 - < scripts/compose_e2e.py

      # PR-SB-1.11: the same stack, with RAN NF OAM holding the lab server's credential, writes a value through a real NETCONF-over-SSH
      # server and reads it back. The whole stack is brought up again first (the steps before it leave some services stopped). Runs last: the lab publishes loopback ports, which the published-ports check must not see, and the steps above expect the stack as `up` left it.
      - name: Runbook CM write over NETCONF/SSH through the stack (netconf-lab)
        working-directory: smo
        run: |
          docker compose -f docker-compose.yml -f netconf-lab/compose.replay.yml -f .ci-mirror/docker-compose.mirror.yml --profile netconf-lab up -d --wait
          docker run --rm --network smo_default \
            -e SMO_E2E_LIVE=1 -e SMO_LAB_HOST=netconf-lab -e PYTHONPATH=/work/smo/shared:/work/smo/sdk \
            -v "$PWD/..:/work" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c '
              pip install -q --require-hashes -r requirements/dev.txt &&
              pip install -q --no-deps -e shared &&
              python -m pytest tests_integration/test_runbook_over_ssh.py -v -p no:cacheprovider'

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose --profile netconf-lab down -v

  # PR-DB-5: the stack behind PgBouncer in transaction mode (compose profile `pooler`). The migrate service goes direct; every module connects to pgbouncer:6432.
  compose-pooler:
    name: Stack behind PgBouncer (transaction pooling) replays the runbook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Create the secret files and .env
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env

      - name: docker compose --profile pooler up --build, every module through pgbouncer
        working-directory: smo
        env:
          GUI_COOKIE_SECURE: "false"
          SMO_DB_HOST: pgbouncer
          SMO_DB_PORT: "6432"
          SMO_DB_POOLER: transaction
        run: |
          docker compose --profile pooler config | grep -q 'SMO_DB_POOLER: transaction'
          docker compose --profile pooler up -d --build
          for i in $(seq 1 60); do
            [ "$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] && break
            sleep 3
          done
          docker compose exec -T r1-termination python3 - < scripts/compose_e2e.py

      - name: The modules are connected to PgBouncer, and prepared statements do not break (PR-DB-5.2)
        working-directory: smo
        run: |
          [ "$(docker compose exec -T sme printenv SMO_DATABASE_URL)" = "postgresql+psycopg://smo_sme@pgbouncer:6432/smo" ]
          docker compose exec -T sme python3 - < scripts/pooler_check.py
          # PgBouncer's own log: a client refused for a startup parameter would be here
          if docker compose logs pgbouncer 2>&1 | grep -iE "unsupported startup parameter|prepared statement .* does not exist"; then echo "::error::PgBouncer refused a client"; exit 1; fi

      - name: Caller roles through the gateway, and the audit chain (behind the pooler)
        working-directory: smo
        run: |
          docker compose exec -T sme python3 - < scripts/compose_e2e_roles.py
          docker compose exec -T r1-termination python -m smo_shared.audit verify

      - name: Replay DEMO_RUNBOOK §2-§27 against the live stack, through PgBouncer (PR-DB-5.1)
        working-directory: smo
        run: |
          docker run --rm --network smo_default --network-alias demo-consumer \
            -e SMO_E2E_LIVE=1 -e PYTHONPATH=/work/smo/shared:/work/smo/sdk \
            -v "$PWD/..:/work" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c '
              pip install -q --require-hashes -r requirements/dev.txt &&
              pip install -q --no-deps -e shared &&
              python -m pytest tests_integration/test_demo_runbook.py -v -p no:cacheprovider'

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose --profile pooler ps -a
          docker compose --profile pooler logs --no-color --tail=200

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose --profile pooler down -v

  # PR-HA-1.2: two replicas of every module that can have them (docker-compose.replicas.yml), and the whole runbook replayed against them.
  compose-replicas:
    name: Two replicas of every module replay the runbook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.replicas.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Create the secret files and .env
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env

      - name: docker compose up --build, two replicas of each
        working-directory: smo
        env:
          GUI_COOKIE_SECURE: "false"
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            [ "$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] && break
            sleep 3
          done
          # every replicated module has two running containers
          for svc in $(python3 -c "import yaml; print(*[n for n, s in yaml.safe_load(open('docker-compose.replicas.yml'))['services'].items()])"); do
            n=$(docker compose ps "$svc" --status running --format json | jq -s 'length')
            [ "$n" = "2" ] || { echo "::error::$svc has $n running containers, not 2"; docker compose ps "$svc"; exit 1; }
          done
          docker compose exec -T r1-termination python3 - < scripts/compose_e2e.py

      - name: Caller roles through the gateway, and the audit chain (across replicas)
        working-directory: smo
        run: |
          docker compose exec -T sme python3 - < scripts/compose_e2e_roles.py
          docker compose exec -T r1-termination python -m smo_shared.audit verify

      - name: Replay DEMO_RUNBOOK §2-§27 against the replicas (PR-HA-1.2)
        working-directory: smo
        run: |
          docker run --rm --network smo_default --network-alias demo-consumer \
            -e SMO_E2E_LIVE=1 -e PYTHONPATH=/work/smo/shared:/work/smo/sdk \
            -v "$PWD/..:/work" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c '
              pip install -q --require-hashes -r requirements/dev.txt &&
              pip install -q --no-deps -e shared &&
              python -m pytest tests_integration/test_demo_runbook.py -v -p no:cacheprovider'

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose down -v

  # PR-OBS-3.6, PR-OBS-6.4: the compose `tracing` and `logging` profiles run for real. The modules are built with the OpenTelemetry packages and send spans to
  # Tempo; Fluent Bit ships the containers' logs to Loki; scripts/obs_smoke.py makes one request through the gateway and finds its trace in Tempo, its log line in
  # Loki, and checks Grafana's provisioned data sources. This is the only place the images in smo/docker-compose.yml's observability services are started.
  obs-stack:
    name: Tracing and logging profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Create the secret files and .env
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env

      - name: docker compose --profile tracing --profile logging up --build
        working-directory: smo
        env:
          GUI_COOKIE_SECURE: "false"
          SMO_WITH_TRACING: "1"
          SMO_OTEL_ENDPOINT: http://tempo:4318
        run: |
          docker compose --profile tracing --profile logging config --quiet
          docker compose --profile tracing --profile logging up -d --build
          for i in $(seq 1 60); do
            [ "$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] && break
            sleep 3
          done

      - name: Trace in Tempo, log line in Loki, Grafana data sources OK
        working-directory: smo
        run: docker compose exec -T r1-termination python3 - < scripts/obs_smoke.py

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose --profile tracing --profile logging ps -a
          docker compose --profile tracing --profile logging logs --no-color --tail=300 tempo loki fluent-bit grafana

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose --profile tracing --profile logging down -v

  # Plan task S1.10 (D8, D10): the stores the converged stack runs on. The stack's Postgres is the TimescaleDB image and `migrate` creates the extension: a
  # hypertable takes rows and gives them back (scripts/timescaledb_roundtrip.sh). The `objectstore` profile (SeaweedFS) and the optional `minio` profile:
  # smo_shared.objectstore creates the three buckets and puts, reads back (SHA-256 equal both ways), lists and deletes an object in each; a wrong key is refused.
  # Not a required check (it is new; ADR 0006 Q3's rule for compose-kafka applies here too).
  compose-stores:
    name: Store profiles round trip (TimescaleDB, SeaweedFS, MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Create the secret files and .env
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env

      - name: Postgres with TimescaleDB, migrated
        working-directory: smo
        run: |
          for profile in objectstore minio kafka; do docker compose --profile "$profile" config --quiet; done
          docker compose up -d --build postgres migrate
          for i in $(seq 1 60); do
            [ "$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] && break
            sleep 3
          done
          docker compose logs migrate | grep -q "timescaledb: created"

      - name: A hypertable insert and select
        working-directory: smo
        run: scripts/timescaledb_roundtrip.sh

      - name: SeaweedFS, three buckets, put and get with the SHA-256
        working-directory: smo
        run: |
          docker compose --profile objectstore up -d --build objectstore objectstore-init
          for i in $(seq 1 60); do
            [ "$(docker compose --profile objectstore ps -a objectstore-init --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] && break
            sleep 3
          done
          docker compose --profile objectstore logs objectstore-init | grep -q "buckets: smo-models, smo-csars, smo-cold-parquet"
          docker compose --profile objectstore run --rm --no-deps objectstore-init python -m smo_shared.objectstore roundtrip
          if docker compose --profile objectstore run --rm --no-deps -e SMO_OBJECTSTORE_SECRET_KEY_FILE= -e SMO_OBJECTSTORE_SECRET_KEY=wrong \
               objectstore-init python -m smo_shared.objectstore roundtrip > wrong-key.log 2>&1; then
            echo "::error::the object store accepted a wrong secret key"; exit 1
          fi
          grep -q "403 SignatureDoesNotMatch" wrong-key.log

      - name: MinIO (optional profile), the same round trip
        working-directory: smo
        run: |
          docker compose --profile minio up -d minio
          docker compose --profile minio run --rm --no-deps minio-init python -m smo_shared.objectstore roundtrip

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose --profile objectstore --profile minio ps -a
          docker compose --profile objectstore --profile minio logs --no-color --tail=200 postgres migrate objectstore objectstore-init minio minio-init

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose --profile objectstore --profile minio down -v

  # ADR 0006 slice 3 (plan task S1.10, D9): the `kafka` profile (one KRaft broker) and the relay in the DME worker, built with the Kafka client (WITH_KAFKA=1).
  # Events published to smo_event come out of smo.events.v1 in order, keyed by their entity, with the CloudEvents headers; with the broker stopped, events wait in
  # Postgres and arrive in order once it is back (scripts/kafka_roundtrip.py). The small variant of ADR 0006 section 5: Postgres, migrate, the broker and one
  # worker image. Not a required check until about 20 green runs (ADR 0006 Q3).
  compose-kafka:
    name: Kafka profile round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
      SMO_WITH_KAFKA: "1"
      SMO_KAFKA_RELAY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Create the secret files and .env
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env

      - name: Broker, topic and the relaying DME worker
        working-directory: smo
        run: |
          docker compose --profile kafka config --quiet
          docker compose --profile kafka up -d --build postgres migrate kafka kafka-init dme-worker
          for i in $(seq 1 60); do
            [ "$(docker compose --profile kafka ps -a kafka-init --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] && break
            sleep 3
          done
          docker compose --profile kafka logs kafka-init | grep -q "smo.events.v1"
          for i in $(seq 1 30); do docker compose logs dme-worker | grep -q '"task": "kafka-relay"' && break; sleep 2; done
          docker compose logs dme-worker | grep -q '"task": "kafka-relay"'

      - name: Published to smo_event, read back from the topic in order, across a broker outage
        working-directory: smo
        run: |
          rt() { docker compose run --rm --no-deps -T -v "$PWD/scripts:/srv/rt:ro" dme-worker python /srv/rt/kafka_roundtrip.py "$@"; }
          subject="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rt publish --subject "$subject" --first 0 --count 5
          rt expect --subject "$subject" --count 5 --timeout 90
          docker compose --profile kafka stop kafka
          rt publish --subject "$subject" --first 5 --count 3
          sleep 10
          docker compose --profile kafka start kafka
          rt expect --subject "$subject" --count 8 --timeout 180

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose --profile kafka ps -a
          docker compose --profile kafka logs --no-color --tail=200 postgres migrate kafka kafka-init dme-worker

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose --profile kafka down -v

  # PR-SEC-2: mutual TLS between the services (docker-compose.mtls.yml). Every service requires a client certificate from the development CA
  # (scripts/mtls_certs.py), every call between modules presents one, and the whole runbook replays over it; a client with no certificate, or with one
  # from another CA, is refused by every service, and plain http gets no answer.
  compose-mtls:
    name: Mutual TLS between the services replays the runbook and refuses a client without a certificate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.mtls.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: docker-compose.mtls.yml is structurally valid
        working-directory: smo
        run: docker compose config --quiet

      - name: Create the secret files, .env and the certificates
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env
          pip install -q cryptography
          python3 scripts/mtls_certs.py init
          python3 scripts/mtls_certs.py status

      - name: docker compose up --build, mTLS on
        working-directory: smo
        env:
          GUI_COOKIE_SECURE: "false"
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            [ "$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] && break
            sleep 3
          done
          # the health check of every mTLS service is `python -m smo_shared.mtls probe`: all of them become healthy over TLS with their own certificate
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format json | jq -rs '[.[] | select(.Health != "" and .Health != "healthy") | .Service] | join(" ")')
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          [ -z "$unhealthy" ] || { echo "::error::not healthy: $unhealthy"; exit 1; }

      - name: Every service requires a client certificate and refuses one without, or from another CA
        working-directory: smo
        run: docker compose exec -T r1-termination python3 - < scripts/compose_mtls_check.py

      - name: The expiry metric is exported
        working-directory: smo
        run: |
          docker compose exec -T sme python3 -c "
          import ssl, urllib.request
          from smo_shared import mtls
          body = urllib.request.urlopen('https://localhost:8000/metrics', context=mtls.client_context(), timeout=10).read().decode()
          lines = [l for l in body.splitlines() if l.startswith('smo_mtls_cert_not_after_timestamp_seconds')]
          print(*lines, sep='\n')
          assert len(lines) == 2"

      - name: Replay DEMO_RUNBOOK §2-§27 over mutual TLS
        working-directory: smo
        # The runbook's driver is a client like any other: it presents the `runbook` certificate. Notification destinations inside the stack are https://
        # in this mode (tests_integration/test_demo_runbook.py); the demo-consumer receiver stays plain HTTP, as an external system would be.
        run: |
          docker run --rm --network smo_default --network-alias demo-consumer \
            -e SMO_E2E_LIVE=1 -e SMO_MTLS=on -e SMO_MTLS_CERT_FILE=/mtls/tls.crt -e SMO_MTLS_KEY_FILE=/mtls/tls.key -e SMO_MTLS_CA_FILE=/mtls/ca.crt \
            -e PYTHONPATH=/work/smo/shared:/work/smo/sdk \
            -v "$PWD/..:/work" -v "$PWD/certs/mtls/runbook:/mtls:ro" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c '
              pip install -q --require-hashes -r requirements/dev.txt &&
              pip install -q --no-deps -e shared &&
              python -m pytest tests_integration/test_demo_runbook.py -v -p no:cacheprovider'

      - name: Rotation with no downtime, tried once (PR-SEC-2.5)
        working-directory: smo
        run: |
          # new leaf certificates from the same CA, then each service restarted in turn while the gateway keeps answering
          python3 scripts/mtls_certs.py renew
          for svc in sme dme rapp-mgmt; do
            docker compose up -d --no-deps --force-recreate "$svc"
            for i in $(seq 1 30); do
              [ "$(docker compose ps "$svc" --format json | jq -rs '.[0].Health')" = "healthy" ] && break
              sleep 3
            done
            docker compose exec -T r1-termination python3 -c "
          import httpx
          from smo_shared import mtls
          assert httpx.get('https://r1-termination:8000/live', verify=mtls.client_context(), timeout=10).status_code == 200"
          done
          # the restarted services (new certificates) and the ones not yet restarted (old ones, same CA) agree with a client that reread its own certificate file
          docker compose exec -T r1-termination python3 - < scripts/compose_mtls_check.py

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose down -v

  # PR-SEC-2.4: Postgres over TLS (docker-compose.pgtls.yml). Postgres serves TLS only (a plain connection is rejected by pg_hba), every service connects with
  # sslmode=verify-full against the development CA (scripts/mtls_certs.py), and a client with another CA or another host name is refused (scripts/pg_tls_check.py).
  compose-pgtls:
    name: Postgres over TLS, clients verify the certificate (verify-full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.pgtls.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: docker-compose.pgtls.yml is structurally valid
        working-directory: smo
        run: docker compose config --quiet

      - name: Create the secret files, .env and the certificates
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env
          pip install -q cryptography
          python3 scripts/mtls_certs.py init
          # a second, unrelated PKI: its CA must be refused by every client
          python3 scripts/mtls_certs.py init --dir "$RUNNER_TEMP/other-pki"

      - name: docker compose up --build, Postgres over TLS
        working-directory: smo
        env:
          GUI_COOKIE_SECURE: "false"
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            [ "$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] && break
            sleep 3
          done
          [ "$(docker compose ps -a migrate --format json | jq -rs '.[0] | "\(.State) \(.ExitCode)"')" = "exited 0" ] || { echo "::error::migrate did not finish over TLS"; exit 1; }
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format json | jq -rs '[.[] | select(.Health != "" and .Health != "healthy") | .Service] | join(" ")')
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          [ -z "$unhealthy" ] || { echo "::error::not healthy: $unhealthy"; exit 1; }

      - name: Every session is encrypted, and Postgres says what it serves
        working-directory: smo
        run: |
          docker compose exec -T postgres psql -U smo -d smo -Atc "show ssl; show hba_file;"
          docker compose exec -T postgres psql -U smo -d smo -Atc "select count(*) filter (where s.ssl), count(*) filter (where not s.ssl) from pg_stat_ssl s join pg_stat_activity a using (pid) where a.datname = 'smo' and a.pid <> pg_backend_pid()" | tee ssl-count.txt
          # services are connected over TLS (more than zero), and none over a plain session
          read ssl plain < <(tr '|' ' ' < ssl-count.txt)
          [ "$ssl" -gt 0 ] && [ "$plain" -eq 0 ] || { echo "::error::sessions over TLS: $ssl, plain: $plain"; exit 1; }

      - name: The right CA connects; another CA, another host name and a plain connection are refused
        working-directory: smo
        run: |
          docker run --rm --network smo_default --user "$(id -u):$(id -g)" \
            -v "$PWD":/smo -w /smo -v "$PWD/secrets/db_password":/run/secrets/db_password:ro \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            "$SMO_IMAGE_PYTHON_3_11_SLIM" \
            sh -c 'pip install --quiet --user --require-hashes -r requirements/runtime.txt && python scripts/pg_tls_check.py --host postgres --ca certs/mtls/postgres/ca.crt --password-file /run/secrets/db_password --expect-plain-refused'

      - name: A service given the wrong CA does not connect
        working-directory: smo
        run: |
          # the migrate service's own image and command, with the CA of the unrelated PKI in place of the right one
          if docker compose run --rm --no-deps -e PGSSLROOTCERT=/run/other-pgtls-ca.crt -v "$RUNNER_TEMP/other-pki/postgres/ca.crt:/run/other-pgtls-ca.crt:ro" migrate python /srv/scripts/migrate.py --current > wrong-ca.log 2>&1; then
            cat wrong-ca.log; echo "::error::a service connected with the wrong CA"; exit 1
          fi
          cat wrong-ca.log
          grep -qi "certificate verify failed" wrong-ca.log || { echo "::error::it failed, but not on the certificate"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 postgres migrate sme r1-termination

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose down -v

  # PR-SB-1.3/1.4: a real NETCONF-over-SSH server (Netopeer2, profile `netconf-lab`) answers the SSH session wrapper of RAN NF OAM.
  netconf-lab:
    name: NETCONF lab (netopeer2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install the runtime dependencies (paramiko among them)
        working-directory: smo
        run: pip install --require-hashes -r requirements/runtime.txt

      - name: Start the lab server
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env
          docker compose --profile netconf-lab up -d netconf-lab

      - name: Wait for SSH and record the host key
        working-directory: smo
        run: |
          for i in $(seq 1 60); do
            ssh-keyscan -p 8830 127.0.0.1 > "$RUNNER_TEMP/lab_known_hosts" 2>/dev/null && [ -s "$RUNNER_TEMP/lab_known_hosts" ] && break
            sleep 2
          done
          cat "$RUNNER_TEMP/lab_known_hosts"
          [ -s "$RUNNER_TEMP/lab_known_hosts" ]

      # PR-SB-2.5: the lab also listens for NETCONF over TLS on 6513 with a throwaway PKI it wrote to netconf-lab/pki; the check reads, writes and
      # gets a refusal over it with the client certificate
      - name: get-config over the SSH session wrapper, and a read, a write and a refusal over TLS
        working-directory: smo
        env:
          NETCONF_SSH_PASSWORD: netconf
          PYTHONPATH: ran-nf-oam:shared
          NETCONF_LAB_TLS_URI: tls://127.0.0.1:6513?model=smo-lab
          NETCONF_CRED_LABTLS_CERT_FILE: netconf-lab/pki/client.crt
          NETCONF_CRED_LABTLS_KEY_FILE: netconf-lab/pki/client.key
          NETCONF_CRED_LABTLS_CA_FILE: netconf-lab/pki/ca.crt
        run: |
          export NETCONF_SSH_KNOWN_HOSTS="$RUNNER_TEMP/lab_known_hosts"
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/6513) 2>/dev/null && break; sleep 1; done
          ls -l netconf-lab/pki
          python scripts/netconf_lab_check.py

      # PR-SB-1.9: runbook section 7 (register, heartbeat, CM write, read back, history, partial failure, refusal) through RAN NF OAM's own
      # routes over SSH, with the model payload and the candidate datastore
      - name: Runbook CM write against the lab server
        working-directory: smo
        env:
          NETCONF_CRED_LAB_PASSWORD: netconf          # the endpoint's own credential (PR-SB-2): there is no shared NETCONF_SSH_PASSWORD here
          PYTHONPATH: ran-nf-oam:shared
        run: |
          export NETCONF_SSH_KNOWN_HOSTS="$RUNNER_TEMP/lab_known_hosts"
          python scripts/netconf_lab_runbook.py 2>&1 | grep -E "^(ok|FAIL|OK|FAILED|  server said|  pinned)"; test "${PIPESTATUS[0]}" -eq 0

      - name: Dump the lab logs on failure
        if: failure()
        working-directory: smo
        run: docker compose --profile netconf-lab logs --no-color netconf-lab

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose --profile netconf-lab down -v

  # S0.15 (ADR 0012): the O-RAN-SC simulator (sim-o1-ofhmp-interfaces, m-release) in the compose profile `oran-sim`, two simulated O-DUs built from the pinned
  # source, against the real RAN NF OAM container. scripts/oran_sim_check.py takes the three paths of S0.15 (a: NETCONF, b: a VES stndDefined alarm, c: file-ready
  # PM) and the registration; a step today's code cannot do yet is XFAIL, "expected to fail until PR-CONV-S3.xx", so the job stays green and names what is missing,
  # and one that starts to pass (XPASS) fails the job until its marking is removed. No module code is changed to make a step pass (that is Stage 3).
  oran-sim:
    name: O-RAN-SC simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
      ORAN_SIM_COUNT: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Create the secret files, .env and the listener's password
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env
          ves=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::add-mask::$ves"
          echo "RAN_NF_OAM_VES_PASSWORD=$ves" >> "$GITHUB_ENV"
          echo "ORAN_SIM_NETCONF_PASSWORD=netconf!" >> "$GITHUB_ENV"     # the simulator image's built-in, public password (oran-sim/Dockerfile)

      # Builds RAN NF OAM (and the database and migration it needs) and the simulator image from O-RAN-SC's m-release source (oran-sim/Dockerfile: about ten
      # minutes, libyang, sysrepo, libnetconf2 and netopeer2 are compiled), then starts two simulated O-DUs.
      - name: docker compose --profile oran-sim up --build oran-sim-du
        working-directory: smo
        run: |
          docker compose --profile oran-sim config --quiet
          docker compose --profile oran-sim up -d --build oran-sim-du
          docker compose --profile oran-sim ps -a

      # The simulators post their pnfRegistration at start and a notifyFileReady every 60 s (a PM file per log period): wait for one fileReady from each, then copy
      # each simulator's log (DEBUG, it holds every VES event it posted) for the check
      - name: Wait for a PM period, and copy the simulators' logs
        working-directory: smo
        run: |
          for i in $(seq 1 "$ORAN_SIM_COUNT"); do
            for t in $(seq 1 60); do
              docker compose exec -T --index "$i" oran-sim-du grep -q PyNTS_FileReady /var/log/pynts.log 2>/dev/null && break
              sleep 5
            done
            docker compose exec -T --index "$i" oran-sim-du cat /var/log/pynts.log > "$RUNNER_TEMP/oran-sim-$i.log"
            echo "simulator $i: $(grep -c ' ves: POST ' "$RUNNER_TEMP/oran-sim-$i.log") VES events posted"
          done

      - name: Registration, NETCONF, VES stndDefined alarm and file-ready PM (scripts/oran_sim_check.py)
        working-directory: smo
        run: |
          logs=""
          for i in $(seq 1 "$ORAN_SIM_COUNT"); do logs="$logs --sim-log /logs/oran-sim-$i.log"; done
          docker run --rm --network smo_default \
            -e RAN_NF_OAM_VES_PASSWORD -e NETCONF_CRED_ORANSIM_PASSWORD="$ORAN_SIM_NETCONF_PASSWORD" -e PYTHONPATH=/work/smo/ran-nf-oam:/work/smo/shared \
            -v "$PWD/..:/work" -v "$RUNNER_TEMP:/logs" -w /work/smo "$SMO_IMAGE_PYTHON_3_11_SLIM" sh -c "
              pip install -q --require-hashes -r requirements/runtime.txt &&
              python scripts/oran_sim_check.py --oam-url http://ran-nf-oam:8000 $logs --summary /logs/oran-sim-summary.md"

      - name: Result table in the job summary
        if: always()
        run: cat "$RUNNER_TEMP/oran-sim-summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Dump logs on failure
        if: failure()
        working-directory: smo
        run: |
          docker compose --profile oran-sim ps -a
          docker compose --profile oran-sim logs --no-color --tail=200 ran-nf-oam oran-sim-du
          for f in "$RUNNER_TEMP"/oran-sim-*.log; do echo "== $f"; tail -n 80 "$f"; done

      - name: Tear down
        if: always()
        working-directory: smo
        run: docker compose --profile oran-sim down -v

  o1-conformance:
    name: O1 adaptor conformance kit passes the mock adaptor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install the runtime dependencies
        working-directory: smo
        run: pip install --require-hashes -r requirements/runtime.txt && pip install --no-deps -e shared

      # PR-SB-9.7: the kit is run over real HTTP against the mock adaptor as a process (the unit tests run it in process). Twice, against the same process: a run
      # leaves objects behind and the second must not meet them.
      - name: Start the mock adaptor and run the kit twice
        working-directory: smo
        run: |
          (cd mock-o1-adaptor && PYTHONPATH=.:../shared nohup python -m uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/mock.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8000/live && break; sleep 1; done
          python -m conformance.o1 --adaptor http://localhost:8000 --out "$RUNNER_TEMP/o1-conformance"
          python -m conformance.o1 --adaptor http://localhost:8000 --protocol both
          { echo "### O1 adaptor conformance, the mock adaptor"; echo; cat "$RUNNER_TEMP/o1-conformance.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: The report is kept
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: o1-conformance-report
          path: ${{ runner.temp }}/o1-conformance.*
          if-no-files-found: warn

  migration-postgres:
    name: Consolidated migration applies to real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2          # the previous commit is needed by the upgrade check (PR-OPS-1.6)

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      # Postgres 18 used to be a `services:` container; the runner pulls those before any step, so the image cannot be chosen (mirror or Docker Hub) from the
      # step above. It is started here instead, with the same user, database, port and health check.
      - name: Start Postgres 18
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=smo -e POSTGRES_PASSWORD=smo -e POSTGRES_DB=smo \
            --health-cmd "pg_isready -U smo" --health-interval 5s --health-timeout 3s --health-retries 10 \
            "$SMO_IMAGE_POSTGRES_18_ALPINE"
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = "healthy" ] && break; sleep 2; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = "healthy" ]


      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install shared library + service dependencies
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          pip install --no-deps -e shared

      # PR-OPS-1: the schema is created by the migration history (Alembic), not by applying the SQL file directly
      - name: Migrate the empty database to head
        working-directory: smo
        env:
          SMO_DATABASE_URL: postgresql+psycopg://smo:smo@localhost:5432/smo
        run: python scripts/migrate.py

      - name: Every table from the schema actually exists
        env:
          PGPASSWORD: smo
        run: |
          # the tables of the modules live in schemas of their own (0023 to 0025), and since 0029 `public` holds no view of them: count the base tables of every schema
          count=$(psql -h localhost -U smo -d smo -t -c "select count(*) from information_schema.tables where table_type = 'BASE TABLE' and table_schema not in ('pg_catalog', 'information_schema')")
          echo "Tables created: $count"
          [ "$count" -ge 30 ]
          views=$(psql -h localhost -U smo -d smo -t -c "select count(*) from information_schema.views where table_schema = 'public'")
          echo "Views left in public: $views"
          [ "$views" -eq 0 ]

      - name: Every ORM-declared column actually exists in the migrated schema, with matching nullability
        working-directory: smo
        env:
          SMO_DATABASE_URL: postgresql+psycopg://smo:smo@localhost:5432/smo
        run: python scripts/check_migration_matches_models.py

      # PR-OPS-1.2/1.3: a fresh database and a hand-created (stamped) one reach the same schema; the models check refuses a database not at head
      - name: Migration history, stamping and the models check
        working-directory: smo
        env:
          SMO_TEST_POSTGRES_URL: postgresql+psycopg://smo:smo@localhost:5432/smo
        run: |
          pip install --require-hashes -r requirements/dev.txt
          PYTHONPATH=shared python -m pytest tests_integration/test_migrations.py -v

      # The Postgres-only tests of tests_integration (they skip without SMO_TEST_POSTGRES_URL, so the SQLite job never ran them): per-module roles,
      # the status constraints of CM jobs (revision 0026), and every CHECK list against the code that writes the column (PR-V-5)
      - name: Roles, and every CHECK constraint against the code that writes it
        working-directory: smo
        env:
          SMO_TEST_POSTGRES_URL: postgresql+psycopg://smo:smo@localhost:5432/smo
        run: |
          PYTHONPATH=shared python -m pytest tests_integration/test_db_roles.py tests_integration/test_status_checks.py tests_integration/test_check_constraints.py -v

      # PR-OPS-1.6: the previous commit's schema (its own scripts/migrate.py, on an empty database) upgrades to this commit's head
      - name: A database at the previous commit's schema upgrades to this commit's head
        working-directory: smo
        env:
          PGPASSWORD: smo
          SMO_DATABASE_URL: postgresql+psycopg://smo:smo@localhost:5432/upgrade
        run: |
          psql -h localhost -U smo -d smo -c "CREATE DATABASE upgrade"
          scripts/check_upgrade_from_previous.sh

      # PR-ST-2 to -8: the races on a versioned row, on one Idempotency-Key, on a module's shared invoker and on the GUI BFF's shared state, the server-side statement and idle-transaction limits, and (PR-MSG-3) the event feed's NOTIFY at commit waking a LISTEN, on the real database.
      # PR-CONV-S1.1, S1.2, S1.4: the ProvMnS router (smo_shared.mns) for every operation, scope, filter and paging, its property tests, and its Alembic helper, each in a schema of its own.
      - name: Concurrency, idempotency and shared state under real Postgres
        working-directory: smo/shared
        env:
          SMO_TEST_POSTGRES_URL: postgresql+psycopg://smo:smo@localhost:5432/smo
        run: |
          pip install --require-hashes -r ../requirements/dev.txt
          PYTHONPATH=. python -m pytest tests/test_versioning.py tests/test_idempotency.py tests/test_module_identity.py tests/test_db_engine.py tests/test_health.py tests/test_single_runner.py tests/test_events.py -v
          PYTHONPATH=. python -m pytest tests/test_mns_router.py tests/test_mns_scope.py tests/test_mns_properties.py tests/test_mns_store.py -v
          (cd ../gui-bff && PYTHONPATH=.:../shared python -m pytest tests/test_shared_state.py -v)

  # PR-OPS-5.2: the previous release's code on this commit's schema. A rolling upgrade runs both versions against one database, so a revision that
  # removes or renames something the last release uses breaks it. Heavy (builds the previous release), so on a pull request it runs only when
  # the PR changes smo/migrations; on a push to main and by hand it always runs. Where it does not run it is a passing job, not a missing one.
  previous-release-compat:
    name: Previous release's code runs on the new schema
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Does this change touch the schema?
        id: gate
        run: |
          # Rewrite mode (smo/scripts/rewrite_mode.json, plan task S0.8): until 1.0 a revision may drop or rename in one step, and nothing is kept for
          # 0.9.0, so this comparison with the previous release is paused: the job prints a notice naming the file and passes. S8.8 switches it back on.
          if python3 smo/scripts/rewrite_mode.py notice "Previous release's code runs on the new schema"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
               smo/migrations smo/scripts/check_previous_release_code.sh; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "neither smo/migrations nor this check changed in this pull request: nothing to prove"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        if: steps.gate.outputs.run == 'true'
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install the runtime dependencies (migrate.py runs on the host)
        if: steps.gate.outputs.run == 'true'
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          pip install --no-deps -e shared

      - name: Build the previous release, start it on this commit's schema, replay its runbook
        if: steps.gate.outputs.run == 'true'
        working-directory: smo
        env:
          REQUIRE_PREVIOUS_RELEASE: "1"        # a release exists: not finding its tag is a failure, never a skip
        run: scripts/check_previous_release_code.sh


  # PR-OPS-10.5: the upgrade an operator does. The previous release is installed and given data by its own runbook, stopped, and this commit's stack
  # (its `migrate` service) starts on the same database; the data must still be there and the stack must answer. Its control seeds a migration that
  # passes on an empty database and fails on real data, and the upgrade must refuse it. Same gate as the job above: heavy, so on a pull request it
  # runs only when the PR changes smo/migrations; on a push to main and by hand it always runs.
  upgrade-from-previous-release:
    name: Upgrade from the previous release keeps its data
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Does this change touch the schema?
        id: gate
        run: |
          # Rewrite mode (smo/scripts/rewrite_mode.json, plan task S0.8): until 1.0 a revision may drop or rename in one step, and nothing is kept for
          # 0.9.0, so this comparison with the previous release is paused: the job prints a notice naming the file and passes. S8.8 switches it back on.
          if python3 smo/scripts/rewrite_mode.py notice "Upgrade from the previous release keeps its data"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
               smo/migrations smo/scripts/check_upgrade_from_previous_release.sh .github/workflows/smo-tests.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "neither smo/migrations nor this check changed in this pull request: nothing to prove"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        if: steps.gate.outputs.run == 'true'
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install the runtime dependencies (migrate.py runs on the host)
        if: steps.gate.outputs.run == 'true'
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          pip install --no-deps -e shared

      - name: Install the previous release, put data in it, upgrade to this commit
        if: steps.gate.outputs.run == 'true'
        working-directory: smo
        env:
          REQUIRE_PREVIOUS_RELEASE: "1"        # a release exists: not finding its tag is a failure, never a skip
        run: scripts/check_upgrade_from_previous_release.sh

  # PR-OPS-2.8/2.9: the Helm chart installs on a real cluster (kind), the stack answers, and an upgrade rolls every module without a failed pod.
  # The images are built from the checkout and loaded into the cluster, so the chart is proved against the code in the pull request, not a release.
  helm:
    name: Helm chart installs on kind and upgrades
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: helm lint, and the chart renders with its options on
        working-directory: smo
        run: |
          helm version --short
          helm lint deploy/helm/smo --kube-version 1.30.0
          helm lint deploy/helm/smo --kube-version 1.30.0 -f deploy/helm/smo/ci/kind-values.yaml
          helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 \
            --set podDisruptionBudget.enabled=true --set autoscaling.enabled=true \
            --set ingress.enabled=true --set ingress.gui.host=gui.example.com --set ingress.r1.host=r1.example.com >/dev/null
          # per-module roles (PR-DB-2.6): the pod holds its role's file and not the owner's; off, the owner's; the Secret is a hook resource
          helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 | grep -q 'path: db_password_onboarding'
          helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 | grep -q 'helm.sh/hook: pre-install,pre-upgrade'
          if helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 --set databaseRoles.enabled=false | grep -q 'db_password_onboarding'; then echo "::error::roles off, and the owner's password is still not the only one mounted"; exit 1; fi
          if helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 --set databaseRoles.enabled=false | grep -q 'smo-role-secrets'; then echo "::error::roles off, and a role Secret is still rendered"; exit 1; fi
          # placement (PR-HA-5): soft by default, hard on request, none when off, and a mode that is not one of these is refused
          helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 | grep -q 'whenUnsatisfiable: ScheduleAnyway'
          if helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 | grep -q 'DoNotSchedule'; then echo "::error::the default placement is not soft"; exit 1; fi
          helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 --set placement.mode=hard | grep -q 'whenUnsatisfiable: DoNotSchedule'
          helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 --set placement.zoneKey=topology.kubernetes.io/zone | grep -q 'topologyKey: topology.kubernetes.io/zone'
          [ "$(helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 --set placement.mode=off | grep -c topologySpreadConstraints)" = "0" ]
          if helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 --set placement.mode=sideways >/dev/null 2>&1; then echo "::error::a placement mode that is not soft, hard or off was accepted"; exit 1; fi

      # PR-OPS-6 and PR-OBS-3/6: the GitOps overlays build (the runner has kustomize), and the traces and logs stack renders
      - name: GitOps overlays build, and the observability stack renders
        working-directory: smo
        run: |
          kustomize version
          for overlay in lab staging prod; do
            kustomize build --enable-helm deploy/gitops/overlays/$overlay >/dev/null
          done
          helm lint deploy/helm/smo --kube-version 1.30.0 --set observability.tempo.enabled=true --set observability.loki.enabled=true \
            --set observability.grafana.enabled=true --set observability.fluentBit.enabled=true
          helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 --set observability.tempo.enabled=true | grep -q 'SMO_OTEL_ENDPOINT'
          if helm template smo deploy/helm/smo -n smo --kube-version 1.30.0 | grep -q 'SMO_OTEL_ENDPOINT'; then echo "::error::spans are on by default"; exit 1; fi

      - name: Build the images from this checkout
        working-directory: smo
        run: |
          pip install --quiet pyyaml
          python scripts/release_images.py matrix | jq -c '.include[]' | while read -r row; do
            name=$(jq -r .name <<<"$row"); context=$(jq -r .context <<<"$row"); module=$(jq -r .module <<<"$row")
            echo "::group::smo-$name"
            # the base images named in this Dockerfile that the GHCR mirror holds (docs/MIRROR.md); none when the mirror is off
            mapfile -t mirror < <(python3 scripts/ci_mirror.py build-contexts "$context")
            if [ -n "$module" ]; then
              docker build --quiet -t "local/smo-$name:ci" "${mirror[@]}" --build-arg "MODULE=$module" "$context"
            else
              docker build --quiet -t "local/smo-$name:ci" "${mirror[@]}" "$context"
            fi
            echo "::endgroup::"
          done
          docker image ls 'local/smo-*'

      - name: Create the cluster and load the images
        run: |
          kind create cluster --name smo --image "$SMO_IMAGE_KIND_NODE_V1_37_0" --wait 120s
          images=$(docker image ls 'local/smo-*' --format '{{.Repository}}:{{.Tag}}')
          kind load docker-image --name smo $images

      - name: helm install (the migration Job runs, every pod waits for the schema, every pod becomes ready)
        working-directory: smo
        run: |
          helm install smo deploy/helm/smo -n smo --create-namespace -f deploy/helm/smo/ci/kind-values.yaml -f .ci-mirror/helm-values.yaml --wait --timeout 12m
          kubectl -n smo get pods
          kubectl -n smo wait --for=condition=complete job/migrate --timeout=60s
          head=$(ls migrations/versions | grep -oE '^[0-9]+' | sort | tail -1)
          at=$(kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "SELECT version_num FROM alembic_version")
          echo "database at $at, repository head $head"
          [ "$at" = "$head" ]

      - name: Every service up, R1 gate answers
        working-directory: smo
        run: kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py

      - name: Caller roles through the gateway (PR-SEC-14)
        working-directory: smo
        run: kubectl -n smo exec -i deploy/sme -- python3 - < scripts/compose_e2e_roles.py

      - name: The audit trail holds those calls and its chain verifies (PR-SEC-11)
        run: |
          rows=$(kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "SELECT count(*) FROM audit_log")
          echo "audit rows: $rows"
          [ "$rows" -gt 0 ]
          kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify

      - name: rApp credentials reach a Secret, are replaced on rotation and deleted, and the pod cannot read Secrets back
        working-directory: smo
        run: |
          kubectl -n smo exec -i deploy/rapp-mgmt -- python3 - deliver < scripts/k8s_credential_delivery_check.py
          [ "$(kubectl -n smo get secret rapp-ci-check-credentials -o jsonpath='{.data.SMO_INVOKER_SECRET}' | base64 -d)" = "secret-two" ]
          [ "$(kubectl -n smo get secret rapp-ci-check-credentials -o jsonpath='{.data.SMO_IDENTITY_KIND}' | base64 -d)" = "rapp" ]
          kubectl -n smo exec -i deploy/rapp-mgmt -- python3 - withdraw < scripts/k8s_credential_delivery_check.py
          if kubectl -n smo get secret rapp-ci-check-credentials; then echo "::error::the rApp credentials Secret was not withdrawn"; exit 1; fi

      - name: A pod of the rApps does not hold the enrollment secret
        run: |
          for rapp in energy-saving-rapp mobility-optimization-rapp coverage-optimization-rapp traffic-steering-rapp; do
            if kubectl -n smo exec "deploy/$rapp" -- ls /run/secrets/enrollment_secret 2>/dev/null; then
              echo "::error::$rapp can read the enrollment secret"; exit 1
            fi
          done

      - name: helm upgrade rolls every module with the old pods serving, and the database stays
        working-directory: smo
        run: |
          kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "SELECT count(*) FROM alembic_version"
          helm upgrade smo deploy/helm/smo -n smo -f deploy/helm/smo/ci/kind-values.yaml -f .ci-mirror/helm-values.yaml --set moduleDefaults.resources.requests.cpu=60m --wait --timeout 12m
          helm history smo -n smo
          for d in $(kubectl -n smo get deploy -o name); do kubectl -n smo rollout status "$d" --timeout=120s; done
          kubectl -n smo get pods
          # an old pod the rollout has replaced is still Terminating for its preStop delay and its drain (about 25 s); that is the rollout working, not a failed pod
          [ "$(kubectl -n smo get pods --no-headers | grep -vE 'Running|Completed|Terminating' | wc -l)" = "0" ]
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py

      - name: Every module with a role runs as it, and the role can use its schema and nothing else (PR-DB-2.6, 2.7)
        working-directory: smo
        run: |
          psql() { kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "$1"; }
          roles="$(python3 -c "import json; print(*[m.rsplit('/', 1)[-1] for m in json.load(open('migrations/db_roles.json')) if m != '_comment'])")"
          echo "modules with a role: $roles"
          for name in $roles; do
            role="smo_${name//-/_}"
            pw="$(kubectl -n smo get secret smo-role-secrets -o jsonpath="{.data.db-password-$name}" | base64 -d)"
            # the pod is configured to connect as the role (a reference rApp that has served no request holds no connection yet, so the connection itself is not asked for), and the role can log in
            [ "$(kubectl -n smo exec "deploy/$name" -- printenv SMO_DATABASE_URL | sed -E 's#^[^/]*//([^@:]*).*#\1#')" = "$role" ] || { echo "::error::$name is not configured to connect as $role"; exit 1; }
            [ "$(kubectl -n smo exec postgres-0 -- env PGPASSWORD="$pw" psql -h postgres -U "$role" -d smo -Atc 'SELECT 1')" = "1" ] || { echo "::error::$role cannot log in with the password the pod holds"; exit 1; }
            for table in $(scripts/db_roles_denied.py "$name"); do
              if kubectl -n smo exec postgres-0 -- env PGPASSWORD="$pw" psql -h postgres -U "$role" -d smo -Atc "SELECT count(*) FROM $table" 2>/dev/null; then
                echo "::error::$role can read $table"; exit 1
              fi
            done
            # the pod holds its own role's password and not the owner's
            if kubectl -n smo exec "deploy/$name" -- ls /run/secrets/db_password 2>/dev/null; then echo "::error::$name holds the owner's password"; exit 1; fi
          done

      - name: Roles can be turned off and on again on a running release (PR-DB-2.6)
        working-directory: smo
        run: |
          psql() { kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "$1"; }
          # off: every module connects as the owner again, and the stack answers
          helm upgrade smo deploy/helm/smo -n smo -f deploy/helm/smo/ci/kind-values.yaml -f .ci-mirror/helm-values.yaml --set databaseRoles.enabled=false --wait --timeout 12m
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py
          # on: the role passwords already exist (the Secret is kept) and the pods move to them
          helm upgrade smo deploy/helm/smo -n smo -f deploy/helm/smo/ci/kind-values.yaml -f .ci-mirror/helm-values.yaml --wait --timeout 12m
          for i in $(seq 1 30); do
            [ "$(psql "SELECT count(*) FROM pg_stat_activity WHERE usename = 'smo_onboarding'")" -gt 0 ] && break
            sleep 2
          done
          [ "$(psql "SELECT count(*) FROM pg_stat_activity WHERE usename = 'smo_onboarding'")" -gt 0 ]
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py

      - name: Two replicas of every module that can have them, and the stack still answers (PR-HA-1)
        working-directory: smo
        run: |
          helm upgrade smo deploy/helm/smo -n smo -f deploy/helm/smo/ci/kind-values.yaml -f .ci-mirror/helm-values.yaml -f deploy/helm/smo/ci/ha-values.yaml --wait --timeout 12m
          kubectl -n smo get pods -o wide
          for d in r1-termination sme dme rapp-mgmt ran-nf-oam ran-nf-oam-worker gui; do
            [ "$(kubectl -n smo get deploy "$d" -o jsonpath='{.status.readyReplicas}')" = "2" ] || { echo "::error::$d does not have two ready replicas"; exit 1; }
          done
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py
          kubectl -n smo exec -i deploy/sme -- python3 - < scripts/compose_e2e_roles.py
          kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify

      - name: Calls to a service are spread over its replicas (load balancing)
        working-directory: smo
        run: |
          health_count() { kubectl -n smo exec -i "$1" -- python3 - < scripts/k8s_route_count.py; }
          for svc in sme dme rapp-mgmt ran-nf-oam r1-termination nfo focom; do
            pods=$(kubectl -n smo get pods -l "app.kubernetes.io/name=$svc" --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}')
            declare -A before=()
            # the gateway answers an unknown path before its metrics see it, so it is asked for /bootstrap, which it counts
            path=/lb-check; [ "$svc" = r1-termination ] && path=/bootstrap
            for p in $pods; do before[$p]=$(health_count "$p"); done
            kubectl -n smo exec deploy/sme -- python3 -c "import httpx; [httpx.get('http://$svc:8000$path', timeout=5) for _ in range(80)]"
            for p in $pods; do
              after=$(health_count "$p")
              echo "$svc: $p served $((after - before[$p])) of 80"
              [ $((after - before[$p])) -ge 10 ] || { echo "::error::$p served fewer than 10 of the 80 calls to $svc: the Service does not spread over its replicas"; exit 1; }
            done
            unset before
          done

      - name: Restart every deployment, one at a time, while the services are probed (PR-HA-2)
        working-directory: smo
        run: |
          kubectl -n smo run probe --image=local/smo-sme:ci --image-pull-policy=Never --restart=Never -- python3 -c "$(cat scripts/k8s_rolling_probe.py)"
          kubectl -n smo wait --for=condition=Ready pod/probe --timeout=120s
          # the ones that roll without a gap: every deployment but those holding a volume
          for d in $(kubectl -n smo get deploy -o json | jq -r '.items[] | select(.spec.strategy.type == "RollingUpdate") | .metadata.name'); do
            echo "restarting $d"
            kubectl -n smo rollout restart "deploy/$d"
            kubectl -n smo rollout status "deploy/$d" --timeout=180s
          done
          kubectl -n smo exec probe -- touch /tmp/stop
          kubectl -n smo wait --for=jsonpath='{.status.phase}'=Succeeded pod/probe --timeout=90s || { kubectl -n smo logs probe; exit 1; }
          kubectl -n smo logs probe

      - name: Kill the delivery workers in the middle of a batch; no notification is lost (PR-HA-4.1)
        working-directory: smo
        run: |
          kubectl -n smo run sink --image=local/smo-sme:ci --image-pull-policy=Never --restart=Never --port=9000 -- python3 -c "$(cat scripts/k8s_delivery_sink.py)"
          kubectl -n smo wait --for=condition=Ready pod/sink --timeout=120s
          kubectl -n smo expose pod sink --port 9000
          # 100 notifications, all due now, for a destination that takes 0.3 s each: about 30 s of work for the sweep
          kubectl -n smo exec postgres-0 -- psql -U smo -d smo -c "INSERT INTO notification_outbox (module, destination, payload, status, attempts, next_attempt_at) SELECT 'ci-failover', 'http://sink:9000/n/' || g, jsonb_build_object('i', g), 'PENDING', 0, now() FROM generate_series(1, 100) g"
          count() { kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "SELECT count(*) FROM notification_outbox WHERE module = 'ci-failover' AND status = '$1'"; }
          received() { kubectl -n smo exec sink -- python3 -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:9000/count').read().decode())"; }
          for i in $(seq 1 60); do
            [ "$(received | cut -d' ' -f1)" -ge 10 ] && break
            sleep 1
          done
          echo "sink has: $(received); still pending: $(count PENDING)"
          [ "$(count PENDING)" -gt 0 ] || { echo "::error::the batch was already finished, so killing the workers proves nothing"; exit 1; }
          kubectl -n smo delete pod -l app.kubernetes.io/name=ran-nf-oam-worker --force --grace-period=0
          for i in $(seq 1 72); do
            [ "$(count PENDING)" = "0" ] && break
            sleep 5
          done
          echo "sent: $(count SENT), pending: $(count PENDING), dead: $(count DEAD)"
          read -r total distinct <<<"$(received)"
          echo "the sink received $total posts for $distinct distinct notifications ($((total - distinct)) duplicates, which at-least-once allows)"
          [ "$(count SENT)" = "100" ] && [ "$distinct" = "100" ]
          kubectl -n smo exec postgres-0 -- psql -U smo -d smo -c "DELETE FROM notification_outbox WHERE module = 'ci-failover'"

      - name: A staged CM job waits for the job runner while it is gone, and finishes when it is back (PR-HA-4.2)
        working-directory: smo
        run: |
          run() { kubectl -n smo exec -i deploy/sme -- python3 - "$@" < scripts/k8s_staged_job_failover.py; }
          started=$(run start) || { echo "$started"; exit 1; }
          job=$(tail -1 <<<"$started")
          echo "job $job: wave 1 of 3 done, 20 s pause before wave 2"
          kubectl -n smo scale deploy/ran-nf-oam-worker --replicas=0
          kubectl -n smo wait --for=delete pod -l app.kubernetes.io/name=ran-nf-oam-worker --timeout=90s
          sleep 30                                   # the pause is over; only the worker would advance the job
          run stalled "$job"
          kubectl -n smo scale deploy/ran-nf-oam-worker --replicas=2
          kubectl -n smo rollout status deploy/ran-nf-oam-worker --timeout=120s
          run finish "$job"

      - name: What the cluster says, when it went wrong
        if: failure()
        run: |
          kubectl -n smo get pods,jobs,events --sort-by=.lastTimestamp | tail -80 || true
          for pod in $(kubectl -n smo get pods --no-headers | grep -vE 'Running|Completed' | cut -d' ' -f1); do
            echo "::group::$pod"; kubectl -n smo describe pod "$pod" | tail -40; kubectl -n smo logs "$pod" --all-containers --tail=60 || true; echo "::endgroup::"
          done
          kubectl -n smo logs job/migrate --tail=80 || true
          for d in ran-nf-oam ran-nf-oam-worker sme; do echo "::group::$d"; kubectl -n smo logs "deploy/$d" --tail=60 || true; echo "::endgroup::"; done

      - name: helm uninstall
        run: helm uninstall smo -n smo

  postgres-ha:
    name: Postgres HA (CloudNativePG, three instances) and a primary failover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Build the images from this checkout
        working-directory: smo
        run: |
          pip install --quiet pyyaml
          python scripts/release_images.py matrix | jq -c '.include[]' | while read -r row; do
            name=$(jq -r .name <<<"$row"); context=$(jq -r .context <<<"$row"); module=$(jq -r .module <<<"$row")
            # the base images named in this Dockerfile that the GHCR mirror holds (docs/MIRROR.md); none when the mirror is off
            mapfile -t mirror < <(python3 scripts/ci_mirror.py build-contexts "$context")
            if [ -n "$module" ]; then
              docker build --quiet -t "local/smo-$name:ci" "${mirror[@]}" --build-arg "MODULE=$module" "$context"
            else
              docker build --quiet -t "local/smo-$name:ci" "${mirror[@]}" "$context"
            fi
          done
          docker image ls 'local/smo-*'

      - name: Create the cluster and load the images
        run: |
          kind create cluster --name smo --image "$SMO_IMAGE_KIND_NODE_V1_37_0" --wait 120s
          images=$(docker image ls 'local/smo-*' --format '{{.Repository}}:{{.Tag}}')
          kind load docker-image --name smo $images

      - name: Install the CloudNativePG operator (pinned, and its manifest checked)
        run: |
          curl -fsSL -o cnpg.yaml https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.25.1/cnpg-1.25.1.yaml
          echo "ece141801fef6507451a3032b1eda29e9fa15944b741fa7301701c781160ce41  cnpg.yaml" | sha256sum -c -
          kubectl apply --server-side -f cnpg.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=180s

      - name: A three-instance cluster, one primary and two replicas streaming from it (PR-DB-7.2)
        run: |
          kubectl create namespace smo
          # the owner's password is the one the chart will be given, so the same Secret serves both
          kubectl -n smo create secret generic smo-secrets --from-literal=db-password=ci-ha-owner-password --from-literal=enrollment-secret="$(openssl rand -hex 24)"
          kubectl -n smo apply -f smo/deploy/helm/smo/ci/cnpg-cluster.yaml
          kubectl -n smo wait --for=condition=Ready cluster/smo-pg --timeout=600s
          kubectl -n smo get cluster smo-pg
          [ "$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.readyInstances}')" = "3" ]
          primary=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.currentPrimary}')
          psql() { kubectl -n smo exec "$primary" -c postgres -- psql -U postgres -d smo -Atc "$1"; }
          for i in $(seq 1 30); do
            [ "$(psql "SELECT count(*) FROM pg_stat_replication WHERE state = 'streaming'")" = "2" ] && break
            sleep 2
          done
          [ "$(psql "SELECT count(*) FROM pg_stat_replication WHERE state = 'streaming'")" = "2" ]
          echo "primary $primary, two replicas streaming"

      - name: helm install against it, with the primary and the replicas in the host list and target_session_attrs=read-write (PR-DB-7.3)
        working-directory: smo
        run: |
          # the replicas first: the driver must skip them and settle on the one that accepts writes
          helm install smo deploy/helm/smo -n smo -f deploy/helm/smo/ci/kind-values.yaml -f deploy/helm/smo/ci/cnpg-values.yaml \
            --set 'postgres.external.host=smo-pg-ro\,smo-pg-rw' --set postgres.external.targetSessionAttrs=read-write --wait --timeout 12m
          kubectl -n smo get pods
          kubectl -n smo wait --for=condition=complete job/migrate --timeout=60s
          kubectl -n smo exec deploy/sme -- printenv SMO_DATABASE_URL
          primary=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.currentPrimary}')
          head=$(ls migrations/versions | grep -oE '^[0-9]+' | sort | tail -1)
          at=$(kubectl -n smo exec "$primary" -c postgres -- psql -U postgres -d smo -Atc "SELECT version_num FROM alembic_version")
          echo "database at $at, repository head $head"
          [ "$at" = "$head" ]

      - name: The stack answers on it, and the roles hold (PR-DB-7.2)
        working-directory: smo
        run: |
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py
          kubectl -n smo exec -i deploy/sme -- python3 - < scripts/compose_e2e_roles.py
          kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify
          primary=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.currentPrimary}')
          psql() { kubectl -n smo exec "$primary" -c postgres -- psql -U postgres -d smo -Atc "$1"; }
          # every module's session is its own role's, and none is the owner's
          [ "$(psql "SELECT count(*) FROM pg_stat_activity WHERE usename = 'smo_onboarding'")" -gt 0 ]
          # a replica has what the primary has
          replica=$(kubectl -n smo get pods -l cnpg.io/cluster=smo-pg,cnpg.io/instanceRole=replica -o jsonpath='{.items[0].metadata.name}')
          [ "$(kubectl -n smo exec "$replica" -c postgres -- psql -U postgres -d smo -Atc 'SELECT pg_is_in_recovery()')" = "t" ]
          want=$(psql "SELECT count(*) FROM audit_log")
          for i in $(seq 1 30); do
            [ "$(kubectl -n smo exec "$replica" -c postgres -- psql -U postgres -d smo -Atc 'SELECT count(*) FROM audit_log')" -ge "$want" ] && break
            sleep 2
          done
          [ "$(kubectl -n smo exec "$replica" -c postgres -- psql -U postgres -d smo -Atc 'SELECT count(*) FROM audit_log')" -ge "$want" ]

      - name: Kill the primary while writes go through SME; the stack recovers and nothing committed is lost (PR-DB-7.4, PR-HA-3)
        working-directory: smo
        run: |
          primary=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.currentPrimary}')
          psql() { kubectl -n smo exec "$1" -c postgres -- psql -U postgres -d smo -Atc "$2"; }
          # a row the primary has committed and a replica has, before anything goes wrong
          psql "$primary" "CREATE TABLE IF NOT EXISTS public.ha_marker (n int)"
          psql "$primary" "INSERT INTO public.ha_marker VALUES (1)"
          sleep 5
          pod=$(kubectl -n smo get pod -l app.kubernetes.io/name=sme -o jsonpath='{.items[0].metadata.name}')
          kubectl -n smo exec "$pod" -- python3 -c "$(cat scripts/k8s_failover_probe.py)" > probe.log 2>&1 &
          probe=$!
          sleep 10
          echo "killing $primary"
          kubectl -n smo delete pod "$primary" --force --grace-period=0
          # a new primary, and the old pod back as a replica: three ready instances again
          for i in $(seq 1 120); do
            now=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.currentPrimary}')
            ready=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.readyInstances}')
            [ "$now" != "$primary" ] && [ "$ready" = "3" ] && break
            sleep 5
          done
          echo "primary was $primary, is $now, $ready instances ready"
          [ "$now" != "$primary" ] && [ "$ready" = "3" ]
          sleep 15
          kubectl -n smo exec "$pod" -- touch /tmp/stop
          wait "$probe" || { cat probe.log; echo "::error::writes did not recover, or took too long to"; exit 1; }
          cat probe.log
          echo "### Primary failover: $(tail -1 probe.log)" >> "$GITHUB_STEP_SUMMARY"
          # what was committed before is there on the new primary, and the audit chain still verifies
          [ "$(psql "$now" "SELECT count(*) FROM public.ha_marker")" = "1" ]
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py
          kubectl -n smo exec -i deploy/sme -- python3 - < scripts/compose_e2e_roles.py
          kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify
          psql "$now" "DROP TABLE public.ha_marker"

      - name: A planned switchover to a replica; writes go on, and nothing committed is lost (PR-HA-3.1)
        working-directory: smo
        run: |
          # the operator's planned switchover: the target primary is set, the old primary is demoted cleanly (a checkpoint, then it follows the new one), and the services keep writing
          # through it. A clean demotion should cost much less than the kill above, which has to be detected and then failed over.
          primary=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.currentPrimary}')
          target=$(kubectl -n smo get pods -l cnpg.io/cluster=smo-pg,cnpg.io/instanceRole=replica -o jsonpath='{.items[0].metadata.name}')
          psql() { kubectl -n smo exec "$1" -c postgres -- psql -U postgres -d smo -Atc "$2"; }
          psql "$primary" "CREATE TABLE IF NOT EXISTS public.ha_marker (n int)"
          psql "$primary" "INSERT INTO public.ha_marker VALUES (2)"
          sleep 5
          pod=$(kubectl -n smo get pod -l app.kubernetes.io/name=sme -o jsonpath='{.items[0].metadata.name}')
          kubectl -n smo exec "$pod" -- rm -f /tmp/stop
          kubectl -n smo exec "$pod" -- env FAILOVER_MAX_SECONDS=20 python3 -c "$(cat scripts/k8s_failover_probe.py)" > switch.log 2>&1 &
          probe=$!
          sleep 10
          echo "switching over from $primary to $target"
          kubectl -n smo patch cluster smo-pg --subresource=status --type=merge -p "{\"status\":{\"targetPrimary\":\"$target\",\"targetPrimaryTimestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"
          for i in $(seq 1 120); do
            now=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.currentPrimary}')
            ready=$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.readyInstances}')
            [ "$now" = "$target" ] && [ "$ready" = "3" ] && break
            sleep 3
          done
          echo "primary was $primary, is $now, $ready instances ready"
          [ "$now" = "$target" ] && [ "$ready" = "3" ]
          [ "$(kubectl -n smo get pod "$primary" -o jsonpath='{.metadata.labels.cnpg\.io/instanceRole}')" = "replica" ]
          sleep 15
          kubectl -n smo exec "$pod" -- touch /tmp/stop
          wait "$probe" || { cat switch.log; echo "::error::writes did not recover from the switchover, or took too long to"; exit 1; }
          cat switch.log
          echo "### Planned switchover: $(tail -1 switch.log)" >> "$GITHUB_STEP_SUMMARY"
          [ "$(psql "$now" "SELECT count(*) FROM public.ha_marker WHERE n = 2")" = "1" ]
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py
          kubectl -n smo exec -i deploy/sme -- python3 - < scripts/compose_e2e_roles.py
          kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify
          psql "$now" "DROP TABLE public.ha_marker"

      - name: What the cluster says, when it went wrong
        if: failure()
        run: |
          kubectl -n smo get pods,jobs,cluster -o wide || true
          # .lastTimestamp is empty on events.k8s.io events, so sort by creation: a probe failure or a kill of a Postgres instance shows here
          kubectl -n smo get events --sort-by=.metadata.creationTimestamp | tail -80 || true
          cat smo/probe.log probe.log 2>/dev/null || true
          # every Postgres instance, ready or not: a stopped primary shows Running with no restart while it shuts down
          for pod in $(kubectl -n smo get pods -l cnpg.io/cluster=smo-pg --no-headers -o custom-columns=:metadata.name); do
            echo "::group::$pod"; kubectl -n smo describe pod "$pod" | tail -30; kubectl -n smo logs "$pod" -c postgres --tail=40 || true
            kubectl -n smo logs "$pod" -c postgres --previous --tail=40 2>/dev/null || true; echo "::endgroup::"
          done
          for pod in $(kubectl -n smo get pods --no-headers | grep -vE 'Running|Completed' | cut -d' ' -f1); do
            echo "::group::$pod"; kubectl -n smo describe pod "$pod" | tail -40; kubectl -n smo logs "$pod" --all-containers --tail=60 || true; echo "::endgroup::"
          done
          kubectl -n smo logs job/migrate --tail=80 || true
          kubectl -n cnpg-system logs deploy/cnpg-controller-manager --tail=300 || true
