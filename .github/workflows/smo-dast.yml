name: SMO DAST

# PR-V-7: dynamic security scans of the running stack, nightly. They are not a merge gate (they take a while and a scanner's rules move under us); a run that finds
# something new fails, and the nightly failure is the signal. The same jobs run on a pull request that changes this workflow or smo/security/, so a change to them is tried.
#
#   ZAP API scan   the gateway's OpenAPI document (docs/openapi/r1-termination.json) against the live gateway: what an unauthenticated caller can reach. Baseline smo/security/zap-baseline.json.
#   testssl.sh     the TLS edge (https://localhost:8443 and :3443): protocols, ciphers, certificate. Baseline smo/security/testssl-baseline.json.
#   Nuclei         the default template set, severity low and above, against what is reachable from outside: the TLS edge of the gateway and of the GUI. Baseline smo/security/nuclei-baseline.json.
#
#   ZAP, with a token  job `dast-authenticated`: each module's own OpenAPI document, called through the gateway, as an rApp and as an SMO module
#                      (smo/scripts/dast_token.py, dast_gateway_spec.py). Same baseline file.
#
# Every tool's report is uploaded as an artifact. smo/security/README.md says how to triage a finding. Not done here (smo/docs/VALIDATION.md, V-7): a scan
# of each module on the internal network.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/smo-dast.yml"
      - "smo/security/**"
      - "smo/scripts/dast_baseline.py"
      - "smo/scripts/dast_token.py"
      - "smo/scripts/dast_gateway_spec.py"

permissions:
  contents: read

concurrency:
  group: smo-dast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # pinned by digest, like every image in the stack; bump them on purpose (the date of the pin is in smo/security/README.md).
  # ZAP is already on ghcr.io (no Docker Hub limit), so it is not mirrored. testssl.sh and Nuclei are Docker Hub images: their pins live in
  # smo/deploy/mirror/images.txt and the step "Use the GHCR image mirror" exports them as $SMO_IMAGE_TESTSSL_3_2 and $SMO_IMAGE_NUCLEI_V3_9_0
  # (the GHCR mirror's reference when it answers, the Docker Hub one otherwise).
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

jobs:
  dast:
    name: Scan the stack behind the TLS edge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Start the stack with the TLS edge
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env
          scripts/make_dev_certs.sh
          docker compose --profile tls up -d --build
          for i in $(seq 1 60); do
            curl -fsS --cacert certs/ca.crt https://localhost:8443/health > /dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS --cacert certs/ca.crt https://localhost:8443/bootstrap | grep -q apiEndpoints
          mkdir -p ../scan-out && chmod 777 ../scan-out

      - name: ZAP API scan of the gateway
        working-directory: smo
        run: |
          mkdir -p ../zap-wrk && cp docs/openapi/r1-termination.json ../zap-wrk/ && chmod -R a+rwX ../zap-wrk
          set +e
          # -I: ZAP's own exit status is not the verdict (the baseline comparison below is)
          docker run --rm --network smo_default -v "$PWD/../zap-wrk:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t r1-termination.json -f openapi -O http://r1-termination:8000 -r zap.html -J zap.json -I
          echo "zap exit $?"
          set -e
          cp ../zap-wrk/zap.html ../zap-wrk/zap.json ../scan-out/
          python3 scripts/dast_baseline.py zap security/zap-baseline.json ../scan-out/zap.json

      - name: testssl.sh against the TLS edge
        if: ${{ !cancelled() }}   # each scanner reports even when another found something
        working-directory: smo
        run: |
          # the certs directory is mode 0700 (it holds the CA key): the scanner's user gets the CA certificate alone, in a directory it can read
          cp certs/ca.crt ../scan-out/ca.crt
          set +e
          for port in 8443 3443; do
            docker run --rm --network host -v "$PWD/../scan-out:/out" "$SMO_IMAGE_TESTSSL_3_2" \
              --add-ca /out/ca.crt --severity LOW --jsonfile "/out/testssl-$port.json" --warnings off --quiet "localhost:$port" > "../scan-out/testssl-$port.txt" 2>&1
          done
          set -e
          status=0
          for port in 8443 3443; do
            echo "== port $port"
            tail -n 25 "../scan-out/testssl-$port.txt"
            python3 scripts/dast_baseline.py testssl security/testssl-baseline.json "../scan-out/testssl-$port.json" || status=1
          done
          exit $status

      - name: Nuclei, default templates, against the gateway and the GUI
        if: ${{ !cancelled() }}
        working-directory: smo
        run: |
          set +e
          # what is reachable from outside: the TLS edge in front of the gateway (:8443) and of the GUI (:3443). Not the containers' own ports: R1's /metrics is for the
          # scraper on the container network and is answered 404 at the edge (edge/nginx.conf), which this scan then checks.
          docker run --rm --network host -v "$PWD/../scan-out:/out" "$SMO_IMAGE_NUCLEI_V3_9_0" \
            -u https://localhost:8443 -u https://localhost:3443 -severity low,medium,high,critical -jsonl -o /out/nuclei.jsonl -silent
          set -e
          [ -e ../scan-out/nuclei.jsonl ] || : > ../scan-out/nuclei.jsonl   # nothing found: no file
          python3 scripts/dast_baseline.py nuclei security/nuclei-baseline.json ../scan-out/nuclei.jsonl

      - name: The stack's logs, when a step failed
        if: failure()
        working-directory: smo
        run: docker compose --profile tls logs --no-color --tail=40 r1-termination gui edge-tls

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-reports
          path: scan-out/
          retention-days: 30

  # The gateway's own document has one route for everything it proxies (`/{full_path}`), so a token alone reaches nothing behind it. Each module's document, with its
  # paths under the gateway's prefix for it (scripts/dast_gateway_spec.py), is what makes the scan call the module, as the caller the token says it is: an rApp (an invoker
  # without the enrollment secret, which the gateway's role policy restricts) or an SMO module (with it). The scan sends every documented method, so it changes data:
  # the stack is a throwaway.
  dast-authenticated:
    name: ZAP through the gateway with a token, ${{ matrix.role }} (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # the modules the gateway routes to (r1-termination/app/main.py ROUTES) that have a document in smo/docs/openapi; the reference rApps are not SMO modules.
      # Three groups per role (five, three and five modules), so that a job fits in its hour (a module's active scan took from 20 seconds to 17 minutes in the first run).
      matrix:
        include:
          - {role: rapp, group: a, modules: "sme dme onboarding rapp-mgmt ran-nf-oam"}
          - {role: rapp, group: b, modules: "nfo focom aimgf"}
          - {role: rapp, group: c, modules: "ran-analytics mdaf intent-service so-smos sa-smos"}
          - {role: internal, group: a, modules: "sme dme onboarding rapp-mgmt ran-nf-oam"}
          - {role: internal, group: b, modules: "nfo focom aimgf"}
          - {role: internal, group: c, modules: "ran-analytics mdaf intent-service so-smos sa-smos"}
    env:
      # docker-compose.load.yml: the gateway's per-caller rate limiter is off for this throwaway stack. ZAP's active scan sends thousands of requests from one caller; with the
      # limiter on, some of the answers to its paired true/false payloads were 429 and the others 422, which its boolean-based SQL injection rule (40018) reads as an injection
      # (HISTORY.md QA-9.1). The limiter itself is tested where it is meant to be (the stress lane, the unit and integration suites).
      COMPOSE_FILE: docker-compose.yml:docker-compose.load.yml:.ci-mirror/docker-compose.mirror.yml
      MODULES: ${{ matrix.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - name: Start the stack
        working-directory: smo
        run: |
          scripts/init_secrets.sh
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health > /dev/null 2>&1 && break; sleep 5; done
          curl -fsS http://localhost:8080/bootstrap | grep -q apiEndpoints
          mkdir -p ../scan-out

      - name: Scan each module through the gateway as ${{ matrix.role }}
        working-directory: smo
        run: |
          token=$(docker compose exec -T sme python - "${{ matrix.role }}" < scripts/dast_token.py)
          [ -n "$token" ] || { echo "::error::no token"; exit 1; }
          echo "::add-mask::$token"
          # a header that does not work would make this an unauthenticated scan: the token must open a proxied route (an unauthenticated call is 401)
          docker compose exec -T sme python -c "import httpx, sys; r = httpx.get('http://r1-termination:8000/dme/data-jobs', headers={'Authorization': 'Bearer ' + sys.argv[1]}, timeout=10); print('probe', r.status_code); sys.exit(1 if r.status_code in (401, 403) else 0)" "$token"
          network=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q r1-termination)")
          mkdir -p ../zap-wrk && chmod 777 ../zap-wrk
          status=0
          for m in $MODULES; do
            python3 scripts/dast_gateway_spec.py "docs/openapi/$m.json" "/$m" "../zap-wrk/$m.json"
            chmod a+r "../zap-wrk/$m.json"
            # scanner.maxScanDurationInMins: a module's active scan is cut at 5 minutes; -I: ZAP's own exit status is not the verdict (the baseline comparison is)
            # a second try only when ZAP wrote no report at all (it once could not bind its proxy port, "Address already in use", and scanned nothing)
            for attempt in 1 2; do
              docker run --rm --network "$network" -v "$PWD/../zap-wrk:/zap/wrk:rw" \
                -e ZAP_AUTH_HEADER=Authorization -e ZAP_AUTH_HEADER_VALUE="Bearer $token" -e ZAP_AUTH_HEADER_SITE=r1-termination "$ZAP_IMAGE" \
                zap-api-scan.py -t "$m.json" -f openapi -O http://r1-termination:8000 -r "zap-$m.html" -J "zap-$m.json" -I -z "-config scanner.maxScanDurationInMins=5" | grep -E "Number of Imported URLs|Total of|FAIL-NEW|WARN-NEW" || true
              [ -s "../zap-wrk/zap-$m.json" ] && break
              echo "::warning::ZAP wrote no report for $m (attempt $attempt)"
            done
            cp "../zap-wrk/zap-$m.html" "../zap-wrk/zap-$m.json" ../scan-out/ 2>/dev/null
            echo "== $m as ${{ matrix.role }}"
            python3 scripts/dast_baseline.py zap security/zap-baseline.json "../scan-out/zap-$m.json" || status=1
          done
          exit $status

      # Evidence for reading a "SQL Injection [40018]" that moves from route to route between runs: ZAP's boolean test compares responses, and a gateway that answers 429
      # (the per-caller limiter, 100 a second) or a 5xx to some of the requests makes them differ for reasons that are not the parameter.
      - name: What the gateway answered during the scan, by status
        if: ${{ always() }}
        working-directory: smo
        run: |
          docker compose exec -T sme python -c "import collections, httpx, re; c = collections.Counter(); [c.update({m.group(1): float(m.group(2))}) for m in re.finditer(r'^smo_http_requests_total\{.*status=\"(\d+)\".*\} ([0-9.e+]+)$', httpx.get('http://r1-termination:8000/metrics', timeout=10).text, re.M)]; print('gateway requests by status:', dict(sorted(c.items())))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The modules' errors, when a step failed
        if: failure()
        working-directory: smo
        run: docker compose logs --no-color --tail=2000 | grep -E "answered [45][0-9][0-9]|Traceback|Error" | sort | uniq -c | sort -rn | head -40

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-authenticated-${{ matrix.role }}-${{ matrix.group }}
          path: scan-out/
          retention-days: 30
