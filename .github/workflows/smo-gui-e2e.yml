name: SMO GUI browser checks

# PR-V-13: every page of the operator GUI opened in a real browser (Chromium, driven by Playwright) against the running compose stack, signed in as the admin:
# the page renders, the backend answers none of its calls with a 5xx or a 401, axe-core finds no serious or critical accessibility violation that
# smo/security/gui-axe-baseline.json does not accept, and a screenshot of each page is kept. smo/scripts/gui_e2e.py.
# Nightly, on demand, and on a pull request that changes the script, this workflow or the GUI's sources. Not a required check yet (a first slice).
#
# GUI-8.7 (PR-GUI-8): in the same job, a package that declares an operator page is onboarded after the GUI was built, with a stub rApp on the compose network, and the page
# is driven by the operator and the viewer (smo/scripts/gui_rapp_pages_e2e.py, smo/scripts/gui_rapp_stub.py): panels, the row drawer, a button and a row action reaching
# the rApp, no change button for the viewer, and the backend refusing a hand-made call (UNDECLARED_ROUTE, FORBIDDEN, RAPP_READ_ONLY).
#
# The second job, `oidc` (PR-SEC-6), starts the same stack with OIDC login switched on against a real Keycloak (the realm in
# smo/gui-bff/tests/keycloak/smo-realm.json) and drives the browser through the provider's own login page: smo/scripts/gui_oidc_e2e.py.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/smo-gui-e2e.yml"
      - "smo/scripts/gui_e2e.py"
      - "smo/scripts/gui_session_e2e.py"
      - "smo/scripts/gui_oidc_e2e.py"
      - "smo/scripts/gui_rapp_pages_e2e.py"
      - "smo/scripts/gui_rapp_stub.py"
      - "smo/samples/energy-saving-rapp.csar"
      - "smo/gui-bff/**"
      - "smo/security/gui-axe-baseline.json"
      - "smo/gui/**"

permissions:
  contents: read

concurrency:
  group: smo-gui-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gui:
    name: Every page of the GUI opens, and passes the accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smo/gui/package-lock.json

      - name: Start the stack
        working-directory: smo
        env:
          GUI_COOKIE_SECURE: "false"      # no TLS terminator in front of the GUI here
          GUI_OPERATOR_PASSWORD: ci-operator-pass-1     # the stack seeds these accounts on first start; throwaway, for this job's stack only
          GUI_VIEWER_PASSWORD: ci-viewer-pass-1
        run: |
          scripts/init_secrets.sh
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/ > /dev/null 2>&1 && break
            sleep 5
          done

      - name: Install the browser, and axe-core from the GUI's lockfile
        working-directory: smo
        run: |
          pip install -q --require-hashes -r requirements/smoke.txt
          python -m playwright install --with-deps chromium
          (cd gui && npm ci --ignore-scripts)

      - name: Open every page, check the accessibility of each
        working-directory: smo
        run: |
          # the generated admin password is in the BFF container (mode 0600, never in the log)
          GUI_E2E_PASSWORD=$(docker compose exec -T gui-bff cat /data/initial-admin-password) \
            python scripts/gui_e2e.py --base-url http://localhost:3000 --out "$RUNNER_TEMP/gui-e2e"

      - name: A package onboarded at run time gets its declared page, and the roles hold (GUI-8.7)
        working-directory: smo
        env:
          GUI_E2E_OPERATOR_PASSWORD: ci-operator-pass-1
          GUI_E2E_VIEWER_PASSWORD: ci-viewer-pass-1
        run: |
          # The GUI was built before this step: the packages below are onboarded NOW, so a page for them is drawn with no GUI rebuild. The stub rApp and the package host run
          # inside the compose network (the platform has to reach them), as the runbook's package server does (DEMO_RUNBOOK.md section 1).
          docker compose cp samples/energy-saving-rapp.csar r1-termination:/srv/scratch/energy-saving-rapp.csar
          docker compose cp scripts/gui_rapp_stub.py r1-termination:/srv/scratch/gui_rapp_stub.py
          docker compose exec -d -T r1-termination python3 /srv/scratch/gui_rapp_stub.py serve --csar /srv/scratch/energy-saving-rapp.csar --port 8898
          for i in $(seq 1 20); do
            docker compose exec -T r1-termination python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8898/_calls')" > /dev/null 2>&1 && break
            sleep 1
          done
          docker compose exec -T r1-termination python3 /srv/scratch/gui_rapp_stub.py setup --public http://r1-termination:8898 > "$RUNNER_TEMP/instances.json"
          cat "$RUNNER_TEMP/instances.json"
          # the admin is not used here: the operator drives the page, the viewer is refused
          python scripts/gui_rapp_pages_e2e.py --base-url http://localhost:3000 --instances "$RUNNER_TEMP/instances.json" --out "$RUNNER_TEMP/gui-e2e/rapp-pages" \
            --calls-command "docker compose exec -T r1-termination python3 -c \"import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8898/_calls').read().decode())\""

      - name: Sessions and roles in the browser (viewer, operator, admin)
        working-directory: smo
        env:
          GUI_E2E_OPERATOR_PASSWORD: ci-operator-pass-1
          GUI_E2E_VIEWER_PASSWORD: ci-viewer-pass-1
        run: |
          export GUI_E2E_PASSWORD=$(docker compose exec -T gui-bff cat /data/initial-admin-password)
          python scripts/gui_session_e2e.py --base-url http://localhost:3000
          # a short session: restart the backend with a 20 s lifetime and check that a sign-in ends
          GUI_COOKIE_SECURE=false GUI_SESSION_TTL_SECONDS=20 docker compose up -d gui-bff
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/permissions > /dev/null 2>&1 && break; sleep 2; done
          python scripts/gui_session_e2e.py --base-url http://localhost:3000 --expiry 20 --only-expiry

      - name: The stack's logs, when a step failed
        if: failure()
        working-directory: smo
        run: docker compose logs --no-color --tail=40 gui gui-bff r1-termination

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-e2e
          path: ${{ runner.temp }}/gui-e2e
          retention-days: 14

  oidc:
    name: Sign in through a real OIDC provider (Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: docker-compose.yml:.ci-mirror/docker-compose.mirror.yml
      # Keycloak is reached as http://keycloak:8180 from both sides (8180, not 8080: compose publishes R1 on the runner's 8080): the backend's container (a network alias on the compose network) and the
      # browser on this runner (an /etc/hosts entry below). The issuer Keycloak puts in its tokens is the same name (KC_HOSTNAME).
      # The Keycloak image is $SMO_IMAGE_KEYCLOAK_26_4, exported by the step "Use the GHCR image mirror" (its pin is smo/deploy/mirror/images.txt).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Start the stack with OIDC login on
        working-directory: smo
        env:
          GUI_COOKIE_SECURE: "false"      # no TLS terminator in front of the GUI here
          GUI_OIDC_ENABLED: "true"
          GUI_OIDC_ISSUER: http://keycloak:8180/realms/smo
          GUI_OIDC_ALLOW_HTTP: "true"     # a lab provider without TLS
          GUI_OIDC_CLIENT_ID: smo-gui
          GUI_OIDC_CLIENT_SECRET: ci-oidc-client-secret      # the throwaway client of the committed CI realm
          GUI_OIDC_REDIRECT_URI: http://localhost:3000/api/oidc/callback
          GUI_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/login
          GUI_OIDC_GROUP_ROLE_MAP: smo-admins=admin,smo-ops=operator,smo-viewers=viewer
          GUI_OIDC_PROVIDER_NAME: Keycloak
        run: |
          scripts/init_secrets.sh
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/ > /dev/null 2>&1 && break
            sleep 5
          done

      - name: Start Keycloak with the realm
        working-directory: smo
        run: |
          network=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q gui-bff)")
          docker run -d --name keycloak --network "$network" --network-alias keycloak -p 8180:8180 \
            -e KC_HOSTNAME=http://keycloak:8180 -e KC_HTTP_PORT=8180 -e KC_HTTP_ENABLED=true \
            -v "$PWD/gui-bff/tests/keycloak:/opt/keycloak/data/import:ro" \
            "$SMO_IMAGE_KEYCLOAK_26_4" start-dev --import-realm
          echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts
          for i in $(seq 1 60); do
            curl -fsS http://keycloak:8180/realms/smo/.well-known/openid-configuration > /dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://keycloak:8180/realms/smo/.well-known/openid-configuration | python -c "import json,sys; print(json.load(sys.stdin)['issuer'])"

      - name: The backend offers OIDC, and the local login stays
        working-directory: smo
        run: |
          curl -fsS http://localhost:3000/api/auth/config
          curl -fsS http://localhost:3000/api/auth/config | python -c "import json,sys; c=json.load(sys.stdin); assert c['localLogin'] and c['oidc']['enabled'], c"

      - name: Install the browser
        working-directory: smo
        run: |
          pip install -q --require-hashes -r requirements/smoke.txt
          python -m playwright install --with-deps chromium

      - name: Sign in through Keycloak in the browser (admin, operator, viewer, no group)
        working-directory: smo
        run: python scripts/gui_oidc_e2e.py --base-url http://localhost:3000

      - name: The logs, when a step failed
        if: failure()
        working-directory: smo
        run: |
          docker compose logs --no-color --tail=60 gui-bff
          docker logs --tail=60 keycloak

      - name: Stop Keycloak
        if: always()
        run: docker rm -f keycloak
