name: SMO mutation testing

# PR-V-2c: scripts/mutation_pilot.sh on 17 of the shared library's modules (the role policy, rate limiter, pagination and time helpers, the audit chain, idempotency,
# error handling, the outbound-webhook guard, body-size cap, kill switch, secret reader, ...) and, since PR-CONV-S1.4, the ProvMnS router `smo_shared/mns/` (DNs,
# errors, patch formats, scope and filter, class registry, operations, routes), since S1.3/S1.5 its checks, MSAC and dictionary, and since S1.6 the reference module
# Echo (`smo/echo/app`): a change no test notices fails the run.
# Weekly, on demand, and on a pull request that changes the script, its configuration or those modules or their tests. About an hour. Not a required check yet.

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/smo-mutation.yml"
      - "smo/scripts/mutation_pilot.sh"
      # >>> modules: generated by scripts/modules.py from each <module>/module.yaml (mutation.watch); edit those, then run it with --write
      # --- echo/module.yaml
      - "smo/echo/**"
      # --- shared/module.yaml
      - "smo/shared/pyproject.toml"
      - "smo/shared/smo_shared/*.py"
      - "smo/shared/smo_shared/mns/*.py"
      - "smo/shared/smo_shared/mns/dictionary/*.py"
      - "smo/shared/tests/**"
      # <<< modules
      - "smo/requirements/mutation.*"

permissions:
  contents: read

concurrency:
  group: smo-mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: Every mutant of the security-relevant shared modules and of Echo is killed
    runs-on: ubuntu-latest
    timeout-minutes: 120          # 5,500 mutants of the shared library and Echo since S1.3 / S1.5 / S1.6 (about an hour on a 4-core runner)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install the dev requirements, mutmut and the shared library
        working-directory: smo
        run: |
          pip install --require-hashes -r requirements/dev.txt -r requirements/mutation.txt
          pip install --no-deps -e shared

      - name: Mutate, and run the tests against each mutant
        working-directory: smo
        run: scripts/mutation_pilot.sh
