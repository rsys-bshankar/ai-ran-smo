name: SMO upgrade and rollback on kind

# PR-V-10, V-11: a previous release is installed from its own chart and its own images (built from its tag), exercised, then upgraded to this checkout with `helm upgrade`,
# then rolled back with `helm rollback` so the previous release's code runs on the schema this checkout migrated. Two releases are tried: the previous one and the one before it
# (the 1.0 criterion "upgrade across two releases"). Both are read from the tags at run time (OPS-UPGRADE-LANE): the job "Which releases" runs scripts/upgrade_lane_targets.py matrix,
# which takes the newest final smo-v* tags the way scripts/check_previous_release_code.sh does, so a new release needs no change here. Checked after each step: every pod ready, the database at the right revision, the data written by the old release still there,
# the runbook replay (scripts/compose_e2e.py of the release that is running) passes, and the audit chain verifies.
# The rollback is promised to the release before only (expand and contract: this checkout keeps what the previous release needs). The release before that is upgraded from, not rolled
# back to: its own migrate step does not know a newer schema ("Can't locate revision"), which is a limit of that release's code, so the rollback step is skipped for it.
# A migration that cannot finish (V-11, second half; for the previous release only): a long transaction holds a lock on a table the newest revision alters (read at run time with
# scripts/upgrade_lane_targets.py tables), the migrate Job runs out of its deadline and the pre-upgrade hook fails. Checked: `helm upgrade` fails, no Deployment was touched (same
# generations), the database is at the revision it was and its tables, columns, indexes and constraints are unchanged (the migration is one transaction), every old pod is ready and
# the previous release's runbook passes; then the lock is released and the same upgrade runs (the next step).
# Nightly, on demand, and on a pull request that changes this workflow or the chart's upgrade path. Not a required check yet. A light load (scripts/load_run.py, 4 callers paced to 20 calls a second, as an SMO module) runs from a pod of its own through every step after the install (V-10) and is judged at the end
# (scripts/upgrade_load_verdict.py).
# Rewrite mode (smo/scripts/rewrite_mode.json, plan task S0.8): until 1.0 the job `upgrade` skips its steps and passes with a notice naming that file, since the
# converged rewrite keeps nothing for the previous release; the job "Which releases" still runs. Plan task S8.8 switches the steps back on.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/smo-upgrade-kind.yml"
      - "smo/deploy/helm/**"
      - "smo/migrations/**"
      - "smo/scripts/load_run.py"
      - "smo/scripts/upgrade_load_verdict.py"
      - "smo/scripts/upgrade_lane_targets.py"
      - "smo/scripts/k8s_diag.sh"

permissions:
  contents: read

concurrency:
  group: smo-upgrade-kind-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The releases to start from: the newest final smo-v* tag (upgraded from, rolled back to, its load gated at two route errors: one dropped connection in ~330 calls
  # happened in 1 of 2 runs, docs/PERFORMANCE.md) and the one before it (upgraded from only, its load reported, not gated: two releases back is outside the rolling
  # guarantee). The verdicts are in scripts/upgrade_lane_targets.py. No tag found fails this job, so a checkout without tags never passes having tested nothing.
  targets:
    name: Which releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: The newest release tags
        id: matrix
        working-directory: smo
        run: |
          matrix=$(python3 scripts/upgrade_lane_targets.py matrix)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  upgrade:
    name: "From ${{ matrix.from }}, upgrade${{ matrix.rollback && ' then roll back' || '' }}"
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cur

      # Rewrite mode (smo/scripts/rewrite_mode.json, plan task S0.8): this job installs a previous release and upgrades and rolls back across it, which
      # the converged rewrite does not keep until 1.0 (nothing is kept for 0.9.0 users, a revision may drop or rename in one step). While the switch is on,
      # every step below is skipped and the job passes with a notice naming the file. The steps stay; plan task S8.8 switches them back on.
      - name: Rewrite mode
        working-directory: cur/smo
        run: |
          if python3 scripts/rewrite_mode.py notice "From ${{ matrix.from }}, upgrade${{ matrix.rollback && ' then roll back' || '' }}"; then
            echo "SMO_REWRITE_MODE=true" >> "$GITHUB_ENV"
          fi

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        if: env.SMO_REWRITE_MODE != 'true'
        working-directory: cur/smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SMO_REWRITE_MODE != 'true'
        with:
          ref: ${{ matrix.from }}
          path: prev

      - name: Build the images of both
        if: env.SMO_REWRITE_MODE != 'true'
        run: |
          pip install --quiet pyyaml
          build() {   # build <checkout> <tag>
            (cd "$1/smo" && python scripts/release_images.py matrix | jq -c '.include[]' | while read -r row; do
              name=$(jq -r .name <<<"$row"); context=$(jq -r .context <<<"$row"); module=$(jq -r .module <<<"$row")
              # the base images named in this Dockerfile that the GHCR mirror holds (docs/MIRROR.md); none when the mirror is off
              mapfile -t mirror < <(python3 "$GITHUB_WORKSPACE/cur/smo/scripts/ci_mirror.py" build-contexts "$context")
              if [ -n "$module" ]; then
                docker build --quiet -t "local/smo-$name:$2" "${mirror[@]}" --build-arg "MODULE=$module" "$context" > /dev/null
              else
                docker build --quiet -t "local/smo-$name:$2" "${mirror[@]}" "$context" > /dev/null
              fi
            done)
          }
          build prev prev
          build cur cur
          docker image ls 'local/smo-*' | head -60

      - name: Create the cluster and load the images
        if: env.SMO_REWRITE_MODE != 'true'
        run: |
          kind create cluster --name smo --image "$SMO_IMAGE_KIND_NODE_V1_37_0" --wait 120s
          kind load docker-image --name smo $(docker image ls 'local/smo-*' --format '{{.Repository}}:{{.Tag}}')

      - name: Install the previous release from its own chart
        if: env.SMO_REWRITE_MODE != 'true'
        working-directory: prev/smo
        run: |
          helm install smo deploy/helm/smo -n smo --create-namespace -f deploy/helm/smo/ci/kind-values.yaml --set image.tag=prev --wait --timeout 12m
          kubectl -n smo get pods
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py
          psql() { kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "$1"; }
          echo "revision before: $(psql 'SELECT version_num FROM alembic_version')"
          psql 'SELECT count(*) FROM audit_log' > "$RUNNER_TEMP/audit_before"
          echo "audit rows written by the previous release: $(cat "$RUNNER_TEMP/audit_before")"

      - name: Start a light load through the gateway, from a pod of its own (V-10)
        if: env.SMO_REWRITE_MODE != 'true'
        working-directory: cur/smo
        run: |
          # the load is the current checkout's script, run by the current image (it has httpx), as an SMO module: it holds the enrollment secret like one. It keeps running through
          # everything below (a second revision, the failed migration, the upgrade, the rollback) and is stopped and judged by the last step of the job. Its token is the previous release's.
          kubectl -n smo apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata: { name: loadgen, labels: { app.kubernetes.io/name: loadgen } }
          spec:
            restartPolicy: Never
            containers:
              - name: load
                image: local/smo-r1-termination:cur
                imagePullPolicy: Never
                command: ["sleep", "10800"]
                env: [{ name: SMO_ENROLLMENT_SECRET_FILE, value: /enroll/enrollment_secret }]    # not under /run/secrets: /var/run is a link to /run, and the service account's mount goes there
                volumeMounts: [{ name: secrets, mountPath: /enroll, readOnly: true }]
            volumes:
              - name: secrets
                secret: { secretName: smo-secrets, items: [{ key: enrollment-secret, path: enrollment_secret }] }
          EOF
          kubectl -n smo wait --for=condition=ready pod/loadgen --timeout=120s
          kubectl -n smo exec -i loadgen -- sh -c 'cat > /tmp/load_run.py' < scripts/load_run.py
          kubectl -n smo exec loadgen -- sh -c 'cd /tmp && nohup python load_run.py --concurrency 4 --rate 20 --duration 10000 --warmup 5 --stop-file /tmp/stop --out /tmp/out --max-error-rate 1 > /tmp/load.log 2>&1 &'
          sleep 20
          kubectl -n smo exec loadgen -- sh -c 'for p in /proc/[0-9]*; do grep -q "[l]oad_run.py" "$p/cmdline" 2>/dev/null && exit 0; done; exit 1' || { kubectl -n smo exec loadgen -- cat /tmp/load.log; echo "::error::the load did not start"; exit 1; }

      - name: Record the pods' logs, events and database lock waits while the load runs
        if: env.SMO_REWRITE_MODE != 'true'
        working-directory: cur/smo
        run: |
          # a pod that is replaced takes its log with it, so every pod is followed from the moment it runs (scripts/k8s_diag.sh); printed by "What happened to the pods" below
          scripts/k8s_diag.sh start "$RUNNER_TEMP/diag"

      # an operator's history is install, upgrade, upgrade: the migrate Job of an upgrade is a pre-upgrade hook and is not run again by a rollback to it,
      # while the install's is a plain Job that a rollback to revision 1 runs again, with the old image, on the new schema. So the rollback goes to revision 2.
      - name: A second revision of the previous release (its history, as an operator has it)
        if: ${{ (matrix.rollback) && env.SMO_REWRITE_MODE != 'true' }}
        working-directory: prev/smo
        run: |
          helm upgrade smo deploy/helm/smo -n smo -f deploy/helm/smo/ci/kind-values.yaml --set image.tag=prev --set migrate.backoffLimit=7 --wait --timeout 12m
          helm history smo -n smo

      - name: A migration that cannot finish leaves the previous release serving, and changes nothing (V-11)
        if: ${{ (matrix.rollback) && env.SMO_REWRITE_MODE != 'true' }}
        working-directory: cur/smo
        run: |
          psql() { kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "$1"; }
          generations() { kubectl -n smo get deploy -o jsonpath='{range .items[*]}{.metadata.name}={.metadata.generation}{"\n"}{end}' | sort; }
          # every column, index and constraint outside the catalogues, as one digest: a migration that did not finish must leave it exactly as it was
          schema() { psql "SELECT md5(string_agg(x, ',' ORDER BY x)) FROM (
                SELECT table_schema || '.' || table_name || '.' || column_name || ' ' || data_type || ' ' || is_nullable AS x FROM information_schema.columns
                 WHERE table_schema NOT IN ('pg_catalog', 'information_schema')
                UNION ALL SELECT schemaname || '.' || indexname FROM pg_indexes WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
                UNION ALL SELECT conrelid::regclass::text || '.' || conname || ' ' || pg_get_constraintdef(oid) FROM pg_constraint
                 WHERE connamespace NOT IN ('pg_catalog'::regnamespace, 'information_schema'::regnamespace)) s"; }
          before=$(psql 'SELECT version_num FROM alembic_version'); generations > "$RUNNER_TEMP/generations_before"; schema > "$RUNNER_TEMP/schema_before"
          echo "database at $before; deployments: $(wc -l < "$RUNNER_TEMP/generations_before")"
          # a long transaction on a table that a revision of this upgrade alters: the newest such revision's first table that the database already has
          # (OPS-UPGRADE-LANE). The migration is one transaction, so a lock on any of them holds the whole of it.
          table=""
          while read -r rev candidate; do
            if [ "$(psql "SELECT to_regclass('$candidate') IS NOT NULL")" = "t" ]; then table=$candidate; echo "locking $table (altered by revision $rev)"; break; fi
          done < <(python3 scripts/upgrade_lane_targets.py tables --since "$before")
          [ -n "$table" ] || { echo "::error::no revision after $before alters a table the database has: nothing to hold the migration with"; exit 1; }
          kubectl -n smo exec postgres-0 -- psql -U smo -d smo -c "BEGIN; LOCK TABLE $table IN ACCESS EXCLUSIVE MODE; SELECT pg_sleep(900);" > "$RUNNER_TEMP/lock.log" 2>&1 &
          holder=$!
          sleep 8
          [ "$(psql "SELECT count(*) FROM pg_locks WHERE relation = to_regclass('$table') AND mode = 'AccessExclusiveLock' AND granted")" -ge 1 ]
          set +e
          helm upgrade smo deploy/helm/smo -n smo -f deploy/helm/smo/ci/kind-values.yaml --set image.tag=cur --set migrate.backoffLimit=0 --set migrate.activeDeadlineSeconds=60 --wait --timeout 6m
          status=$?
          set -e
          echo "helm upgrade exit status: $status"
          # release the lock whatever happened, so the checks below and the retry are not blocked by it
          psql "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE query LIKE '%pg_sleep(900)%' AND pid <> pg_backend_pid()" > /dev/null
          wait "$holder" || true
          [ "$status" != "0" ]
          helm history smo -n smo
          helm history smo -n smo | tail -1 | grep -q failed
          kubectl -n smo get jobs
          kubectl -n smo describe job migrate | tail -15 || true
          # nothing of the new release was applied
          generations > "$RUNNER_TEMP/generations_after"
          diff "$RUNNER_TEMP/generations_before" "$RUNNER_TEMP/generations_after"
          [ "$(psql 'SELECT version_num FROM alembic_version')" = "$before" ]
          diff "$RUNNER_TEMP/schema_before" <(schema)
          # the old release is serving
          [ "$(kubectl -n smo get deploy r1-termination -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')" = "prev" ]
          kubectl -n smo wait --for=condition=available deploy --all --timeout=180s
          [ "$(kubectl -n smo get pods --no-headers | grep -vE 'Running|Completed|Terminating|Error' | wc -l)" = "0" ]
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < ../../prev/smo/scripts/compose_e2e.py
          # the verifier is the previous release's here; one before 0.5.0 has a read race (smo_shared/audit.py verify read the head before and after the rows,
          # as columns): beside the load, which keeps writing audit rows, it can report a break that is only a row committed between its reads. A real break stays
          # on the second look; a race does not. The checkout's own verifier (below) does not race and runs once.
          kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify || { sleep 5; kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify; }

      - name: Upgrade to this checkout
        if: env.SMO_REWRITE_MODE != 'true'
        working-directory: cur/smo
        run: |
          helm upgrade smo deploy/helm/smo -n smo -f deploy/helm/smo/ci/kind-values.yaml --set image.tag=cur --wait --timeout 12m
          helm history smo -n smo
          for d in $(kubectl -n smo get deploy -o name); do kubectl -n smo rollout status "$d" --timeout=180s; done
          kubectl -n smo get pods
          [ "$(kubectl -n smo get pods --no-headers | grep -vE 'Running|Completed|Terminating' | wc -l)" = "0" ]
          head=$(python3 scripts/upgrade_lane_targets.py head)
          at=$(kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "SELECT version_num FROM alembic_version")
          echo "database at $at, this checkout's head $head"
          [ "$at" = "$head" ]

      - name: The data of the old release is there, and this release runs the runbook
        if: env.SMO_REWRITE_MODE != 'true'
        working-directory: cur/smo
        run: |
          psql() { kubectl -n smo exec postgres-0 -- psql -U smo -d smo -Atc "$1"; }
          before=$(cat "$RUNNER_TEMP/audit_before"); after=$(psql 'SELECT count(*) FROM audit_log')
          echo "audit rows: $before before the upgrade, $after after"
          [ "$after" -ge "$before" ]
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py
          kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify

      - name: Roll back to the previous release, on the schema this checkout migrated
        if: ${{ (matrix.rollback) && env.SMO_REWRITE_MODE != 'true' }}
        working-directory: prev/smo
        run: |
          helm rollback smo 2 -n smo --wait --timeout 12m
          helm history smo -n smo
          for d in $(kubectl -n smo get deploy -o name); do kubectl -n smo rollout status "$d" --timeout=180s; done
          kubectl -n smo get pods
          [ "$(kubectl -n smo get pods --no-headers | grep -vE 'Running|Completed|Terminating' | wc -l)" = "0" ]
          # the old release's code is back, the schema is the new one (a rollback does not undo a migration: that is the expand and contract rule)
          kubectl -n smo get deploy r1-termination -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
          [ "$(kubectl -n smo get deploy r1-termination -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')" = "prev" ]
          kubectl -n smo exec -i deploy/r1-termination -- python3 - < scripts/compose_e2e.py
          # the previous release's verifier again (see the step above): once more on a break, to tell a real one from the read race it had
          kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify || { sleep 5; kubectl -n smo exec deploy/r1-termination -- python -m smo_shared.audit verify; }

      - name: Stop the load and judge it (V-10)
        if: ${{ (!cancelled()) && env.SMO_REWRITE_MODE != 'true' }}
        working-directory: cur/smo
        run: |
          kubectl -n smo exec loadgen -- touch /tmp/stop
          for i in $(seq 1 60); do kubectl -n smo exec loadgen -- test -f /tmp/out/load-results.json && break; sleep 2; done
          mkdir -p ../../load-out
          kubectl -n smo exec loadgen -- cat /tmp/out/load-results.json > ../../load-out/load-results.json
          kubectl -n smo exec loadgen -- cat /tmp/out/load-results.md > ../../load-out/load-results.md
          { echo "### Load through the upgrade, from ${{ matrix.from }}"; echo; cat ../../load-out/load-results.md; } | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/upgrade_load_verdict.py ../../load-out/load-results.json ${{ matrix.verdict }}

      - name: Keep the load results
        if: ${{ (!cancelled()) && env.SMO_REWRITE_MODE != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-load-${{ matrix.from }}
          path: load-out/
          retention-days: 30

      - name: What happened to the pods while the load ran
        if: ${{ (!cancelled()) && env.SMO_REWRITE_MODE != 'true' }}
        working-directory: cur/smo
        run: |
          scripts/k8s_diag.sh stop "$RUNNER_TEMP/diag"
          scripts/k8s_diag.sh report "$RUNNER_TEMP/diag" | tee "$RUNNER_TEMP/diag/report.txt"

      - name: Keep the pods' logs
        if: ${{ (!cancelled()) && env.SMO_REWRITE_MODE != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-pod-logs-${{ matrix.from }}
          path: ${{ runner.temp }}/diag/
          retention-days: 14

      - name: Pod logs on failure
        if: ${{ (failure()) && env.SMO_REWRITE_MODE != 'true' }}
        run: |
          kubectl -n smo get pods -o wide || true
          kubectl -n smo get events --sort-by=.lastTimestamp | tail -60 || true
          for p in $(kubectl -n smo get pods --no-headers 2>/dev/null | grep -vE 'Running|Completed' | awk '{print $1}'); do echo "== $p"; kubectl -n smo logs "$p" --tail 40 --all-containers 2>&1 || true; done
          kubectl -n smo logs job/migrate --tail 60 2>&1 || true
