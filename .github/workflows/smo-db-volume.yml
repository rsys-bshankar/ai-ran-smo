name: SMO database at volume

# PR-V-6: a million alarms. Postgres 18 (the image compose uses) is migrated to head, loaded with 100 000 managed elements (1 000 000 alarms, 500 000 performance files;
# smo/scripts/load_seed.py), and the queries the list routes run are explained and timed (smo/scripts/db_volume_check.py): the ones that must use an index and the ones with a budget
# fail the run, the rest are reported. Then a restore drill: pg_dump (custom format, as scripts/db_backup.sh), pg_restore into a fresh database, row counts compared; the sizes and
# times are in the job summary. Also the upgrade itself over data (smo/scripts/upgrade_at_volume.py): a database migrated to the previous release's head, loaded with the same volume, then
# every newer revision applied one at a time and timed, with a budget: what an operator plans a maintenance window from. Nightly, on demand, and on a pull request that changes the scripts or this workflow. Not a required check yet.

on:
  schedule:
    - cron: "27 3 * * 0"
  workflow_dispatch:
    inputs:
      elements:
        description: "Managed elements to seed (each with 10 alarms and 5 performance files)"
        default: "100000"
  pull_request:
    paths:
      - ".github/workflows/smo-db-volume.yml"
      - "smo/scripts/db_volume_check.py"
      - "smo/scripts/load_seed.py"
      - "smo/scripts/upgrade_at_volume.py"
      - "smo/scripts/downgrade_with_data.py"

permissions:
  contents: read

concurrency:
  group: smo-db-volume-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  volume:
    name: A million alarms - plans, timings, restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELEMENTS: ${{ inputs.elements || '100000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # the release tags: the upgrade step starts from the previous release's last revision

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install the dependencies
        working-directory: smo
        run: |
          pip install --quiet --require-hashes -r requirements/runtime.txt
          pip install --quiet --no-deps -e shared

      - name: Start Postgres 18
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=smo -e POSTGRES_PASSWORD=smo -e POSTGRES_DB=smo \
            "$SMO_IMAGE_POSTGRES_18_ALPINE"
          for i in $(seq 1 30); do docker exec pg pg_isready -U smo && break; sleep 2; done

      - name: Migrate to head (timed), then seed (timed)
        working-directory: smo
        env:
          SMO_DATABASE_URL: postgresql+psycopg://smo:smo@localhost:5432/smo
        run: |
          t0=$(date +%s); python scripts/migrate.py; t1=$(date +%s)
          echo smo > "$RUNNER_TEMP/pw"
          python scripts/load_seed.py --elements "$ELEMENTS" --host localhost --password-file "$RUNNER_TEMP/pw"; t2=$(date +%s)
          { echo "### Database at volume, ${ELEMENTS} elements"; echo; echo "- migration of the empty database: $((t1 - t0)) s"; echo "- seed: $((t2 - t1)) s"; } | tee "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Query plans and timings
        working-directory: smo
        run: |
          python scripts/db_volume_check.py --out "$RUNNER_TEMP/plans.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upgrade over the data, one revision at a time (the previous release's head to this checkout's)
        working-directory: smo
        run: |
          tag=$(git tag --list 'smo-v*' --sort=-version:refname | grep -v -- '-rc\.' | head -1)
          [ -n "$tag" ] || { echo "::error::no release tag to start from (does the checkout fetch tags?)"; exit 1; }
          from=$(git -C .. ls-tree -r --name-only "$tag" -- smo/migrations/versions | grep -oE '/[0-9]{4}_' | tr -d '/_' | sort | tail -1)
          echo "previous release $tag, its last revision $from"
          docker exec pg psql -U smo -d postgres -c 'CREATE DATABASE smo_up'
          url=postgresql+psycopg://smo:smo@localhost:5432/smo_up
          SMO_DATABASE_URL="$url" python scripts/migrate.py --revision "$from"
          python scripts/load_seed.py --elements "$ELEMENTS" --host localhost --database smo_up --password-file "$RUNNER_TEMP/pw"
          { echo; echo "### Upgrade over the data, from $tag ($from), ${ELEMENTS} elements"; echo; } >> "$GITHUB_STEP_SUMMARY"
          python scripts/upgrade_at_volume.py --url "$url" --from-revision "$from" --budget-seconds 300 --out "$RUNNER_TEMP/upgrade.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The whole chain down and up again over the data (V-17)
        working-directory: smo
        run: |
          # the database of the step above is at head and holds the volume: every revision is undone in turn (the baseline cannot be), then applied again, and no table may hold fewer rows
          { echo; echo "### The whole chain down and up again over the data, ${ELEMENTS} elements"; echo; } >> "$GITHUB_STEP_SUMMARY"
          python scripts/downgrade_with_data.py --url postgresql+psycopg://smo:smo@localhost:5432/smo_up --out "$RUNNER_TEMP/downgrade.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore drill (timed), counts compared
        run: |
          count() { docker exec pg psql -U smo -d "$1" -Atc "SELECT (SELECT count(*) FROM ran_nf_oam.alarm) || ' ' || (SELECT count(*) FROM ran_nf_oam.pm_file) || ' ' || (SELECT count(*) FROM ran_nf_oam.managed_entity)"; }
          t0=$(date +%s)
          docker exec pg sh -c 'pg_dump -U smo -d smo --format=custom --no-owner --no-privileges' > "$RUNNER_TEMP/smo.dump"
          t1=$(date +%s)
          docker exec pg psql -U smo -d postgres -c 'CREATE DATABASE smo_restored'
          docker exec -i pg pg_restore -U smo -d smo_restored --no-owner --no-privileges < "$RUNNER_TEMP/smo.dump"
          t2=$(date +%s)
          before=$(count smo); after=$(count smo_restored)
          {
            echo; echo "### Restore drill"; echo
            echo "- dump: $((t1 - t0)) s, $(du -h "$RUNNER_TEMP/smo.dump" | cut -f1)"
            echo "- restore into a fresh database: $((t2 - t1)) s"
            echo "- alarm, performance file and element counts: before \`$before\`, after \`$after\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$before" = "$after" ]

      - name: Postgres log on failure
        if: ${{ failure() }}
        run: docker logs pg --tail 80 || true
