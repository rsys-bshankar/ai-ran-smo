name: SMO disaster recovery drill

# PR-HA-6: the recovery targets of docs/DISASTER_RECOVERY.md (RPO 15 minutes, RTO 1 hour), proved on every change to the backup scripts and weekly.
#
# A Postgres 18 migrated to head takes writes (one timestamped row a second); scripts/dr_backup.sh --loop ships the databases to an S3 bucket served by moto_server (a
# pip-installable S3 stand-in, requirements/dr.txt) every 20 s; then the database and the backup job are killed with no warning. A FRESH Postgres 18 is started and
# scripts/dr_drill.sh restores the newest off-site set into it: manifest checksums, migrate + models check, a smoke check, and the data-loss
# window (the last write the dead database acknowledged minus the newest row found after the restore). The job fails when the loss exceeds 900 s
# (RPO), the drill takes longer than 3600 s (RTO), or any check fails. A second drill with --rto-seconds 1 must fail, so the gate is known to bite.
# Timings and the loss window go to the job summary. The S3 side is moto, NOT real storage: the AWS CLI calls, the manifest and the retention are proved here, MinIO and AWS S3 themselves are still to be
# proved in a drill (docs/DISASTER_RECOVERY.md, section 8). moto replaced a MinIO image that could not be pulled.
# A second job runs the CloudNativePG side (smo/deploy/helm/smo/ci/cnpg-cluster-backup.yaml, never run in CI before): continuous WAL archiving and a base backup to the same kind of S3 stand-in,
# then a recovery into a NEW cluster to a chosen minute (point-in-time), where the rows before that minute are there and the row after it is not. It also reads the operator's own metrics
# for the two alerts (SmoBackupLate, SmoWalArchiveLate) from a real instance, so the alert expressions use names the operator exports.
# Not a required check yet.

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/smo-dr.yml"
      - "smo/scripts/dr_*.sh"
      - "smo/scripts/db_backup.sh"
      - "smo/scripts/db_restore.sh"
      - "smo/scripts/pg_env.sh"
      - "smo/backup/**"
      - "smo/requirements/dr.*"
      - "smo/deploy/helm/smo/ci/cnpg-*.yaml"
      - "smo/deploy/helm/smo/files/smo-alerts.rules.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/smo-dr.yml"
      - "smo/scripts/dr_*.sh"
      - "smo/scripts/db_backup.sh"
      - "smo/scripts/db_restore.sh"

permissions:
  contents: read

concurrency:
  group: smo-dr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  disaster-recovery:
    name: Off-site backup, kill, restore into a fresh Postgres - RPO 15 min, RTO 1 h
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGPASSWORD: smo
      AWS_ACCESS_KEY_ID: smo-ci-access
      AWS_SECRET_ACCESS_KEY: smo-ci-secret-key
      AWS_DEFAULT_REGION: us-east-1
      SMO_BACKUP_S3_BUCKET: smo-dr
      SMO_BACKUP_S3_ENDPOINT: http://localhost:9000
      SMO_BACKUP_INTERVAL: "20"
      RPO_SECONDS: "900"
      RTO_SECONDS: "3600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: Install the dependencies, and the Postgres 18 client (a pg_dump older than the server refuses)
        working-directory: smo
        run: |
          pip install --quiet --require-hashes -r requirements/runtime.txt
          pip install --quiet --no-deps -e shared
          pip install --quiet --require-hashes -r requirements/dr.txt       # moto_server and the AWS CLI
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          aws --version

      - name: Start moto_server (an S3 API on :9000) and make the bucket
        run: |
          nohup moto_server -H 127.0.0.1 -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:9000/moto-api/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:9000/moto-api/
          aws --endpoint-url "$SMO_BACKUP_S3_ENDPOINT" s3 mb "s3://$SMO_BACKUP_S3_BUCKET"

      - name: Start the source Postgres 18 and migrate it to head
        working-directory: smo
        env:
          SMO_DATABASE_URL: postgresql+psycopg://smo:smo@localhost:5432/smo
        run: |
          docker run -d --name pg-source -p 5432:5432 -e POSTGRES_USER=smo -e POSTGRES_PASSWORD=smo -e POSTGRES_DB=smo "$SMO_IMAGE_POSTGRES_18_ALPINE"
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 -U smo && break; sleep 2; done
          python scripts/migrate.py

      - name: Take writes, back up off-site every 20 s, and kill everything with no warning
        working-directory: smo
        env:
          SMO_DATABASE_URL: postgresql+psycopg://smo:smo@localhost:5432/smo
          SMO_BACKUP_GUI_DB: ${{ runner.temp }}/gui-bff.db
        run: |
          # the GUI backend's SQLite database, with a user (DB-6.5)
          python - <<'PY'
          import os, sqlite3
          db = sqlite3.connect(os.environ["SMO_BACKUP_GUI_DB"])
          db.execute("CREATE TABLE gui_user (username TEXT PRIMARY KEY, role TEXT)")
          db.execute("INSERT INTO gui_user VALUES ('admin', 'admin')")
          db.commit()
          PY
          # one timestamped row a second into a real table (periodic_run: a name and a time); the last one acknowledged is the high-water mark
          psql() { command psql -h localhost -U smo -d smo -Atq "$@"; }
          psql -c "INSERT INTO periodic_run SELECT 'probe-seed-' || g, clock_timestamp() FROM generate_series(1, 1000) g"
          ( n=0; while true; do
              n=$((n + 1))
              ts=$(psql -c "INSERT INTO periodic_run VALUES ('probe-w-$n', clock_timestamp()) RETURNING to_char(last_run_at AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS.US\"Z\"')") \
                && echo "$ts" > "$RUNNER_TEMP/high-water"
              sleep 1
            done ) &
          writer=$!
          scripts/dr_backup.sh --loop "$SMO_BACKUP_INTERVAL" > "$RUNNER_TEMP/backup.log" 2>&1 &
          backup=$!
          sleep 75                                     # three or four backup cycles, the last one part-way through the next interval
          echo "disaster at $(date -u +%FT%T.%NZ)"
          kill -9 "$writer" "$backup"
          docker rm -f pg-source
          cat "$RUNNER_TEMP/backup.log"
          [ "$(grep -c '^off-site backup ' "$RUNNER_TEMP/backup.log")" -ge 3 ]
          if grep -q FAILED "$RUNNER_TEMP/backup.log"; then echo "::error::a backup run failed"; exit 1; fi
          echo "last acknowledged write: $(cat "$RUNNER_TEMP/high-water")"

      - name: Start a fresh Postgres 18 and run the drill (RPO and RTO gates)
        working-directory: smo
        run: |
          docker run -d --name pg-target -p 5433:5432 -e POSTGRES_USER=smo -e POSTGRES_PASSWORD=smo -e POSTGRES_DB=postgres "$SMO_IMAGE_POSTGRES_18_ALPINE"
          for i in $(seq 1 30); do pg_isready -h localhost -p 5433 -U smo && break; sleep 2; done
          scripts/dr_drill.sh --admin-url postgresql+psycopg://smo:smo@localhost:5433/postgres \
            --probe public.periodic_run:last_run_at --high-water "$(cat "$RUNNER_TEMP/high-water")" \
            --rpo-seconds "$RPO_SECONDS" --rto-seconds "$RTO_SECONDS" --report "$RUNNER_TEMP/drill.json" | tee "$RUNNER_TEMP/drill.txt"
          # with a cadence of 20 s and a backup that takes seconds, far less than the RPO is lost: a loss near the RPO would mean the schedule is not running
          python - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "drill.json")))
          assert r["passed"], r
          assert r["dataLossSeconds"] <= 120, f"lost {r['dataLossSeconds']} s with a 20 s backup interval"
          PY
          {
            echo "### Disaster-recovery drill"; echo
            echo '```'; cat "$RUNNER_TEMP/drill.txt"; echo '```'; echo
            echo "Targets: RPO ${RPO_SECONDS} s, RTO ${RTO_SECONDS} s. The backup interval here is ${SMO_BACKUP_INTERVAL} s; the compose service defaults to 600 s."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The RTO gate fails a slow drill (a drill limited to one second must fail)
        working-directory: smo
        run: |
          if scripts/dr_drill.sh --admin-url postgresql+psycopg://smo:smo@localhost:5433/postgres --rto-seconds 1 > "$RUNNER_TEMP/gate.txt" 2>&1; then
            cat "$RUNNER_TEMP/gate.txt"; echo "::error::a drill limited to 1 s passed: the RTO gate does not bite"; exit 1
          fi
          grep -q "FAIL  recovery time" "$RUNNER_TEMP/gate.txt"

      - name: Docker logs on failure
        if: ${{ failure() }}
        run: |
          docker logs pg-source --tail 40 || true
          docker logs pg-target --tail 40 || true
          tail -40 "$RUNNER_TEMP/moto.log" || true

  # The Kubernetes side of the same promise: the WAL of a CloudNativePG cluster is archived continuously and a base backup is taken, both to an S3-compatible object store (moto on the
  # runner, reached from the kind node through the docker bridge); then a NEW cluster is recovered from that store to a minute in the middle of the writes.
  cnpg-wal-archive:
    name: CloudNativePG archives the WAL, and a new cluster recovers to a chosen minute
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_ACCESS_KEY_ID: smo-ci-access
      AWS_SECRET_ACCESS_KEY: smo-ci-secret-key
      AWS_DEFAULT_REGION: us-east-1
      POSTGRES_IMAGE_CNPG: ghcr.io/cloudnative-pg/postgresql:17.4@sha256:3c0ba08ea353c9705a755c113e4ae395be76553e0ed68076e5410cb09b9d17d9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PR-OPS-12.3: third-party images come from the GHCR mirror (smo/docs/MIRROR.md); one that does not answer is pulled from its upstream registry, with a warning.
      # Kill switch: set the repository variable SMO_IMAGE_MIRROR to off.
      - name: Use the GHCR image mirror
        working-directory: smo
        env:
          SMO_IMAGE_MIRROR: ${{ vars.SMO_IMAGE_MIRROR }}
        run: python3 scripts/ci_mirror.py setup

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smo/requirements/*.txt

      - name: moto_server on the runner, reachable from the cluster, and the bucket
        working-directory: smo
        run: |
          pip install --quiet --require-hashes -r requirements/dr.txt
          kind create cluster --name dr --image "$SMO_IMAGE_KIND_NODE_V1_37_0" --wait 180s
          gateway=$(docker network inspect kind -f '{{range .IPAM.Config}}{{println .Gateway}}{{end}}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          [ -n "$gateway" ] || { docker network inspect kind; echo "::error::no IPv4 gateway on the kind network"; exit 1; }
          echo "S3_ENDPOINT=http://$gateway:9000" >> "$GITHUB_ENV"
          nohup moto_server -H 0.0.0.0 -p 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:9000/moto-api/ && break; sleep 1; done
          aws --endpoint-url http://localhost:9000 s3 mb s3://smo-backups
          # the node can reach it
          docker exec dr-control-plane curl -fsS -o /dev/null "http://$gateway:9000/moto-api/"

      - name: Install the CloudNativePG operator (pinned, and its manifest checked)
        run: |
          curl -fsSL -o cnpg.yaml https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.25.1/cnpg-1.25.1.yaml
          echo "ece141801fef6507451a3032b1eda29e9fa15944b741fa7301701c781160ce41  cnpg.yaml" | sha256sum -c -
          kubectl apply --server-side -f cnpg.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=180s

      - name: A cluster with continuous archiving (the example of the repository, pointed at the stand-in)
        working-directory: smo
        run: |
          kubectl create namespace smo
          # the example's Secret and endpoint, with the CI values; archive_timeout is shortened so a quiet database ships a segment within a minute
          sed -e "s#http://minio.minio.svc:9000#$S3_ENDPOINT#" -e 's/replace-me/smo-ci-access/' -e 's/ACCESS_SECRET_KEY: smo-ci-access/ACCESS_SECRET_KEY: smo-ci-secret-key/' \
              -e 's/instances: 3/instances: 1/' -e 's/archive_timeout: "300"/archive_timeout: "60"/' deploy/helm/smo/ci/cnpg-cluster-backup.yaml > "$RUNNER_TEMP/cluster.yaml"
          grep -n "endpointURL\|ACCESS\|instances\|archive_timeout" "$RUNNER_TEMP/cluster.yaml"
          kubectl -n smo create secret generic smo-pg-owner --type=kubernetes.io/basic-auth --from-literal=username=smo --from-literal=password=ci-owner-password
          kubectl -n smo apply -f "$RUNNER_TEMP/cluster.yaml"
          kubectl -n smo wait --for=condition=Ready cluster/smo-pg --timeout=600s
          kubectl -n smo get cluster smo-pg
          # the operator says the archive works
          for i in $(seq 1 30); do
            [ "$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.conditions[?(@.type=="ContinuousArchiving")].status}')" = "True" ] && break
            sleep 5
          done
          [ "$(kubectl -n smo get cluster smo-pg -o jsonpath='{.status.conditions[?(@.type=="ContinuousArchiving")].status}')" = "True" ]

      - name: Write, take a base backup, write more, note the minute, write once more
        run: |
          pod=smo-pg-1
          psql() { kubectl -n smo exec "$pod" -c postgres -- psql -U postgres -d smo -Atc "$1"; }
          psql "CREATE TABLE public.dr_marker (n int, phase text)"
          psql "INSERT INTO public.dr_marker SELECT g, 'before-backup' FROM generate_series(1, 100) g"
          kubectl -n smo apply -f - <<'EOF'
          apiVersion: postgresql.cnpg.io/v1
          kind: Backup
          metadata: { name: base-1 }
          spec: { cluster: { name: smo-pg } }
          EOF
          started=$(date +%s)
          kubectl -n smo wait --for=jsonpath='{.status.phase}'=completed backup/base-1 --timeout=600s
          echo "BACKUP_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
          psql "INSERT INTO public.dr_marker SELECT g, 'after-backup' FROM generate_series(1, 50) g"
          sleep 3
          target=$(psql "SELECT to_char(now() AT TIME ZONE 'UTC', 'YYYY-MM-DD HH24:MI:SS.US') || '+00'")
          echo "RECOVERY_TARGET=$target" >> "$GITHUB_ENV"
          sleep 3
          psql "INSERT INTO public.dr_marker SELECT g, 'after-target' FROM generate_series(1, 25) g"
          # the segment holding all of it is shipped now (otherwise it waits for archive_timeout)
          psql "SELECT pg_switch_wal()"
          echo "minute to recover to: $target"

      - name: The WAL is in the bucket, and the operator's metrics carry what the alerts use
        run: |
          for i in $(seq 1 60); do
            wals=$(aws --endpoint-url http://localhost:9000 s3 ls --recursive s3://smo-backups/smo-pg/ | grep -c '/wals/' || true)
            [ "$wals" -ge 2 ] && break
            sleep 5
          done
          aws --endpoint-url http://localhost:9000 s3 ls --recursive s3://smo-backups/smo-pg/ | awk '{print $4}' | sed 's#[^/]*$##' | sort | uniq -c
          [ "$wals" -ge 2 ]
          aws --endpoint-url http://localhost:9000 s3 ls --recursive s3://smo-backups/smo-pg/ | grep -q '/base/'
          kubectl -n smo port-forward pod/smo-pg-1 9187:9187 > "$RUNNER_TEMP/pf.log" 2>&1 &
          pf=$!
          for i in $(seq 1 20); do curl -fsS http://localhost:9187/metrics > "$RUNNER_TEMP/cnpg-metrics.txt" 2> /dev/null && break; sleep 2; done
          kill "$pf" || true
          echo "archive and backup series the operator exports:"; grep -E '^cnpg_.*(archiv|backup)' "$RUNNER_TEMP/cnpg-metrics.txt" | cut -d' ' -f1 | sort -u
          grep -E '^cnpg_(collector_last_available_backup_timestamp|pg_stat_archiver_(seconds_since_last_archival|failed_count|archived_count)) ' "$RUNNER_TEMP/cnpg-metrics.txt"
          for m in cnpg_collector_last_available_backup_timestamp cnpg_pg_stat_archiver_seconds_since_last_archival cnpg_pg_stat_archiver_failed_count; do
            grep -q "^$m " "$RUNNER_TEMP/cnpg-metrics.txt" || { echo "::error::the operator does not export $m"; exit 1; }
          done
          last=$(awk '/^cnpg_collector_last_available_backup_timestamp /{printf "%d", $2}' "$RUNNER_TEMP/cnpg-metrics.txt")
          echo "last backup $(( $(date +%s) - last )) s ago"
          [ "$last" -gt 0 ] && [ $(( $(date +%s) - last )) -lt 900 ]

      - name: A NEW cluster recovers from the store to that minute
        run: |
          cat > "$RUNNER_TEMP/restored.yaml" <<EOF
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata: { name: smo-pg-restored }
          spec:
            instances: 1
            imageName: $POSTGRES_IMAGE_CNPG
            storage: { size: 2Gi }
            bootstrap:
              recovery:
                source: origin
                recoveryTarget: { targetTime: "$RECOVERY_TARGET" }
            externalClusters:
              - name: origin
                barmanObjectStore:
                  destinationPath: s3://smo-backups/smo-pg
                  serverName: smo-pg
                  endpointURL: $S3_ENDPOINT
                  s3Credentials:
                    accessKeyId: { name: smo-pg-backup-s3, key: ACCESS_KEY_ID }
                    secretAccessKey: { name: smo-pg-backup-s3, key: ACCESS_SECRET_KEY }
                  wal: { compression: gzip }
          EOF
          started=$(date +%s)
          kubectl -n smo apply -f "$RUNNER_TEMP/restored.yaml"
          kubectl -n smo wait --for=condition=Ready cluster/smo-pg-restored --timeout=900s
          seconds=$(( $(date +%s) - started ))
          psql() { kubectl -n smo exec smo-pg-restored-1 -c postgres -- psql -U postgres -d smo -Atc "$1"; }
          counts=$(psql "SELECT phase || '=' || count(*) FROM public.dr_marker GROUP BY phase ORDER BY phase" | tr '\n' ' ')
          echo "recovered in $seconds s: $counts"
          { echo "### CloudNativePG: archive and recover to a minute"; echo; echo "- base backup: ${BACKUP_SECONDS} s"; echo "- new cluster recovered to \`$RECOVERY_TARGET\` in ${seconds} s"; echo "- rows found: $counts"; } >> "$GITHUB_STEP_SUMMARY"
          # everything written before the minute is there, nothing written after it
          [ "$(psql "SELECT count(*) FROM public.dr_marker WHERE phase = 'before-backup'")" = "100" ]
          [ "$(psql "SELECT count(*) FROM public.dr_marker WHERE phase = 'after-backup'")" = "50" ]
          [ "$(psql "SELECT count(*) FROM public.dr_marker WHERE phase = 'after-target'")" = "0" ]
          [ "$seconds" -lt 3600 ]

      - name: What the cluster says, when it went wrong
        if: failure()
        run: |
          kubectl -n smo get cluster,backup,pods -o wide || true
          kubectl -n smo describe cluster smo-pg | tail -40 || true
          kubectl -n smo logs smo-pg-1 -c postgres --tail=60 || true
          kubectl -n smo logs -l cnpg.io/cluster=smo-pg-restored --all-containers --tail=60 || true
          kubectl -n cnpg-system logs deploy/cnpg-controller-manager --tail=60 || true
          tail -20 "$RUNNER_TEMP/moto.log" || true
